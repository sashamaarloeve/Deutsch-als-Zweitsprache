# Runs on every push and pull request: build, tests, content check and the accessibility check.
name: Checks
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check-content
      - run: npx playwright install --with-deps chromium
      - run: npm run offline
      - run: npm run a11y
