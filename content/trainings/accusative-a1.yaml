# Training: the Akkusativ (A1). Only the masculine article changes; objects, pronouns, verbs.
# Articles are shown in their gender colour: der blue, die red, das green, plural orange.
# Original content, written in German.
kind: lesson
id: accusative-a1
title: "Akkusativ"
level: A1
skill: grammar
minutes: 25
status: draft
description: "Viele Verben haben ein Objekt im Akkusativ: Ich sehe den Hund. Nur der maskuline Artikel ändert sich. Mit ein-, mein-, kein-Wörtern und den Pronomen mich, dich, ihn …"
canDo:
  - "Ich kann ein Akkusativobjekt und die Verben dazu erkennen."
  - "Ich kann „den“, „einen“, „meinen“ und „keinen“ mit maskulinen Nomen benutzen."
  - "Ich kann die Pronomen „mich“, „dich“, „ihn“, „sie“, „es“, „uns“, „euch“ benutzen."

articles:
  definite:
    label: "der, die, das"
    nom: [ der, die, das, die ]
    akk: [ den, die, das, die ]
  indefinite:
    label: "ein, eine"
    nom: [ ein, eine, ein, "" ]
    akk: [ einen, eine, ein, "" ]
  possessive:
    label: "mein, meine"
    nom: [ mein, meine, mein, meine ]
    akk: [ meinen, meine, mein, meine ]
  negative:
    label: "kein, keine"
    nom: [ kein, keine, kein, keine ]
    akk: [ keinen, keine, kein, keine ]

understand:
  - type: dialogue
    title: "Hör zu: Wer? und Wen/Was?"
    lines:
      - { who: Mia, say: "Ich <v>suche</v> <der>den</der> Schlüssel. <v>Siehst</v> du <der>den</der> Schlüssel?" }
      - { who: Ben, say: "Nein. Aber ich <v>sehe</v> <die>die</die> Tasche und <das>das</das> Handy." }
      - { who: Mia, say: "Danke! <v>Hast</v> du auch <der>einen</der> Stift? Ich <v>brauche</v> <der>einen</der> Stift." }
      - { who: Ben, say: "Ja, ich <v>habe</v> <der>einen</der> Stift und <die>eine</die> Tasche." }

  - type: text
    title: "Objekte und Fälle"
    body:
      - "Viele Verben haben ein Objekt. Ein Objekt kann im Akkusativ, im Dativ oder (selten) im Genitiv stehen. Das Verb bestimmt, welchen Fall es braucht. Deshalb sieht der Artikel manchmal anders aus."
      - "<p>Der Mann</p> <v>sieht</v> <der>den</der> Hund."
      - "Hier braucht das Verb „sehen“ ein Akkusativobjekt, deshalb wird aus „der Hund“ „den Hund“. Tipp: Das Akkusativobjekt findest du mit der Frage „Wen?“ oder „Was?“ (Wen sieht der Mann? – den Hund). Wichtiger ist aber: Lerne das Verb zusammen mit seinem Fall."

  - type: parts-lab
    title: "Dieselben Rollen, andere Reihenfolge"
    intro: "Wähle einen Satz und einen Teil für Position 1. Die Reihenfolge ändert sich, aber die Rollen bleiben gleich. Der Artikel zeigt die Rolle: „der Hund“ ist weiter das Subjekt, „den Mann“ ist weiter das Akkusativobjekt."
    roles:
      S: "wer macht es (Subjekt, Nominativ)"
      V: "Verb"
      A: "Objekt (Akkusativ)"
    sentences:
      - { parts: [ { t: der Hund, r: S }, { t: beißt, r: V }, { t: den Mann, r: A } ], starts: [ S, A ] }
      - { parts: [ { t: der Lehrer, r: S }, { t: lobt, r: V }, { t: den Schüler, r: A } ], starts: [ S, A ] }
      - { parts: [ { t: meine Tante, r: S }, { t: besucht, r: V }, { t: meinen Bruder, r: A } ], starts: [ S, A ] }

  - type: detective
    title: "Satz-Detektiv"
    intro: "Tippe einen Teil an. Du siehst die Frage, die ihn findet, und seine Rolle."
    roles:
      S: "Subjekt (Nominativ)"
      V: "Verb (Position 2)"
      T: "Zeit (kein Fall vom Verb)"
      A: "Akkusativobjekt"
    sentences:
      - parts: [ { t: Mia, r: S, q: "Wer kauft?" }, { t: kauft, r: V, q: "Was macht Mia?" }, { t: heute, r: T, q: "Wann kauft Mia einen Tisch?" }, { t: einen Tisch, r: A, q: "Was kauft Mia heute?" } ]

  - type: article-table
    title: "Die Artikel"
    intro: "Schau auf die Tabelle. Die Farbe zeigt das Genus vom Nomen: der blau, die rot, das grün, Plural orange. Nur eine Spalte ändert sich."
    kinds: [ definite, indefinite, possessive, negative ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: akk, label: Akkusativ }
    note: "Nur das Maskulinum ändert sich: der → <der>den</der>, ein → <der>einen</der>, mein → <der>meinen</der>, kein → <der>keinen</der>. die, das und der Plural bleiben gleich."

  - type: case-lab
    title: "Das Fall-Labor"
    intro: "Wähle einen Artikel, einen Fall und ein Nomen. Der Artikel, der sich ändert, ist markiert."
    kinds: [ definite, indefinite, possessive, negative ]
    cases:
      - id: nom
        label: Nominativ
        frame: [ "___ ist hier.", "___ sind hier." ]
        rule: "Nominativ: Wer? oder Was? – das Subjekt."
      - id: akk
        label: Akkusativ
        frame: "Ich sehe ___."
        rule: "Akkusativ: Wen? oder Was? – das Objekt. Nur der maskuline Artikel ändert sich."
    nouns:
      - { g: m, noun: Hund }
      - { g: m, noun: Tisch }
      - { g: f, noun: Katze }
      - { g: f, noun: Tasche }
      - { g: n, noun: Buch }
      - { g: n, noun: Handy }
      - { g: pl, noun: Kinder }

  - type: rule
    title: "Verben mit Akkusativobjekt"
    body:
      - "haben: Ich <v>habe</v> <der>einen</der> Bruder."
      - "sehen, suchen, brauchen: Wir <v>brauchen</v> <der>einen</der> Tisch."
      - "kaufen, essen, trinken: Er <v>trinkt</v> <der>den</der> Kaffee."
      - "lesen, mögen, möchten: Sie <v>liest</v> <das>ein</das> Buch."

  - type: rule
    title: "Pronomen im Akkusativ"
    body:
      - "ich → mich · du → dich · er → ihn · sie → sie · es → es · wir → uns · ihr → euch · sie/Sie → sie/Sie"
      - "Ich sehe <der>den</der> Hund. → Ich sehe <der>ihn</der>."
      - "Ich sehe <die>die</die> Katze. → Ich sehe <die>sie</die>."
      - "Ich liebe <v>dich</v>. Er ruft <v>mich</v> an."

  - type: rule
    title: "Achtung!"
    body:
      - "<x>Ich habe ein Bruder.</x> ✗ Ich habe <der>einen</der> Bruder. ✓"
      - "<x>Ich sehe der Hund.</x> ✗ Ich sehe <der>den</der> Hund. ✓"
      - "Feminin, Neutrum und Plural ändern sich nicht: Ich sehe <die>die</die> Katze. <x>Ich sehe den Katze.</x> ✗"

practice:
  - id: definite
    title: "den"
    count: 8
    concepts: [ case.akk-masculine, case.akk-articles ]
    instruction: "Welche Form ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Akkusativobjekt, maskulin: der → den."
    items:
      - type: article-pick
        kind: definite
        case: akk
        items:
          - { g: m, noun: Hund, frame: "Ich sehe ___ Hund." }
          - { g: m, noun: Tisch, frame: "Wir kaufen ___ Tisch." }
          - { g: m, noun: Apfel, frame: "Ich esse ___ Apfel." }
          - { g: m, noun: Bus, frame: "Er nimmt ___ Bus." }
          - { g: m, noun: Kaffee, frame: "Sie trinkt ___ Kaffee." }
          - { g: m, noun: Film, frame: "Wir sehen ___ Film." }
          - { g: m, noun: Schlüssel, frame: "Du suchst ___ Schlüssel." }
          - { g: m, noun: Stift, frame: "Ich brauche ___ Stift." }

  - id: indefinite
    title: "einen, eine, ein"
    count: 10
    concepts: [ case.akk-articles ]
    instruction: "Welche Form von „ein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Schau auf die Farbe: blau (der) → einen, rot (die) → eine, grün (das) → ein."
    items:
      - type: article-pick
        kind: indefinite
        case: akk
        items:
          - { g: m, noun: Bruder, frame: "Ich habe ___ Bruder." }
          - { g: f, noun: Schwester, frame: "Ich habe ___ Schwester." }
          - { g: n, noun: Fahrrad, frame: "Ich habe ___ Fahrrad." }
          - { g: m, noun: Hund, frame: "Wir haben ___ Hund." }
          - { g: f, noun: Katze, frame: "Wir haben ___ Katze." }
          - { g: n, noun: Auto, frame: "Er kauft ___ Auto." }
          - { g: m, noun: Tisch, frame: "Sie braucht ___ Tisch." }
          - { g: f, noun: Lampe, frame: "Sie braucht ___ Lampe." }
          - { g: n, noun: Buch, frame: "Ich lese ___ Buch." }
          - { g: m, noun: Tee, frame: "Ich möchte ___ Tee." }

  - id: possessive
    title: "meinen, meine, mein"
    count: 8
    concepts: [ case.akk-articles ]
    instruction: "Welche Form von „mein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Dieselbe Regel wie bei „ein“: Nur die maskuline Form ändert sich (mein → meinen)."
    items:
      - type: article-pick
        kind: possessive
        case: akk
        items:
          - { g: m, noun: Bruder, frame: "Ich besuche ___ Bruder." }
          - { g: f, noun: Oma, frame: "Ich besuche ___ Oma." }
          - { g: n, noun: Handy, frame: "Ich suche ___ Handy." }
          - { g: m, noun: Schlüssel, frame: "Du hast ___ Schlüssel." }
          - { g: f, noun: Tasche, frame: "Ich suche ___ Tasche." }
          - { g: pl, noun: Schuhe, frame: "Ich suche ___ Schuhe." }
          - { g: m, noun: Vater, frame: "Wir rufen ___ Vater an." }
          - { g: n, noun: Zimmer, frame: "Ich räume ___ Zimmer auf." }

  - id: negative
    title: "keinen, keine, kein"
    count: 8
    concepts: [ case.akk-articles ]
    instruction: "Welche Form von „kein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "„kein“ funktioniert wie „ein“: Nur die maskuline Form ändert sich (kein → keinen)."
    items:
      - type: article-pick
        kind: negative
        case: akk
        items:
          - { g: m, noun: Hund, frame: "Ich habe ___ Hund." }
          - { g: f, noun: Katze, frame: "Ich habe ___ Katze." }
          - { g: n, noun: Auto, frame: "Wir haben ___ Auto." }
          - { g: m, noun: Hunger, frame: "Ich habe ___ Hunger." }
          - { g: f, noun: Zeit, frame: "Er hat ___ Zeit." }
          - { g: pl, noun: Kinder, frame: "Sie haben ___ Kinder." }
          - { g: m, noun: Bruder, frame: "Du hast ___ Bruder." }
          - { g: n, noun: Geld, frame: "Ich habe ___ Geld." }

  - id: whom
    title: "Das Objekt finden"
    count: 8
    shuffle: true
    concepts: [ case.question-wen-was ]
    items:
      - { type: pick, instruction: "Welcher Teil ist das Akkusativobjekt?", prompt: "Der Mann sieht den Hund.", options: [ "Der Mann", "sieht", "den Hund" ], answer: "den Hund", explanation: "Wen sieht der Mann? – den Hund." }
      - { type: pick, instruction: "Welcher Teil ist das Akkusativobjekt?", prompt: "Wir kaufen einen Tisch.", options: [ "Wir", "kaufen", "einen Tisch" ], answer: "einen Tisch", explanation: "Was kaufen wir? – einen Tisch." }
      - { type: pick, instruction: "Welcher Teil ist das Akkusativobjekt?", prompt: "Mia liest ein Buch.", options: [ "Mia", "liest", "ein Buch" ], answer: "ein Buch", explanation: "Was liest Mia? – ein Buch." }
      - { type: pick, instruction: "Welcher Teil ist das Akkusativobjekt?", prompt: "Ben isst einen Apfel.", options: [ "Ben", "isst", "einen Apfel" ], answer: "einen Apfel", explanation: "Was isst Ben? – einen Apfel." }
      - { type: pick, instruction: "Welcher Teil ist das Akkusativobjekt?", prompt: "Die Kinder haben keinen Hund.", options: [ "Die Kinder", "haben", "keinen Hund" ], answer: "keinen Hund", explanation: "Wen oder was haben die Kinder nicht? – keinen Hund." }
      - { type: pick, instruction: "Welcher Teil ist das Akkusativobjekt?", prompt: "Anna sucht die Tasche.", options: [ "Anna", "sucht", "die Tasche" ], answer: "die Tasche", explanation: "Was sucht Anna? – die Tasche." }
      - { type: pick, instruction: "Welcher Teil ist das Subjekt?", prompt: "Den Hund sieht der Mann.", options: [ "Den Hund", "sieht", "der Mann" ], answer: "der Mann", explanation: "Wer sieht? – der Mann. Das Objekt „den Hund“ steht hier auf Position 1." }
      - { type: pick, instruction: "Welcher Teil ist das Subjekt?", prompt: "Einen Apfel isst die Frau.", options: [ "Einen Apfel", "isst", "die Frau" ], answer: "die Frau", explanation: "Wer isst? – die Frau." }

  - id: subject
    title: "Wer macht was?"
    count: 6
    shuffle: true
    concepts: [ case.akk-masculine, syntax.inversion ]
    instruction: "Das Objekt steht vorn. Welcher Teil ist das Subjekt?"
    items:
      - { type: pick, prompt: "Den Kuchen backt meine Oma.", options: [ "meine Oma", "den Kuchen" ], answer: "meine Oma", explanation: "Meine Oma backt. „den Kuchen“ ist das Akkusativobjekt (der Artikel „den“ zeigt es)." }
      - { type: pick, prompt: "Meinen Bruder besucht heute meine Tante.", options: [ "meine Tante", "meinen Bruder" ], answer: "meine Tante", explanation: "„meinen Bruder“ (meinen!) ist das Objekt, also ist „meine Tante“ das Subjekt." }
      - { type: pick, prompt: "Einen Tisch kauft Ben.", options: [ "Ben", "einen Tisch" ], answer: "Ben", explanation: "Ben kauft. „einen Tisch“ ist das Akkusativobjekt." }
      - { type: pick, prompt: "Den Film sieht Mia gern.", options: [ "Mia", "den Film" ], answer: "Mia", explanation: "Mia sieht. „den Film“ ist das Akkusativobjekt." }
      - { type: pick, prompt: "Einen Hund hat der Nachbar.", options: [ "der Nachbar", "einen Hund" ], answer: "der Nachbar", explanation: "„einen Hund“ ist das Objekt. „der Nachbar“ kann nur das Subjekt sein." }
      - { type: pick, prompt: "Die Katze sucht der Junge.", options: [ "der Junge", "die Katze" ], answer: "der Junge", explanation: "„die Katze“ sieht im Nominativ und Akkusativ gleich aus. Aber „der Junge“ (der!) kann nur das Subjekt sein." }

  - id: pronouns
    title: "Pronomen"
    count: 8
    concepts: [ case.akk-pronouns ]
    instruction: "Welches Pronomen ersetzt das Nomen?"
    explanation: "der → ihn, die → sie, das → es, Plural → sie."
    items:
      - { type: pick, sentence: "Ich sehe den Hund. Ich sehe ___.", options: [ ihn, er, sie, es ], answer: ihn }
      - { type: pick, sentence: "Ich sehe die Katze. Ich sehe ___.", options: [ sie, ihn, es, er ], answer: sie }
      - { type: pick, sentence: "Ich lese das Buch. Ich lese ___.", options: [ es, ihn, sie, er ], answer: es }
      - { type: pick, sentence: "Ich sehe die Kinder. Ich sehe ___.", options: [ sie, ihn, es, er ], answer: sie }
      - { type: pick, sentence: "Ich kaufe den Tisch. Ich kaufe ___.", options: [ ihn, er, sie, es ], answer: ihn }
      - { type: pick, sentence: "Ich suche die Lampe. Ich suche ___.", options: [ sie, ihn, es, er ], answer: sie }
      - { type: pick, sentence: "Ich habe das Auto. Ich habe ___.", options: [ es, ihn, sie, er ], answer: es }
      - { type: pick, sentence: "Ich kenne Ben. Ich kenne ___ gut.", options: [ ihn, er, sie, es ], answer: ihn }
      - { type: pick, sentence: "Anna kommt. Ich sehe ___.", options: [ sie, ihn, es, er ], answer: sie }

  - id: match
    title: "Paare"
    shuffle: false
    items:
      - type: pairs
        concepts: [ case.akk-masculine ]
        instruction: "Tippe ein Wort an, dann die Akkusativ-Form."
        pairs: [ [ der Hund, den Hund ], [ ein Tisch, einen Tisch ], [ mein Bruder, meinen Bruder ], [ kein Apfel, keinen Apfel ], [ der Film, den Film ] ]
      - type: pairs
        concepts: [ case.akk-pronouns ]
        instruction: "Tippe ein Pronomen an, dann die Akkusativ-Form."
        pairs: [ [ ich, mich ], [ du, dich ], [ er, ihn ], [ wir, uns ], [ ihr, euch ] ]
      - type: pairs
        concepts: [ case.akk-verbs ]
        instruction: "Tippe ein Verb an, dann den Satz mit Akkusativobjekt."
        pairs: [ [ haben, Ich habe einen Hund. ], [ kaufen, Wir kaufen den Tisch. ], [ sehen, Du siehst den Film. ], [ brauchen, Ich brauche einen Stift. ], [ suchen, Er sucht die Tasche. ] ]

  - id: correct
    title: "Was ist richtig?"
    count: 8
    concepts: [ case.akk-articles, case.akk-masculine ]
    instruction: "Tippe den richtigen Satz an."
    items:
      - type: pick
        options: [ "Ich habe einen Bruder.", "Ich habe ein Bruder.", "Ich habe eine Bruder." ]
        answer: "Ich habe einen Bruder."
        explanation: "„Bruder“ ist maskulin: ein → einen im Akkusativ."
      - type: pick
        options: [ "Wir kaufen den Tisch.", "Wir kaufen der Tisch.", "Wir kaufen die Tisch." ]
        answer: "Wir kaufen den Tisch."
        explanation: "„Tisch“ ist maskulin: der → den."
      - type: pick
        options: [ "Ich sehe die Katze.", "Ich sehe den Katze.", "Ich sehe der Katze." ]
        answer: "Ich sehe die Katze."
        explanation: "„Katze“ ist feminin: „die“ ändert sich nicht."
      - type: pick
        options: [ "Er hat keinen Hund.", "Er hat kein Hund.", "Er hat keine Hund." ]
        answer: "Er hat keinen Hund."
        explanation: "„Hund“ ist maskulin: kein → keinen."
      - type: pick
        options: [ "Ich lese ein Buch.", "Ich lese einen Buch.", "Ich lese eine Buch." ]
        answer: "Ich lese ein Buch."
        explanation: "„Buch“ ist Neutrum: „ein“ ändert sich nicht."
      - type: pick
        options: [ "Siehst du meinen Bruder?", "Siehst du mein Bruder?", "Siehst du meine Bruder?" ]
        answer: "Siehst du meinen Bruder?"
        explanation: "„Bruder“ ist maskulin: mein → meinen."
      - type: pick
        options: [ "Ich suche ihn.", "Ich suche er.", "Ich suche ihm." ]
        answer: "Ich suche ihn."
        explanation: "Das Akkusativ-Pronomen zu „er“ ist „ihn“."
      - type: pick
        options: [ "Er liebt mich.", "Er liebt ich.", "Er liebt mir." ]
        answer: "Er liebt mich."
        explanation: "ich → mich im Akkusativ."

  - id: puzzle
    title: "Satzpuzzle"
    count: 6
    concepts: [ case.akk-articles, syntax.verb-position-2 ]
    instruction: "Bringe die Wörter in die richtige Reihenfolge. Beginne mit dem Subjekt."
    explanation: "Subjekt, Verb auf Position 2, dann das Akkusativobjekt."
    items:
      - { type: sentence-order, words: "ich sehe den Hund", accept: [ "ich sehe den Hund" ] }
      - { type: sentence-order, words: "wir kaufen einen Tisch", accept: [ "wir kaufen einen Tisch" ] }
      - { type: sentence-order, words: "Anna liest ein Buch", accept: [ "Anna liest ein Buch" ] }
      - { type: sentence-order, words: "ich brauche meinen Stift", accept: [ "ich brauche meinen Stift" ] }
      - { type: sentence-order, words: "er hat keinen Bruder", accept: [ "er hat keinen Bruder" ] }
      - { type: sentence-order, words: "du suchst deinen Schlüssel", accept: [ "du suchst deinen Schlüssel" ] }
      - { type: sentence-order, words: "Mia trinkt einen Tee", accept: [ "Mia trinkt einen Tee" ] }

  - id: write
    title: "Schreiben"
    concepts: [ writing.simple-sentences, case.akk-articles ]
    instruction: "Schreibe 4 Sätze oder mehr. Benutze die Wörter."
    items:
      - type: free-writing
        task: "Schreibe über deine Sachen und deine Familie: Was hast du? Was brauchst du? Was hast du nicht?"
        words: [ ich habe, ich brauche, ich suche, einen, keinen, meinen ]
        minSentences: 4
        detect:
          - { label: "ein Akkusativ-Wort (den, einen, meinen, keinen, ihn …)", pattern: "\\b(den|einen|meinen|deinen|seinen|ihren|unseren|keinen|mich|dich|ihn)\\b", tip: "Noch kein maskulines Akkusativ-Wort (den, einen, meinen, keinen). Hast du ein maskulines Nomen?" }
        checklist:
          - "Bei maskulinen Nomen habe ich „den“, „einen“, „meinen“ oder „keinen“ benutzt."
          - "Das Verb steht auf Position 2."
          - "Jeder Satz beginnt mit einem großen Buchstaben und endet mit einem Punkt."
        model: "Ich habe einen Bruder und eine Schwester. Ich habe keinen Hund, aber ich habe eine Katze. Ich brauche einen Stift und ein Heft. Ich suche meinen Schlüssel."
