          - { en: "The verb is in position 2.", de: "Das Verb steht auf Position 2." }
          - { en: "Every sentence starts with a capital letter and ends with a full stop.", de: "Jeder Satz beginnt mit einem großen Buchstaben und endet mit einem Punkt." }
        model: "Ich habe einen Bruder und eine Schwester. Ich habe keinen Hund, aber ich habe eine Katze. Ich brauche einen Stift und ein Heft. Ich suche meinen Schlüssel."
