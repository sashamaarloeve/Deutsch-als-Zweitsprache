      - { type: sentence-build, accept: [ "das ist ein schön|es Haus" ], extras: [ er, e ], explanation: "Nominativ Neutrum nach „ein“: Endung -es." }
      - { type: sentence-build, accept: [ "Mia trinkt kalt|e Milch" ], extras: [ er, en ], explanation: "Akkusativ feminin ohne Artikel: Endung -e." }
      - { type: sentence-build, accept: [ "ich esse frisch|es Brot" ], extras: [ e, er ], explanation: "Akkusativ Neutrum ohne Artikel: Endung -es." }

