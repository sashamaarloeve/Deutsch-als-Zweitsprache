    instruction: "Baue den Satz. Die Endung ist ein eigenes Teil."
    items:
      - { type: sentence-build, accept: [ "ich sehe den klein|en Hund" ], extras: [ e, er ], explanation: "Akkusativ maskulin nach „den“: Endung -en." }
