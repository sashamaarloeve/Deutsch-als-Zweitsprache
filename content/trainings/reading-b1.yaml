# Training: reading comprehension, level B1. Original texts (invented names, no real people). Generated by a script, then edited by hand.
# Texts: heading + paragraphs. Every practice item shows its text (text: id) above the exercise.
kind: lesson
id: reading-b1
title:
  en: 'Reading: longer texts'
  de: 'Lesen: längere Texte'
level: B1
skill: reading
minutes: 30
status: draft
description:
  en: 'A report about working from home and a news text about a bicycle workshop, with four kinds of tasks: right or wrong, find the sentence, write the answer, match.'
  de: 'Ein Bericht über Arbeiten von zu Hause und ein Nachrichtentext über eine Fahrradwerkstatt, mit vier Aufgabenarten: richtig oder falsch, Satz finden, Antwort schreiben, zuordnen.'
canDo:
- en: I can understand longer texts about familiar topics.
  de: Ich kann längere Texte über vertraute Themen verstehen.
- en: I can find opinions, reasons and plans in a text.
  de: Ich kann Meinungen, Gründe und Pläne in einem Text finden.
texts:
- id: homeoffice
  heading: Arbeiten von zu Hause
  paragraphs:
  - Seit zwei Jahren darf Jana Weber zwei Tage pro Woche zu Hause arbeiten. Dadurch hat sich ihr Alltag verändert. Früher musste sie jeden Morgen eine Stunde mit dem Zug fahren. Heute spart sie diese Zeit und kann länger schlafen. „Ich bin zu Hause viel konzentrierter, weil mich niemand stört“, sagt sie.
  - 'Trotzdem sieht Jana auch Nachteile. Sie vermisst den Kontakt zu ihren Kolleginnen und Kollegen, mit denen sie früher in der Mittagspause gegessen hat. Außerdem fällt es ihr schwer, abends mit der Arbeit aufzuhören, wenn der Laptop immer auf dem Küchentisch steht. Deshalb hat sie sich feste Regeln gemacht: Um 17 Uhr schaltet sie den Computer aus, und am Wochenende arbeitet sie nie.'
  - Ihre Chefin findet das Modell gut, auch wenn manche Treffen jetzt online stattfinden. Jana würde sich wünschen, dass das Team einmal im Monat gemeinsam im Büro zusammenkommt. Dann könnte man auch wichtige Themen persönlich besprechen.
- id: werkstatt
  heading: Ein Fahrrad für alle
  paragraphs:
  - In der Stadt Lindenau gibt es seit einem Jahr eine Fahrradwerkstatt, in der alte Fahrräder repariert und anschließend verschenkt werden. Die Idee hatte die Lehrerin Sofia Ramos, nachdem sie gesehen hatte, wie viele Räder in den Kellern der Nachbarschaft standen. Heute arbeiten dort zwölf Freiwillige, die jeden Samstag Räder reparieren.
  - Wer ein Fahrrad braucht, muss nur seinen Namen aufschreiben und ein kleines Formular ausfüllen. Besonders Familien mit wenig Geld profitieren davon. Die Werkstatt wird von der Stadt mit Werkzeug unterstützt, aber Ersatzteile müssen die Freiwilligen selbst bezahlen. Deshalb sammeln sie Spenden.
  - 'Sofia Ramos wünscht sich, dass das Projekt bald größer wird: „Wenn wir einen zweiten Raum hätten, könnten wir doppelt so viele Räder reparieren.“ Für den nächsten Sommer plant die Gruppe außerdem einen Reparaturkurs für Jugendliche.'
understand:
- type: rule
  title:
    en: How to read
    de: So liest du
  body:
  - en: Read the whole text once. You do not need to understand every word.
    de: Lies zuerst den ganzen Text. Du musst nicht jedes Wort verstehen.
  - en: Look for names, numbers, times and places first.
    de: Suche zuerst Namen, Zahlen, Zeiten und Orte.
  - en: Then read the statement or the question. Go back to the text and find the sentence.
    de: Lies dann die Aussage oder die Frage. Gehe zurück in den Text und finde den Satz.
  - en: The statements use other words than the text. Look for the meaning, not only for the same words.
    de: Die Aussagen benutzen andere Wörter als der Text. Suche nach der Bedeutung, nicht nur nach denselben Wörtern.
  - en: If a word is new, read the sentence around it. You can often guess the meaning.
    de: Wenn ein Wort neu ist, lies den Satz um das Wort herum. Oft kannst du die Bedeutung erraten.
- type: text
  title:
    en: The four tasks
    de: Die vier Aufgaben
  body:
  - en: Right or wrong? Decide if a statement agrees with the text.
    de: Richtig oder falsch? Entscheide, ob eine Aussage zum Text passt.
  - en: Find the sentence. The statement uses other words. Find the sentence in the text that says the same.
    de: Den Satz finden. Die Aussage benutzt andere Wörter. Finde den Satz im Text, der dasselbe sagt.
  - en: Write the answer. Find the information in the text and write it down.
    de: Antwort schreiben. Finde die Information im Text und schreibe sie auf.
  - en: Match. Connect things that belong together.
    de: Zuordnen. Verbinde, was zusammengehört.
