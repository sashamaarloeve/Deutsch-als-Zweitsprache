      - { type: pick, text: werkstatt, prompt: Die Fahrradwerkstatt gibt es seit einem Jahr., options: [ richtig, falsch ], answer: richtig, explanation: 'Im Text steht: „In der Stadt Lindenau gibt es seit einem Jahr eine Fahrradwerkstatt, in der alte Fahrräder repariert und anschließend verschenkt werden.“' }
      - { type: pick, text: werkstatt, prompt: Die Fahrräder werden in der Werkstatt verkauft., options: [ richtig, falsch ], answer: falsch, explanation: 'Im Text steht: „In der Stadt Lindenau gibt es seit einem Jahr eine Fahrradwerkstatt, in der alte Fahrräder repariert und anschließend verschenkt werden.“' }
