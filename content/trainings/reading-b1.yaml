      - { type: pick, text: werkstatt, prompt: In der Werkstatt arbeiten zwölf Freiwillige., options: [ richtig, falsch ], answer: richtig, explanation: 'Im Text steht: „Heute arbeiten dort zwölf Freiwillige, die jeden Samstag Räder reparieren.“' }
      - { type: pick, text: werkstatt, prompt: Für Jugendliche ist ein Reparaturkurs geplant., options: [ richtig, falsch ], answer: richtig, explanation: 'Im Text steht: „Für den nächsten Sommer plant die Gruppe außerdem einen Reparaturkurs für Jugendliche.“' }
