      - { type: pick, text: homeoffice, prompt: Jana spart die Zeit für die Zugfahrt., options: [ richtig, falsch ], answer: richtig, explanation: 'Im Text steht: „Heute spart sie diese Zeit und kann länger schlafen.“' }
      - { type: pick, text: homeoffice, prompt: Jana isst zu Hause oft mit Kolleginnen und Kollegen zu Mittag., options: [ richtig, falsch ], answer: falsch, explanation: 'Im Text steht: „Sie vermisst den Kontakt zu ihren Kolleginnen und Kollegen, mit denen sie früher in der Mittagspause gegessen hat.“' }
