# Training: two-way prepositions (Wechselpräpositionen), A2. Wo? + Dativ, wohin? + Akkusativ.
# Meant to be done after the Dativ training (a soft hint, never a gate).
# Original content, written in German.
kind: lesson
id: two-way-prepositions-a2
title: "Wechselpräpositionen"
level: A2
skill: grammar
minutes: 30
status: draft
description: "an, auf, hinter, in, neben, über, unter, vor, zwischen: Dativ für einen Ort (Wo?), Akkusativ für eine Bewegung (Wohin?). Am besten nach dem Training „Dativ“."
canDo:
  - "Ich kann sagen, wo etwas ist (Dativ) und wohin etwas geht (Akkusativ)."
  - "Ich kann die Verbpaare liegen/legen, stehen/stellen und sitzen/setzen benutzen."
  - "Ich kann „im“, „am“, „ins“ und „ans“ benutzen."

articles:
  definite:
    label: "der, die, das"
    nom: [ der, die, das, die ]
    akk: [ den, die, das, die ]
    dat: [ dem, der, dem, den ]

understand:
  - type: dialogue
    title: "Hör zu: Wo und wohin?"
    lines:
      - { who: Mia, say: "Wo ist mein Buch? Ich suche es." }
      - { who: Ben, say: "Es <v>liegt</v> auf <das>dem</das> Sofa. Ich <v>lege</v> es auf <der>den</der> Tisch." }
      - { who: Mia, say: "Danke! Ich gehe jetzt in <die>die</die> Küche. Bist du in <die>der</die> Küche?" }
      - { who: Ben, say: "Nein, ich bin im Garten." }

  - type: text
    title: "Zwei Fälle, eine Präposition"
    body:
      - "Die meisten Präpositionen haben immer denselben Fall. Neun Präpositionen können den Dativ oder den Akkusativ haben. Sie heißen Wechselpräpositionen. Hier helfen die Fragen „Wo?“ und „Wohin?“ sehr."
      - "Wo? – ein Ort, nichts geht an einen neuen Ort → Dativ: Das Buch liegt auf <c>dem Tisch</c>."
      - "Wohin? – eine Bewegung an einen neuen Ort → Akkusativ: Ich lege das Buch auf <c>den Tisch</c>."

  - type: rule
    title: "Die neun Präpositionen"
    body:
      - "an · auf · hinter"
      - "in · neben · über"
      - "unter · vor · zwischen"

  - type: case-lab
    title: "Das Fall-Labor"
    intro: "Wähle ein Nomen und schau auf die beiden Sätze. Der Artikel, der sich ändert, ist markiert. Hier gibt es nur Dativ und Akkusativ."
    kinds: [ definite ]
    cases:
      - id: nom
        label: Nominativ
        frame: [ "___ ist hier.", "___ sind hier." ]
        rule: "Nominativ: das Subjekt."
      - id: dat
        label: "Dativ (Wo?)"
        frame: "Ich bin in ___."
        rule: "Wo? – Ich bin dort. → Dativ."
      - id: akk
        label: "Akkusativ (Wohin?)"
        frame: "Ich gehe in ___."
        rule: "Wohin? – Ich gehe dorthin. → Akkusativ."
    nouns:
      - { g: m, noun: Park }
      - { g: m, noun: Garten }
      - { g: f, noun: Küche }
      - { g: f, noun: Schule }
      - { g: n, noun: Zimmer }
      - { g: n, noun: Café }

  - type: rule
    title: "Verbpaare"
    body:
      - "Einige Verben gibt es als Paar: Das eine sagt, wo etwas ist, das andere sagt, dass sich etwas bewegt."
      - "liegen (Wo?): Das Buch <v>liegt</v> auf <der>dem</der> Tisch."
      - "legen (Wohin?): Ich <v>lege</v> das Buch auf <der>den</der> Tisch."
      - "stehen (Wo?): Die Lampe <v>steht</v> neben <das>dem</das> Sofa."
      - "stellen (Wohin?): Ich <v>stelle</v> die Lampe neben <das>das</das> Sofa."
      - "sitzen (Wo?): Das Kind <v>sitzt</v> auf <der>dem</der> Stuhl."
      - "setzen (Wohin?): Ich <v>setze</v> das Kind auf <der>den</der> Stuhl."

  - type: rule
    title: "Kurzformen"
    body:
      - "in + dem = im: Ich bin im Park."
      - "an + dem = am: Er steht am Fenster."
      - "in + das = ins: Wir gehen ins Kino."
      - "an + das = ans: Sie geht ans Fenster."
      - "auf + das = aufs ist auch möglich: Er legt es aufs Sofa."

  - type: rule
    title: "Achtung!"
    body:
      - "<x>Ich bin in die Schule.</x> ✗ Ich bin in <die>der</die> Schule. ✓ (Wo?)"
      - "<x>Ich gehe in der Schule.</x> ✗ Ich gehe in <die>die</die> Schule. ✓ (Wohin?)"
      - "Nur eine Bewegung an einen neuen Ort ist „Wohin?“. Wenn man sich innerhalb eines Ortes bewegt, ist es „Wo?“: Er läuft im Park. (Wo?)"
      - "Nicht jedes „an, auf, in“ ist eine Wechselpräposition mit einem Ort. Viele Verben haben eine feste Präposition mit festem Fall (warten auf + Akkusativ). Die lernst du mit dem Verb."

practice:
  - id: which
    title: "Wo oder wohin?"
    count: 8
    shuffle: true
    concepts: [ prep.two-way-wo-dat, prep.two-way-wohin-akk ]
    instruction: "Ist etwas an einem Ort oder geht es an einen neuen Ort? Welcher Fall passt?"
    items:
      - { type: pick, prompt: "Das Buch liegt auf dem Tisch.", options: [ Dativ, Akkusativ ], answer: Dativ, explanation: "Wo? Nichts bewegt sich: Dativ." }
      - { type: pick, prompt: "Ich lege das Buch auf den Tisch.", options: [ Dativ, Akkusativ ], answer: Akkusativ, explanation: "Wohin? Das Buch geht auf den Tisch: Akkusativ." }
      - { type: pick, prompt: "Wir sind in der Küche.", options: [ Dativ, Akkusativ ], answer: Dativ, explanation: "Wo? Wir sind dort: Dativ." }
      - { type: pick, prompt: "Wir gehen in die Küche.", options: [ Dativ, Akkusativ ], answer: Akkusativ, explanation: "Wohin? Wir gehen dorthin: Akkusativ." }
      - { type: pick, prompt: "Das Kind sitzt auf dem Stuhl.", options: [ Dativ, Akkusativ ], answer: Dativ, explanation: "Wo? „sitzen“ zeigt einen Ort: Dativ." }
      - { type: pick, prompt: "Ich setze das Kind auf den Stuhl.", options: [ Dativ, Akkusativ ], answer: Akkusativ, explanation: "Wohin? „setzen“ zeigt eine Bewegung: Akkusativ." }
      - { type: pick, prompt: "Er fährt in die Stadt.", options: [ Dativ, Akkusativ ], answer: Akkusativ, explanation: "Wohin? Er fährt in die Stadt: Akkusativ." }
      - { type: pick, prompt: "Er wohnt in der Stadt.", options: [ Dativ, Akkusativ ], answer: Dativ, explanation: "Wo? Er wohnt dort: Dativ." }

  - id: dative
    title: "Wo? (Dativ)"
    count: 8
    concepts: [ prep.two-way-wo-dat ]
    instruction: "Etwas ist an einem Ort. Welche Form ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Wo? → Dativ: dem (m), der (f), dem (n)."
    items:
      - type: article-pick
        kind: definite
        case: dat
        items:
          - { g: m, noun: Tisch, frame: "Das Buch liegt auf ___ Tisch." }
          - { g: f, noun: Lampe, frame: "Die Katze sitzt unter ___ Lampe." }
          - { g: n, noun: Sofa, frame: "Die Tasche liegt neben ___ Sofa." }
          - { g: m, noun: Schrank, frame: "Das Bild hängt über ___ Schrank." }
          - { g: f, noun: Tür, frame: "Der Hund steht vor ___ Tür." }
          - { g: n, noun: Haus, frame: "Das Auto steht hinter ___ Haus." }
          - { g: m, noun: Stuhl, frame: "Die Jacke hängt an ___ Stuhl." }
          - { g: f, noun: Küche, frame: "Wir sind in ___ Küche." }

  - id: accusative
    title: "Wohin? (Akkusativ)"
    count: 8
    concepts: [ prep.two-way-wohin-akk ]
    instruction: "Etwas geht an einen neuen Ort. Welche Form ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Wohin? → Akkusativ: den (m), die (f), das (n)."
    items:
      - type: article-pick
        kind: definite
        case: akk
        items:
          - { g: m, noun: Tisch, frame: "Ich lege das Buch auf ___ Tisch." }
          - { g: f, noun: Lampe, frame: "Die Katze springt unter ___ Lampe." }
          - { g: n, noun: Sofa, frame: "Ich stelle die Lampe neben ___ Sofa." }
          - { g: m, noun: Schrank, frame: "Ich hänge das Bild über ___ Schrank." }
          - { g: f, noun: Tür, frame: "Der Hund läuft vor ___ Tür." }
          - { g: n, noun: Haus, frame: "Er fährt das Auto hinter ___ Haus." }
          - { g: m, noun: Stuhl, frame: "Sie hängt die Jacke an ___ Stuhl." }
          - { g: f, noun: Küche, frame: "Wir gehen in ___ Küche." }

  - id: mix
    title: "Gemischt"
    count: 8
    shuffle: true
    concepts: [ prep.two-way-wo-dat, prep.two-way-wohin-akk ]
    instruction: "Schau auf das Verb: Ort oder Bewegung? Welche Form ist richtig?"
    explanation: "Ort (Wo?) → Dativ. Bewegung (Wohin?) → Akkusativ."
    items:
      - type: article-pick
        kind: definite
        case: dat
        items:
          - { g: m, noun: Garten, frame: "Die Kinder spielen in ___ Garten." }
          - { g: f, noun: Schule, frame: "Meine Schwester ist in ___ Schule." }
          - { g: n, noun: Bett, frame: "Das Kind liegt in ___ Bett." }
          - { g: m, noun: Bus, frame: "Wir sitzen in ___ Bus." }
      - type: article-pick
        kind: definite
        case: akk
        items:
          - { g: m, noun: Garten, frame: "Die Kinder laufen in ___ Garten." }
          - { g: f, noun: Schule, frame: "Meine Schwester geht in ___ Schule." }
          - { g: n, noun: Bett, frame: "Ich lege das Kind in ___ Bett." }
          - { g: m, noun: Bus, frame: "Wir steigen in ___ Bus." }

  - id: verbs
    title: "Verbpaare"
    count: 8
    shuffle: true
    concepts: [ prep.two-way-verb-pairs ]
    instruction: "Welches Verb ist richtig?"
    explanation: "liegen, stehen, sitzen = Ort (Dativ). legen, stellen, setzen = Bewegung (Akkusativ)."
    items:
      - { type: pick, sentence: "Das Buch ___ auf dem Tisch.", options: [ liegt, legt ], answer: liegt }
      - { type: pick, sentence: "Ich ___ das Buch auf den Tisch.", options: [ lege, liege ], answer: lege }
      - { type: pick, sentence: "Die Lampe ___ neben dem Sofa.", options: [ steht, stellt ], answer: steht }
      - { type: pick, sentence: "Ich ___ die Lampe neben das Sofa.", options: [ stelle, stehe ], answer: stelle }
      - { type: pick, sentence: "Das Kind ___ auf dem Stuhl.", options: [ sitzt, setzt ], answer: sitzt }
      - { type: pick, sentence: "Ich ___ das Kind auf den Stuhl.", options: [ setze, sitze ], answer: setze }
      - { type: pick, sentence: "Die Flasche ___ im Kühlschrank.", options: [ steht, stellt ], answer: steht }
      - { type: pick, sentence: "Er ___ die Flasche in den Kühlschrank.", options: [ stellt, steht ], answer: stellt }

  - id: match
    title: "Paare"
    shuffle: false
    items:
      - type: pairs
        concepts: [ prep.two-way-verb-pairs ]
        instruction: "Tippe ein Verb an, dann einen passenden Satz."
        pairs: [ [ liegen, Das Buch liegt auf dem Tisch. ], [ legen, Ich lege das Buch auf den Tisch. ], [ stehen, Die Lampe steht neben dem Sofa. ], [ stellen, Er stellt die Lampe neben das Sofa. ], [ sitzen, Das Kind sitzt auf dem Stuhl. ], [ setzen, Sie setzt das Kind auf den Stuhl. ] ]

  - id: short
    title: "im, am, ins, ans"
    count: 6
    shuffle: true
    concepts: [ prep.two-way-contractions ]
    instruction: "Welche Kurzform ist richtig?"
    explanation: "in + dem = im, in + das = ins, an + dem = am, an + das = ans."
    items:
      - { type: pick, sentence: "Wir sind ___ Kino. (Wo?)", options: [ im, ins, am, ans ], answer: im }
      - { type: pick, sentence: "Wir gehen ___ Kino. (Wohin?)", options: [ ins, im, am, ans ], answer: ins }
      - { type: pick, sentence: "Er steht ___ Fenster. (Wo?)", options: [ am, ans, im, ins ], answer: am }
      - { type: pick, sentence: "Er geht ___ Fenster. (Wohin?)", options: [ ans, am, im, ins ], answer: ans }
      - { type: pick, sentence: "Ich bin ___ Park. (Wo?)", options: [ im, ins, am, ans ], answer: im }
      - { type: pick, sentence: "Ich gehe ___ Café. (Wohin?)", options: [ ins, im, am, ans ], answer: ins }

  - id: correct
    title: "Was ist richtig?"
    count: 8
    concepts: [ prep.two-way-wo-dat, prep.two-way-wohin-akk ]
    instruction: "Tippe den richtigen Satz an."
    items:
      - type: pick
        options: [ "Das Buch liegt auf dem Tisch.", "Das Buch liegt auf den Tisch.", "Das Buch liegt auf der Tisch." ]
        answer: "Das Buch liegt auf dem Tisch."
        explanation: "Wo? → Dativ: dem Tisch."
      - type: pick
        options: [ "Ich lege das Buch auf den Tisch.", "Ich lege das Buch auf dem Tisch.", "Ich lege das Buch auf der Tisch." ]
        answer: "Ich lege das Buch auf den Tisch."
        explanation: "Wohin? → Akkusativ: den Tisch."
      - type: pick
        options: [ "Ich bin in der Schule.", "Ich bin in die Schule.", "Ich bin in den Schule." ]
        answer: "Ich bin in der Schule."
        explanation: "Wo? → Dativ feminin: der Schule."
      - type: pick
        options: [ "Ich gehe in die Schule.", "Ich gehe in der Schule.", "Ich gehe in dem Schule." ]
        answer: "Ich gehe in die Schule."
        explanation: "Wohin? → Akkusativ feminin: die Schule."
      - type: pick
        options: [ "Wir gehen ins Kino.", "Wir gehen im Kino.", "Wir gehen in Kino." ]
        answer: "Wir gehen ins Kino."
        explanation: "Wohin? in + das = ins."
      - type: pick
        options: [ "Die Katze sitzt unter dem Tisch.", "Die Katze sitzt unter den Tisch.", "Die Katze setzt unter dem Tisch." ]
        answer: "Die Katze sitzt unter dem Tisch."
        explanation: "„sitzen“ = Ort → Dativ."
      - type: pick
        options: [ "Er stellt die Flasche auf den Tisch.", "Er steht die Flasche auf den Tisch.", "Er stellt die Flasche auf dem Tisch." ]
        answer: "Er stellt die Flasche auf den Tisch."
        explanation: "„stellen“ = Bewegung → Akkusativ."
      - type: pick
        options: [ "Sie wohnt im Haus.", "Sie wohnt ins Haus.", "Sie wohnt in das Haus." ]
        answer: "Sie wohnt im Haus."
        explanation: "„wohnen“ = Ort → Dativ: in + dem = im."

  - id: puzzle
    title: "Satzpuzzle"
    count: 6
    concepts: [ prep.two-way-wo-dat, prep.two-way-wohin-akk, syntax.verb-position-2 ]
    instruction: "Bringe die Wörter in die richtige Reihenfolge."
    explanation: "Subjekt, Verb auf Position 2, dann der Rest."
    items:
      - { type: sentence-order, words: "das Buch liegt auf dem Tisch", accept: [ "das Buch liegt auf dem Tisch" ] }
      - { type: sentence-order, words: "ich lege das Buch auf den Tisch", accept: [ "ich lege das Buch auf den Tisch" ] }
      - { type: sentence-order, words: "die Katze sitzt unter dem Stuhl", accept: [ "die Katze sitzt unter dem Stuhl" ] }
      - { type: sentence-order, words: "wir gehen ins Kino", accept: [ "wir gehen ins Kino" ] }
      - { type: sentence-order, words: "er stellt die Lampe neben das Sofa", accept: [ "er stellt die Lampe neben das Sofa" ] }
      - { type: sentence-order, words: "die Kinder spielen im Garten", accept: [ "die Kinder spielen im Garten" ] }
      - { type: sentence-order, words: "ich hänge das Bild an die Wand", accept: [ "ich hänge das Bild an die Wand" ] }

  - id: write
    title: "Schreiben"
    concepts: [ writing.simple-sentences, prep.two-way-list ]
    instruction: "Schreibe 4 Sätze oder mehr. Benutze die Wörter."
    items:
      - type: free-writing
        task: "Beschreibe dein Zimmer: Wo sind deine Sachen? Wohin legst oder stellst du Sachen?"
        words: [ liegt, steht, auf dem, neben dem, ich lege, ich stelle ]
        minSentences: 4
        checklist:
          - "Für Orte (Wo?) habe ich den Dativ benutzt."
          - "Für Bewegungen (Wohin?) habe ich den Akkusativ benutzt."
          - "Ich habe „liegen/legen“ oder „stehen/stellen“ benutzt."
        model: "Mein Bett steht neben dem Fenster. Auf dem Tisch liegt mein Handy. Ich lege meine Jacke auf den Stuhl. Die Lampe stelle ich neben das Bett."
