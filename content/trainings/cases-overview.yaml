# Overview: the four German cases. No CEFR level (A0 = overview), a map before the dedicated case trainings.
# Original content, written in German.
kind: lesson
id: cases-overview
title: "Fälle: Übersicht"
level: A0
skill: grammar
minutes: 20
status: draft
description: "Eine Landkarte der vier Fälle (Nominativ, Akkusativ, Dativ, Genitiv): Was sie tun, wie sich die Artikel ändern und welche Verben und Präpositionen welchen Fall brauchen."
canDo:
  - "Ich weiß, dass es im Deutschen vier Fälle gibt und dass das Verb oder die Präposition den Fall bestimmt."
  - "Ich kann die Artikeltabelle lesen."
  - "Ich kenne typische Verben und Präpositionen für Akkusativ und Dativ."

articles:
  definite:
    label: "der, die, das"
    nom: [ der, die, das, die ]
    akk: [ den, die, das, die ]
    dat: [ dem, der, dem, den ]
    gen: [ des, der, des, der ]
  indefinite:
    label: "ein, eine"
    nom: [ ein, eine, ein, "" ]
    akk: [ einen, eine, ein, "" ]
    dat: [ einem, einer, einem, "" ]
    gen: [ eines, einer, eines, "" ]

understand:
  - type: text
    title: "Was sind Fälle?"
    body:
      - "Im Deutschen ändert sich die Form vom Artikel, wenn das Nomen im Satz eine andere Aufgabe hat. Die Aufgabe heißt Fall. Es gibt vier Fälle: Nominativ, Akkusativ, Dativ und Genitiv."
      - "<p>Der Mann</p> <v>gibt</v> <das>dem</das> Kind <der>einen</der> Ball."
      - "„der Mann“ ist das Subjekt (Nominativ). „dem Kind“ ist ein Objekt im Dativ. „einen Ball“ ist ein Objekt im Akkusativ."

  - type: rule
    title: "Die vier Fälle"
    body:
      - "Die markierten Wörter zeigen den Fall."
      - "Nominativ = das Subjekt (Wer macht es?). <c>Der Mann</c> sieht den Hund. → „der Mann“ ist der Nominativ."
      - "Akkusativ = ein Objekt. Ich sehe <c>den Mann</c>. → „den Mann“ ist der Akkusativ. „Ich“ ist das Subjekt (Nominativ)."
      - "Dativ = ein Objekt, oft eine Person. Ich helfe <c>dem Mann</c>. → „dem Mann“ ist der Dativ."
      - "Genitiv = Zugehörigkeit. Das ist das Auto <c>des Mannes</c>. → „des Mannes“ ist der Genitiv. Meistens in geschriebenen Texten. Das lernst du später."
      - "Tipp: Die Fragen Wer? – Wen? – Wem? – Wessen? können helfen. Wichtiger ist aber: Lerne jedes Verb mit seinem Fall."

  - type: article-table
    title: "Die Artikel: der, die, das"
    intro: "Schau auf die Tabelle. Die Farbe zeigt das Genus vom Nomen. Markierte Formen sind anders als im Nominativ."
    kinds: [ definite ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: akk, label: Akkusativ }
      - { id: dat, label: Dativ }
      - { id: gen, label: Genitiv }
    note: |-
      Akkusativ: Nur das Maskulinum ändert sich (der → <der>den</der>).
      Dativ: Alles ändert sich.
      Genitiv: <der>des</der> und <das>des</das> (+ -s am Nomen), <die>der</die> für Feminin und Plural.

  - type: article-table
    title: "Die Artikel: ein, eine"
    kinds: [ indefinite ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: akk, label: Akkusativ }
      - { id: dat, label: Dativ }
      - { id: gen, label: Genitiv }
    note: "„mein“, „dein“, „kein“ … funktionieren wie „ein“ und haben auch einen Plural."

  - type: table
    title: "Pronomen"
    intro: "Auch die Personalpronomen ändern sich mit dem Fall."
    head: [ Nominativ, Akkusativ, Dativ ]
    rows:
      - [ ich, mich, mir ]
      - [ du, dich, dir ]
      - [ er, ihn, ihm ]
      - [ sie (she), sie, ihr ]
      - [ es, es, ihm ]
      - [ wir, uns, uns ]
      - [ ihr, euch, euch ]
      - [ sie (they), sie, ihnen ]

  - type: rule
    title: "Das Verb bestimmt"
    body:
      - "Das sind Beispiele. Es gibt viele weitere Verben. Lerne ein neues Verb zusammen mit seinem Fall."
      - "Verben mit Akkusativobjekt, zum Beispiel: sehen, haben, kaufen, brauchen, suchen, lesen"
      - "Ich sehe <c>den Hund</c>."
      - "Wir kaufen <c>einen Tisch</c>."
      - "Sie liest <c>ein Buch</c>."
      - "Verben mit Dativobjekt, zum Beispiel: helfen, danken, gefallen, gehören, schmecken, antworten"
      - "Ich helfe <c>dem Kind</c>."
      - "Das Auto gehört <c>meiner Mutter</c>."
      - "Der Film gefällt <c>mir</c>."
      - "Verben mit Dativ- und Akkusativobjekt, zum Beispiel: geben, schenken, zeigen, schicken"
      - "Ich gebe <c>dem Kind</c> <c>einen Ball</c>."
      - "Sie schenkt <c>ihrer Oma</c> <c>eine Blume</c>."
      - "Wir zeigen <c>dem Gast</c> <c>die Stadt</c>."

  - type: rule
    title: "Die Präposition bestimmt"
    body:
      - "Das sind Beispiele. Lerne eine neue Präposition zusammen mit ihrem Fall."
      - "Immer Akkusativ, zum Beispiel: für, ohne, gegen, durch, um"
      - "Das Geschenk ist für <c>den Mann</c>."
      - "Wir gehen durch <c>den Park</c>."
      - "Sie kommt ohne <c>ihren Bruder</c>."
      - "Immer Dativ, zum Beispiel: mit, bei, von, zu, aus, nach, seit"
      - "Ich fahre mit <c>dem Bus</c>."
      - "Sie wohnt bei <c>ihrer Oma</c>."
      - "Er kommt aus <c>dem Haus</c>."
      - "Einige Präpositionen (in, an, auf …) können beides. Die lernst du später."

  - type: text
    title: "Wie geht es weiter?"
    body:
      - "Das Training „Akkusativ“ (A1) zeigt den Akkusativ Schritt für Schritt. Das Training „Dativ“ (A2) macht dasselbe für den Dativ."

practice:
  - id: which
    title: "Welcher Fall?"
    count: 8
    shuffle: true
    concepts: [ case.overview ]
    items:
      - { type: pick, instruction: "Welcher Fall ist „der Mann“?", prompt: "Der Mann schläft.", options: [ Nominativ, Akkusativ, Dativ ], answer: Nominativ, explanation: "Das Subjekt steht im Nominativ." }
      - { type: pick, instruction: "Welcher Fall ist „den Hund“?", prompt: "Ich sehe den Hund.", options: [ Nominativ, Akkusativ, Dativ ], answer: Akkusativ, explanation: "„sehen“ braucht ein Akkusativobjekt." }
      - { type: pick, instruction: "Welcher Fall ist „dem Mann“?", prompt: "Ich helfe dem Mann.", options: [ Nominativ, Akkusativ, Dativ ], answer: Dativ, explanation: "„helfen“ braucht ein Dativobjekt." }
      - { type: pick, instruction: "Welcher Fall ist „einen Ball“?", prompt: "Ich gebe dem Kind einen Ball.", options: [ Nominativ, Akkusativ, Dativ ], answer: Akkusativ, explanation: "„geben“ hat ein Akkusativobjekt (die Sache)." }
      - { type: pick, instruction: "Welcher Fall ist „dem Kind“?", prompt: "Ich gebe dem Kind einen Ball.", options: [ Nominativ, Akkusativ, Dativ ], answer: Dativ, explanation: "„geben“ hat ein Dativobjekt (die Person)." }
      - { type: pick, instruction: "Welcher Fall ist „die Frau“?", prompt: "Die Frau liest ein Buch.", options: [ Nominativ, Akkusativ, Dativ ], answer: Nominativ, explanation: "Das Subjekt steht im Nominativ." }
      - { type: pick, instruction: "Welcher Fall ist „dem Bus“?", prompt: "Wir fahren mit dem Bus.", options: [ Nominativ, Akkusativ, Dativ ], answer: Dativ, explanation: "„mit“ braucht immer den Dativ." }
      - { type: pick, instruction: "Welcher Fall ist „den Mann“?", prompt: "Das Geschenk ist für den Mann.", options: [ Nominativ, Akkusativ, Dativ ], answer: Akkusativ, explanation: "„für“ braucht immer den Akkusativ." }
      - { type: pick, instruction: "Welcher Fall ist „meiner Mutter“?", prompt: "Das Auto gehört meiner Mutter.", options: [ Nominativ, Akkusativ, Dativ ], answer: Dativ, explanation: "„gehören“ braucht ein Dativobjekt." }

  - id: verbs
    title: "Verben"
    count: 8
    shuffle: true
    concepts: [ case.verbs-decide ]
    items:
      - { type: pick, instruction: "Welchen Fall braucht das Verb?", prompt: "sehen", options: [ Akkusativ, Dativ, Dativ + Akkusativ ], answer: Akkusativ, explanation: "Ich sehe den Mann." }
      - { type: pick, instruction: "Welchen Fall braucht das Verb?", prompt: "helfen", options: [ Akkusativ, Dativ, Dativ + Akkusativ ], answer: Dativ, explanation: "Ich helfe dem Mann." }
      - { type: pick, instruction: "Welchen Fall braucht das Verb?", prompt: "kaufen", options: [ Akkusativ, Dativ, Dativ + Akkusativ ], answer: Akkusativ, explanation: "Ich kaufe einen Tisch." }
      - { type: pick, instruction: "Welchen Fall braucht das Verb?", prompt: "danken", options: [ Akkusativ, Dativ, Dativ + Akkusativ ], answer: Dativ, explanation: "Ich danke dir." }
      - { type: pick, instruction: "Welchen Fall braucht das Verb?", prompt: "gehören", options: [ Akkusativ, Dativ, Dativ + Akkusativ ], answer: Dativ, explanation: "Das Buch gehört mir." }
      - { type: pick, instruction: "Welchen Fall braucht das Verb?", prompt: "brauchen", options: [ Akkusativ, Dativ, Dativ + Akkusativ ], answer: Akkusativ, explanation: "Ich brauche einen Stift." }
      - { type: pick, instruction: "Welchen Fall braucht das Verb?", prompt: "geben", options: [ Akkusativ, Dativ, Dativ + Akkusativ ], answer: Dativ + Akkusativ, explanation: "Ich gebe dem Kind einen Ball." }
      - { type: pick, instruction: "Welchen Fall braucht das Verb?", prompt: "gefallen", options: [ Akkusativ, Dativ, Dativ + Akkusativ ], answer: Dativ, explanation: "Der Film gefällt mir." }
      - { type: pick, instruction: "Welchen Fall braucht das Verb?", prompt: "schenken", options: [ Akkusativ, Dativ, Dativ + Akkusativ ], answer: Dativ + Akkusativ, explanation: "Ich schenke meiner Oma eine Blume." }

  - id: prepositions
    title: "Präpositionen"
    count: 8
    shuffle: true
    concepts: [ case.prepositions-overview ]
    items:
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "für", options: [ Akkusativ, Dativ ], answer: Akkusativ, explanation: "für den Mann" }
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "mit", options: [ Akkusativ, Dativ ], answer: Dativ, explanation: "mit dem Mann" }
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "ohne", options: [ Akkusativ, Dativ ], answer: Akkusativ, explanation: "ohne den Hund" }
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "bei", options: [ Akkusativ, Dativ ], answer: Dativ, explanation: "bei der Oma" }
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "durch", options: [ Akkusativ, Dativ ], answer: Akkusativ, explanation: "durch den Park" }
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "von", options: [ Akkusativ, Dativ ], answer: Dativ, explanation: "von dem Lehrer" }
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "gegen", options: [ Akkusativ, Dativ ], answer: Akkusativ, explanation: "gegen die Wand" }
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "nach", options: [ Akkusativ, Dativ ], answer: Dativ, explanation: "nach dem Essen" }
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "um", options: [ Akkusativ, Dativ ], answer: Akkusativ, explanation: "um den Tisch" }
      - { type: pick, instruction: "Welchen Fall braucht die Präposition?", prompt: "aus", options: [ Akkusativ, Dativ ], answer: Dativ, explanation: "aus dem Haus" }

  - id: articles
    title: "Artikel"
    count: 8
    concepts: [ case.overview ]
    instruction: "Welche Form ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Akkusativ: Nur Maskulin ändert sich. Dativ: Alles ändert sich."
    items:
      - type: article-pick
        kind: definite
        case: akk
        items:
          - { g: m, noun: Hund, frame: "Ich sehe ___ Hund." }
          - { g: m, noun: Tisch, frame: "Wir kaufen ___ Tisch." }
          - { g: f, noun: Katze, frame: "Ich sehe ___ Katze." }
      - type: article-pick
        kind: definite
        case: dat
        items:
          - { g: m, noun: Mann, frame: "Ich helfe ___ Mann." }
          - { g: f, noun: Frau, frame: "Ich helfe ___ Frau." }
          - { g: n, noun: Kind, frame: "Ich danke ___ Kind." }
      - type: article-pick
        kind: indefinite
        case: akk
        items:
          - { g: m, noun: Apfel, frame: "Ich esse ___ Apfel." }
          - { g: n, noun: Buch, frame: "Ich lese ___ Buch." }
      - type: article-pick
        kind: indefinite
        case: dat
        items:
          - { g: f, noun: Freundin, frame: "Ich schreibe ___ Freundin." }
          - { g: m, noun: Freund, frame: "Ich schreibe ___ Freund." }

  - id: pronouns
    title: "Pronomen"
    count: 6
    shuffle: true
    concepts: [ case.pronouns-overview ]
    instruction: "Welches Pronomen ist richtig?"
    explanation: "Akkusativ: mich, dich, ihn … Dativ: mir, dir, ihm …"
    items:
      - { type: pick, sentence: "Ben ist hier. Ich sehe ___.", options: [ ihn, ihm, er ], answer: ihn }
      - { type: pick, sentence: "Ben ist hier. Ich helfe ___.", options: [ ihm, ihn, er ], answer: ihm }
      - { type: pick, sentence: "Du bist hier. Ich sehe ___.", options: [ dich, dir, du ], answer: dich }
      - { type: pick, sentence: "Du bist hier. Ich danke ___.", options: [ dir, dich, du ], answer: dir }
      - { type: pick, sentence: "Ich bin hier. Du siehst ___.", options: [ mich, mir, ich ], answer: mich }
      - { type: pick, sentence: "Ich bin hier. Das Buch gehört ___.", options: [ mir, mich, ich ], answer: mir }
