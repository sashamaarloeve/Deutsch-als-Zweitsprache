# Vocabulary training, level A1: vocabulary-family-a1. Original word selection and sentences (own work, no word lists copied).
# Each word has an article (nouns), plural, a meaning (simple German) and an example with the word marked <c>…</c>.
kind: lesson
id: vocabulary-family-a1
title: Familie und Freunde
level: A1
skill: vocabulary
minutes: 15
status: draft
description: '14 Wörter für Familie und Freunde, mit Artikel, Plural und einem Beispielsatz. Übungen: zuordnen, schreiben, Sätze, was passt nicht?'
canDo:
  - Ich kann meine Familie und meine Freunde benennen.
  - 'Ich kann sagen, wer jemand ist: Das ist meine Mutter.'
words:
  - { id: mutter, art: die, word: Mutter, pl: Mütter, meaning: Mama, ex: Meine <c>Mutter</c> kocht gern. }
  - { id: vater, art: der, word: Vater, pl: Väter, meaning: Papa, ex: Mein <c>Vater</c> arbeitet in einer Bank. }
  - { id: eltern, art: pl, word: Eltern, meaning: Mama und Papa, ex: Meine <c>Eltern</c> wohnen in Hamburg. }
  - { id: bruder, art: der, word: Bruder, pl: Brüder, meaning: Ein Junge oder Mann mit denselben Eltern wie ich, ex: Mein <c>Bruder</c> spielt Fußball. }
  - { id: schwester, art: die, word: Schwester, pl: Schwestern, meaning: Ein Mädchen oder eine Frau mit denselben Eltern wie ich, ex: Meine <c>Schwester</c> ist 15 Jahre alt. }
  - { id: kind, art: das, word: Kind, pl: Kinder, meaning: 'Ein kleiner Mensch, noch kein Erwachsener', ex: Das <c>Kind</c> spielt im Park. }
  - { id: oma, art: die, word: Oma, pl: Omas, meaning: Die Mutter von meiner Mutter oder von meinem Vater, ex: Meine <c>Oma</c> backt Kuchen. }
  - { id: opa, art: der, word: Opa, pl: Opas, meaning: Der Vater von meiner Mutter oder von meinem Vater, ex: Mein <c>Opa</c> liest die Zeitung. }
  - { id: onkel, art: der, word: Onkel, pl: Onkel, meaning: Der Bruder von meiner Mutter oder von meinem Vater, ex: Mein <c>Onkel</c> wohnt in Wien. }
  - { id: tante, art: die, word: Tante, pl: Tanten, meaning: Die Schwester von meiner Mutter oder von meinem Vater, ex: Meine <c>Tante</c> besucht uns am Sonntag. }
  - { id: freund, art: der, word: Freund, pl: Freunde, meaning: 'Ein Mann oder Junge, mit dem ich gern Zeit verbringe', ex: Ben ist mein <c>Freund</c>. }
  - { id: freundin, art: die, word: Freundin, pl: Freundinnen, meaning: 'Eine Frau oder ein Mädchen, mit der ich gern Zeit verbringe', ex: Mia ist meine <c>Freundin</c>. }
  - { id: familie, art: die, word: Familie, pl: Familien, meaning: 'Mutter, Vater und Kinder sind zusammen eine …', ex: Meine <c>Familie</c> ist groß. }
  - { id: baby, art: das, word: Baby, pl: Babys, meaning: Ein ganz kleines Kind, ex: Das <c>Baby</c> schläft. }
understand:
  - type: word-list
    title: Die Familie
    intro: Schau die Wörter an. Sprich sie laut und lies den Beispielsatz.
    words: [ mutter, vater, eltern, bruder, schwester, kind, baby, familie ]
  - type: word-list
    title: Mehr Familie und Freunde
    words: [ oma, opa, onkel, tante, freund, freundin ]
  - type: rule
    title: Nützliche Sätze
    body:
      - Das ist meine <c>Mutter</c>.
      - Ich habe einen <c>Bruder</c> und eine <c>Schwester</c>.
      - Hast du Geschwister? – Nein, ich habe keine Geschwister.
      - Mia ist meine Freundin.
  - type: rule
    title: Nomen mit Artikel und Plural lernen
    body:
      - 'Lerne jedes Nomen zusammen mit Artikel und Plural. Die Farben helfen: <der>der</der> blau, <die>die</die> rot, <das>das</das> grün, Plural orange.'
      - 'Viele Nomen ändern sich im Plural: der Bruder → die Brüder.'
practice:
  - id: cards
    title: Lernkarten
    kind: cards
  - id: pairs
    title: Zuordnen
    shuffle: false
    concepts:
      - vocab.family
      - vocab.noun-article
    instruction: Tippe ein deutsches Wort an, dann die Bedeutung.
    items:
      - { type: words-pairs, ids: [ mutter, vater, eltern, bruder, schwester, kind, oma, opa, onkel, tante, freund, freundin, familie, baby ], size: 5 }
  - id: memory
    title: Memory
    kind: memory
  - id: write
    title: Das Wort schreiben
    shuffle: true
    count: 8
    concepts:
      - vocab.family
      - vocab.noun-article
    instruction: 'Schreibe das deutsche Wort. Bei Nomen schreibe auch den Artikel (zum Beispiel: die Mutter).'
    items:
      - { type: words-write, ids: [ mutter, vater, eltern, bruder, schwester, kind, oma, opa, onkel, tante, freund, freundin, familie, baby ] }
  - id: sentences
    title: In Sätzen
    shuffle: true
    concepts:
      - vocab.family
    items:
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Mein Vater und meine ___ sind meine Eltern., options: [ Mutter, Schwester, Tante, Oma ], answer: Mutter, explanation: Mutter und Vater sind die Eltern. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Die Mutter von meinem Vater ist meine ___., options: [ Oma, Tante, Schwester, Freundin ], answer: Oma, explanation: Die Mutter vom Vater ist die Oma. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Der Bruder von meiner Mutter ist mein ___., options: [ Onkel, Opa, Freund, Vater ], answer: Onkel, explanation: Der Bruder von der Mutter ist der Onkel. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Das ___ ist erst drei Monate alt und schläft viel., options: [ Baby, Opa, Onkel, Freund ], answer: Baby, explanation: Mit drei Monaten ist man ein Baby. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: 'Meine Eltern, meine Schwester und ich: Wir sind eine ___.', options: [ Familie, Freundin, Tante, Oma ], answer: Familie, explanation: Eltern und Kinder zusammen sind eine Familie. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: 'Mia gehört nicht zu meiner Familie, aber ich habe sie gern. Sie ist meine ___.', options: [ Freundin, Tante, Schwester, Oma ], answer: Freundin, explanation: 'Eine Person, die man gern hat und die nicht zur Familie gehört, ist ein Freund oder eine Freundin.' }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: 'Mein Vater und meine Mutter, das sind meine ___.', options: [ Eltern, Kinder, Brüder, Tanten ], answer: Eltern, explanation: Mutter und Vater sind die Eltern. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Meine Schwester und mein Bruder sind noch klein. Sie sind ___., options: [ Kinder, Eltern, Omas, Tanten ], answer: Kinder, explanation: Kleine Geschwister sind Kinder. }
  - id: odd
    title: Was passt nicht?
    shuffle: true
    concepts:
      - vocab.family
    items:
      - { type: pick, instruction: 'Welches Wort gehört nicht zur Familie?', prompt: '', options: [ die Oma, der Opa, das Auto, die Tante ], answer: das Auto, explanation: Ein Auto ist keine Person. }
      - { type: pick, instruction: 'Welches Wort ist keine Person?', prompt: '', options: [ das Baby, das Kind, der Apfel, die Schwester ], answer: der Apfel, explanation: Ein Apfel ist Essen. }
      - { type: pick, instruction: 'Welches Wort ist keine Person?', prompt: '', options: [ die Freundin, der Onkel, die Eltern, das Wasser ], answer: das Wasser, explanation: Wasser ist ein Getränk. }
      - { type: pick, instruction: 'Welches Wort ist keine Frau oder kein Mädchen?', prompt: '', options: [ die Tante, die Oma, die Schwester, der Onkel ], answer: der Onkel, explanation: Ein Onkel ist ein Mann. }
