# Training: main clauses with longer sentences (A2): Dativ and Akkusativ objects, time, place, and the verb bracket.
# Original content, written in German.
kind: lesson
id: main-clauses-a2
title: "Hauptsätze: längere Sätze"
level: A2
skill: grammar
minutes: 30
status: draft
description: "Längere Aussagesätze mit Dativ- und Akkusativobjekt, Zeit und Ort und mit Verbklammer (Modalverb, Perfekt, trennbares Verb). Du lernst die normale Reihenfolge im Mittelfeld."
canDo:
  - "Ich kann längere Sätze mit Dativ- und Akkusativobjekt bauen."
  - "Ich kann Zeit, Objekte und Ort in eine gute Reihenfolge bringen."
  - "Ich kann die Verbklammer benutzen: Verb auf Position 2, zweiter Verbteil am Ende."

understand:
  - type: dialogue
    title: "Hör zu: längere Sätze"
    lines:
      - { who: Mia, say: "Ich <v>habe</v> gestern meiner Oma ein Buch <s>geschenkt</s>." }
      - { who: Ben, say: "Cool! Ich <v>muss</v> morgen meinem Bruder bei den Hausaufgaben <s>helfen</s>." }
      - { who: Mia, say: "<p>Heute</p> <v>rufe</v> ich meine Freundin <s>an</s>. Sie <v>zeigt</v> mir ihre neue Wohnung." }
      - { who: Ben, say: "Schön! Ich <v>gebe</v> dir die Adresse vom Café." }

  - type: text
    title: "Mehr Teile, dieselben Regeln"
    body:
      - "Auch in einem längeren Satz steht das Verb auf Position 2. Wenn es einen zweiten Verbteil gibt (Modalverb + Infinitiv, Perfekt, trennbares Verb), steht er am Ende."
      - "<p>Ich</p> <v>habe</v> gestern meiner Oma ein Buch <s>geschenkt</s>."
      - "Die Teile zwischen dem Verb und dem Ende sind das Mittelfeld:"
      - "gestern (Zeit)"
      - "meiner Oma (Dativobjekt)"
      - "ein Buch (Akkusativobjekt)"

  - type: parts-lab
    title: "Das Satzteile-Labor"
    intro: "Wähle einen Satz und einen Teil für Position 1. Das <v>Verb</v> bleibt auf Position 2. Ein zweiter Verbteil bleibt am Ende."
    roles:
      S: "wer (Subjekt)"
      V: "Verb"
      T: "wann (Zeit)"
      D: "wem (Dativ)"
      A: "was/wen (Akkusativ)"
      L: "wo (Ort)"
      E: "Verbende"
    sentences:
      - { parts: [ { t: ich, r: S }, { t: gebe, r: V }, { t: heute, r: T }, { t: dem Kind, r: D }, { t: einen Apfel, r: A } ], starts: [ S, T, D, A ] }
      - { parts: [ { t: Anna, r: S }, { t: schenkt, r: V }, { t: zum Geburtstag, r: T }, { t: ihrer Oma, r: D }, { t: eine Blume, r: A } ], starts: [ S, T, D, A ] }
      - { parts: [ { t: wir, r: S }, { t: haben, r: V }, { t: gestern, r: T }, { t: dem Gast, r: D }, { t: die Stadt, r: A }, { t: gezeigt, r: E } ], starts: [ S, T, D, A ] }
      - { parts: [ { t: ich, r: S }, { t: muss, r: V }, { t: morgen, r: T }, { t: meiner Mutter, r: D }, { t: im Garten, r: L }, { t: helfen, r: E } ], starts: [ S, T, D, L ] }
      - { parts: [ { t: Ben, r: S }, { t: ruft, r: V }, { t: heute, r: T }, { t: seine Freundin, r: A }, { t: an, r: E } ], starts: [ S, T, A ] }

  - type: detective
    title: "Satz-Detektiv"
    intro: "Tippe einen Teil an. Du siehst die Frage, die ihn findet, und seine Rolle."
    roles:
      S: "wer (Subjekt)"
      V: "Verb (Position 2)"
      T: "wann (Zeit)"
      D: "Dativobjekt"
      A: "Akkusativobjekt"
      E: "Verbende"
    sentences:
      - parts: [ { t: Wir, r: S, q: "Wer hat gezeigt?" }, { t: haben, r: V, q: "Welches Verb steht auf Position 2?" }, { t: gestern, r: T, q: "Wann haben wir die Stadt gezeigt?" }, { t: dem Gast, r: D, q: "Wem haben wir die Stadt gezeigt?" }, { t: die Stadt, r: A, q: "Was haben wir gezeigt?" }, { t: gezeigt, r: E, q: "Welcher Verbteil steht am Ende?" } ]

  - type: rule
    title: "Die normale Reihenfolge im Mittelfeld"
    body:
      - "Subjekt – Zeit – Dativ – Akkusativ – Ort"
      - "Ich schenke <en>heute</en> <st>meiner Oma</st> eine Blume."
      - "Andere Reihenfolgen sind möglich, um etwas zu betonen. Auf A2 benutzt du die normale Reihenfolge."

  - type: rule
    title: "Was kann auf Position 1 stehen?"
    body:
      - "Jeder einzelne Teil: <p>Ich</p> <v>gebe</v> heute dem Kind einen Apfel."
      - "<p>Heute</p> <v>gebe</v> ich dem Kind einen Apfel."
      - "<p>Dem Kind</p> <v>gebe</v> ich heute einen Apfel."
      - "Das Verb bleibt auf Position 2 und das Subjekt folgt dem Verb."

  - type: rule
    title: "Achtung!"
    body:
      - "<x>Ich habe gestern gezeigt dem Gast die Stadt.</x> ✗ Ich habe gestern dem Gast die Stadt <s>gezeigt</s>. ✓"
      - "<x>Gestern ich habe dem Gast die Stadt gezeigt.</x> ✗ <p>Gestern</p> <v>habe</v> ich dem Gast die Stadt <s>gezeigt</s>. ✓"
      - "<x>Ich gebe den Kind einen Apfel.</x> ✗ Ich gebe <das>dem</das> Kind <der>einen</der> Apfel. ✓"

practice:
  - id: which
    title: "Welcher Teil?"
    count: 8
    shuffle: true
    concepts: [ syntax.parts, case.dat-before-akk ]
    items:
      - { type: pick, instruction: "Welcher Teil ist das Dativobjekt? Frage: Wem?", prompt: "Ich gebe heute dem Kind einen Apfel.", options: [ "Ich", "gebe", "heute", "dem Kind", "einen Apfel" ], answer: "dem Kind", explanation: "Wem gebe ich einen Apfel? – dem Kind." }
      - { type: pick, instruction: "Welcher Teil ist das Akkusativobjekt? Frage: Was?", prompt: "Ich gebe heute dem Kind einen Apfel.", options: [ "Ich", "gebe", "heute", "dem Kind", "einen Apfel" ], answer: "einen Apfel", explanation: "Was gebe ich? – einen Apfel." }
      - { type: pick, instruction: "Welcher Teil sagt wann? Frage: Wann?", prompt: "Anna schenkt zum Geburtstag ihrer Oma eine Blume.", options: [ "Anna", "zum Geburtstag", "ihrer Oma", "eine Blume" ], answer: "zum Geburtstag", explanation: "Wann schenkt Anna eine Blume? – zum Geburtstag." }
      - { type: pick, instruction: "Welcher Teil steht am Ende der Verbklammer?", prompt: "Wir haben gestern dem Gast die Stadt gezeigt.", options: [ "haben", "gestern", "die Stadt", "gezeigt" ], answer: "gezeigt", explanation: "Das Partizip II steht am Ende." }
      - { type: pick, instruction: "Welcher Teil ist das Dativobjekt? Frage: Wem?", prompt: "Ich muss morgen meiner Mutter im Garten helfen.", options: [ "morgen", "meiner Mutter", "im Garten", "helfen" ], answer: "meiner Mutter", explanation: "Wem muss ich helfen? – meiner Mutter." }
      - { type: pick, instruction: "Welcher Teil sagt wo? Frage: Wo?", prompt: "Ich muss morgen meiner Mutter im Garten helfen.", options: [ "morgen", "meiner Mutter", "im Garten", "helfen" ], answer: "im Garten", explanation: "Wo helfe ich? – im Garten." }
      - { type: pick, instruction: "Welcher Teil ist das Akkusativobjekt? Frage: Wen?", prompt: "Ben ruft heute seine Freundin an.", options: [ "Ben", "heute", "seine Freundin", "an" ], answer: "seine Freundin", explanation: "Wen ruft Ben an? – seine Freundin." }
      - { type: pick, instruction: "Welcher Teil ist der zweite Verbteil (Ende)?", prompt: "Ben ruft heute seine Freundin an.", options: [ "ruft", "heute", "seine Freundin", "an" ], answer: "an", explanation: "Die Vorsilbe eines trennbaren Verbs steht am Ende." }

  - id: boxes
    title: "Felder"
    count: 8
    boxes:
      - "Position 1"
      - "Verb"
      - "Mittelfeld"
      - "Ende"
    roleLabels:
      S: "wer"
      V: "Verb"
      T: "wann"
      D: "wem"
      A: "was/wen"
      L: "wo"
      E: "Ende"
    concepts: [ syntax.klammer-with-objects, syntax.mittelfeld-order ]
    instruction: "Lege die Teile in die Felder. Es gibt mehrere Lösungen: Jeder Teil kann zuerst stehen (außer dem Ende)."
    explanation: "Verb auf Position 2. Mittelfeld: Subjekt, Zeit, Dativ, Akkusativ, Ort. Ein zweiter Verbteil steht am Ende."
    markLast: true
    items:
      - { type: parts-boxes, parts: "ich/S gebe/V heute/T dem_Kind/D einen_Apfel/A" }
      - { type: parts-boxes, parts: "Anna/S schenkt/V zum_Geburtstag/T ihrer_Oma/D eine_Blume/A" }
      - { type: parts-boxes, parts: "wir/S haben/V gestern/T dem_Gast/D die_Stadt/A gezeigt/E" }
      - { type: parts-boxes, parts: "ich/S muss/V morgen/T meiner_Mutter/D im_Garten/L helfen/E" }
      - { type: parts-boxes, parts: "Ben/S ruft/V heute/T seine_Freundin/A an/E" }
      - { type: parts-boxes, parts: "sie/S hat/V gestern/T ihrem_Bruder/D ein_Foto/A geschickt/E" }
      - { type: parts-boxes, parts: "wir/S wollen/V am_Samstag/T unserer_Lehrerin/D Blumen/A kaufen/E" }
      - { type: parts-boxes, parts: "du/S kannst/V mir/D heute/T helfen/E", starts: [ S, T, D ] }

  - id: puzzle
    title: "Satzpuzzle"
    count: 6
    concepts: [ syntax.klammer-with-objects, syntax.mittelfeld-order, case.dat-before-akk ]
    instruction: "Bringe die Teile in die normale Reihenfolge. Beginne mit dem Subjekt."
    explanation: "Subjekt, Verb, Zeit, Dativ, Akkusativ, Ort und der zweite Verbteil am Ende."
    items:
      - { type: parts-order, parts: "ich/S gebe/V heute/T dem_Kind/D einen_Apfel/A" }
      - { type: parts-order, parts: "Anna/S schenkt/V zum_Geburtstag/T ihrer_Oma/D eine_Blume/A" }
      - { type: parts-order, parts: "wir/S haben/V gestern/T dem_Gast/D die_Stadt/A gezeigt/E" }
      - { type: parts-order, parts: "ich/S muss/V morgen/T meiner_Mutter/D im_Garten/L helfen/E" }
      - { type: parts-order, parts: "Ben/S ruft/V heute/T seine_Freundin/A an/E" }
      - { type: parts-order, parts: "sie/S hat/V gestern/T ihrem_Bruder/D ein_Foto/A geschickt/E" }
      - { type: parts-order, parts: "gestern/T haben/V wir/S dem_Gast/D die_Stadt/A gezeigt/E", start: T, instruction: "Bringe die Teile in die richtige Reihenfolge. Beginne mit „gestern“.", explanation: "Auf Position 1 steht „gestern“, deshalb folgt das Subjekt dem Verb." }

  - id: correct
    title: "Was ist richtig?"
    count: 8
    concepts: [ syntax.klammer-with-objects, case.dat-before-akk, syntax.inversion ]
    instruction: "Tippe den richtigen Satz an."
    items:
      - type: pick
        options: [ "Ich gebe dem Kind einen Apfel.", "Ich gebe den Kind einen Apfel.", "Ich gebe dem Kind ein Apfel." ]
        answer: "Ich gebe dem Kind einen Apfel."
        explanation: "Dativ: dem Kind. Akkusativ maskulin: einen Apfel."
      - type: pick
        options: [ "Wir haben gestern dem Gast die Stadt gezeigt.", "Wir haben gestern gezeigt dem Gast die Stadt.", "Wir haben gestern dem Gast die Stadt zeigt." ]
        answer: "Wir haben gestern dem Gast die Stadt gezeigt."
        explanation: "Das Partizip II steht am Satzende."
      - type: pick
        options: [ "Gestern haben wir dem Gast die Stadt gezeigt.", "Gestern wir haben dem Gast die Stadt gezeigt.", "Gestern haben dem Gast die Stadt gezeigt wir." ]
        answer: "Gestern haben wir dem Gast die Stadt gezeigt."
        explanation: "Auf Position 1 steht „gestern“: Verb, dann Subjekt, und das Partizip II am Ende."
      - type: pick
        options: [ "Ich muss morgen meiner Mutter helfen.", "Ich muss helfen morgen meiner Mutter.", "Ich helfen muss morgen meiner Mutter." ]
        answer: "Ich muss morgen meiner Mutter helfen."
        explanation: "Das Modalverb steht auf Position 2, der Infinitiv am Ende."
      - type: pick
        options: [ "Ben ruft heute seine Freundin an.", "Ben anruft heute seine Freundin.", "Ben ruft an heute seine Freundin." ]
        answer: "Ben ruft heute seine Freundin an."
        explanation: "Die Vorsilbe „an“ steht am Ende."
      - type: pick
        options: [ "Anna schenkt ihrer Oma eine Blume.", "Anna schenkt ihre Oma eine Blume.", "Anna schenkt ihrer Oma einen Blume." ]
        answer: "Anna schenkt ihrer Oma eine Blume."
        explanation: "Feminin im Dativ: ihrer Oma. „Blume“ ist feminin: eine Blume."
      - type: pick
        options: [ "Dem Kind gebe ich einen Apfel.", "Dem Kind ich gebe einen Apfel.", "Dem Kind gebe einen Apfel ich." ]
        answer: "Dem Kind gebe ich einen Apfel."
        explanation: "Das Dativobjekt steht auf Position 1: Verb an zweiter Stelle, dann das Subjekt."
      - type: pick
        options: [ "Ich schicke meinem Bruder ein Foto.", "Ich schicke mein Bruder ein Foto.", "Ich schicke meinem Bruder einen Foto." ]
        answer: "Ich schicke meinem Bruder ein Foto."
        explanation: "Dativ: meinem Bruder. „Foto“ ist Neutrum: ein Foto."

  - id: write
    title: "Schreiben"
    concepts: [ writing.simple-sentences, syntax.klammer-with-objects ]
    instruction: "Schreibe 4 längere Sätze oder mehr. Benutze die Wörter."
    items:
      - type: free-writing
        task: "Schreibe über Geschenke und Pläne: Was gibst du Freunden und deiner Familie? Was hast du gestern gemacht? Was musst du morgen machen?"
        words: [ ich schenke, ich habe, ich muss, gestern, morgen, meiner, meinem ]
        minSentences: 4
        checklist:
          - "Das Verb steht auf Position 2. Ein zweiter Verbteil steht am Ende."
          - "Das Dativobjekt steht vor dem Akkusativobjekt."
          - "Ich habe mindestens ein Zeitwort benutzt."
        model: "Gestern habe ich meiner Schwester ein Buch geschenkt. Morgen muss ich meinem Bruder im Garten helfen. Am Samstag rufe ich meine Oma an. Ich gebe ihr eine Blume."
