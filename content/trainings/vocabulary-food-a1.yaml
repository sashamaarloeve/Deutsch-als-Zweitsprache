# Vocabulary training, level A1: vocabulary-food-a1. Original word selection and sentences (own work, no word lists copied).
# Each word has an article (nouns), plural, a meaning (simple German) and an example with the word marked <c>…</c>.
kind: lesson
id: vocabulary-food-a1
title: Essen und Trinken
level: A1
skill: vocabulary
minutes: 20
status: draft
description: '20 Wörter für Essen, Trinken und Kochen, mit Artikel, Plural und einem Beispielsatz. Übungen: zuordnen, schreiben, Sätze, was passt nicht?'
canDo:
  - Ich kann häufiges Essen und Getränke benennen.
  - Ich kann sagen, was ich esse und trinke.
words:
  - { id: brot, art: das, word: Brot, pl: Brote, meaning: Man macht es aus Mehl. Man isst es oft am Morgen und am Abend, ex: Zum Frühstück esse ich <c>Brot</c> mit Käse. }
  - { id: broetchen, art: das, word: Brötchen, pl: Brötchen, meaning: Ein kleines Brot für das Frühstück, ex: Ich kaufe zwei <c>Brötchen</c>. }
  - { id: kaese, art: der, word: Käse, noPlural: true, meaning: 'Gelb oder weiß, aus Milch gemacht', ex: Der <c>Käse</c> schmeckt gut. }
  - { id: ei, art: das, word: Ei, pl: Eier, meaning: Das legt ein Huhn, ex: Ich esse ein <c>Ei</c> zum Frühstück. }
  - { id: apfel, art: der, word: Apfel, pl: Äpfel, meaning: 'Eine runde Frucht, rot oder grün', ex: Der <c>Apfel</c> ist rot. }
  - { id: banane, art: die, word: Banane, pl: Bananen, meaning: 'Eine gelbe, lange Frucht', ex: Die <c>Banane</c> ist gelb. }
  - { id: orange, art: die, word: Orange, pl: Orangen, meaning: 'Eine runde, orange Frucht', ex: Ich esse eine <c>Orange</c>. }
  - { id: kartoffel, art: die, word: Kartoffel, pl: Kartoffeln, meaning: Man kocht sie. Sie ist braun und wächst in der Erde, ex: Wir kochen <c>Kartoffeln</c>. }
  - { id: fisch, art: der, word: Fisch, pl: Fische, meaning: 'Ein Tier im Wasser, das man auch essen kann', ex: Heute gibt es <c>Fisch</c>. }
  - { id: fleisch, art: das, word: Fleisch, noPlural: true, meaning: 'Das essen viele Menschen von Kuh, Schwein oder Huhn', ex: Er isst kein <c>Fleisch</c>. }
  - { id: suppe, art: die, word: Suppe, pl: Suppen, meaning: 'Warmes, flüssiges Essen. Man isst es mit einem Löffel', ex: Die <c>Suppe</c> ist heiß. }
  - { id: kuchen, art: der, word: Kuchen, pl: Kuchen, meaning: 'Süß, aus Mehl und Zucker, zum Beispiel zum Geburtstag', ex: Zum Geburtstag gibt es <c>Kuchen</c>. }
  - { id: wasser, art: das, word: Wasser, noPlural: true, meaning: Man trinkt es. Es hat keine Farbe, ex: Ich trinke ein Glas <c>Wasser</c>. }
  - { id: kaffee, art: der, word: Kaffee, noPlural: true, meaning: 'Ein heißes, braunes Getränk. Viele trinken es am Morgen', ex: Mein Vater trinkt jeden Morgen <c>Kaffee</c>. }
  - { id: milch, art: die, word: Milch, noPlural: true, meaning: Ein weißes Getränk von der Kuh, ex: Die Kinder trinken <c>Milch</c>. }
  - { id: saft, art: der, word: Saft, pl: Säfte, meaning: 'Ein Getränk aus Früchten, zum Beispiel aus Äpfeln', ex: Ich möchte einen <c>Saft</c>. }
  - { id: essen, word: essen, meaning: Man nimmt Essen in den Mund, ex: Wir <c>essen</c> um zwölf Uhr. }
  - { id: trinken, word: trinken, meaning: Man nimmt Wasser oder Saft in den Mund, ex: Sie <c>trinkt</c> gern Tee. }
  - { id: kochen, word: kochen, meaning: 'Man macht Essen warm, zum Beispiel auf dem Herd', ex: Mein Bruder <c>kocht</c> heute. }
  - { id: lecker, word: lecker, meaning: Das Essen schmeckt sehr gut, ex: Die Suppe ist <c>lecker</c>. }
understand:
  - type: word-list
    title: Essen
    words: [ brot, broetchen, kaese, ei, apfel, banane, orange, kartoffel, fisch, fleisch, suppe, kuchen ]
  - type: word-list
    title: Getränke
    words: [ wasser, kaffee, milch, saft ]
  - type: word-list
    title: Verben und ein nützliches Wort
    words: [ essen, trinken, kochen, lecker ]
  - type: rule
    title: Nützliche Sätze
    body:
      - Ich esse gern <c>Suppe</c>.
      - Ich trinke <c>Wasser</c>, aber keinen <c>Kaffee</c>.
      - Was möchtest du essen? – Ich möchte einen Apfel.
      - Das schmeckt lecker!
  - type: rule
    title: Nomen mit Artikel und Plural lernen
    body:
      - 'Lerne jedes Nomen zusammen mit Artikel und Plural. Die Farben helfen: <der>der</der> blau, <die>die</die> rot, <das>das</das> grün, Plural orange.'
      - 'Einige Wörter haben keinen Plural: das Wasser, die Milch, der Käse.'
practice:
  - id: cards
    title: Lernkarten
    kind: cards
  - id: pairs
    title: Zuordnen
    shuffle: false
    concepts:
      - vocab.food
      - vocab.noun-article
    instruction: Tippe ein deutsches Wort an, dann die Bedeutung.
    items:
      - { type: words-pairs, ids: [ brot, broetchen, kaese, ei, apfel, banane, orange, kartoffel, fisch, fleisch, suppe, kuchen, wasser, kaffee, milch, saft, essen, trinken, kochen, lecker ], size: 5 }
  - id: memory
    title: Memory
    kind: memory
  - id: write
    title: Das Wort schreiben
    shuffle: true
    count: 8
    concepts:
      - vocab.food
      - vocab.noun-article
    instruction: 'Schreibe das deutsche Wort. Bei Nomen schreibe auch den Artikel (zum Beispiel: die Mutter).'
    items:
      - { type: words-write, ids: [ brot, broetchen, kaese, ei, apfel, banane, orange, kartoffel, fisch, fleisch, suppe, kuchen, wasser, kaffee, milch, saft, essen, trinken, kochen, lecker ] }
  - id: sentences
    title: In Sätzen
    shuffle: true
    concepts:
      - vocab.food
    items:
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: 'Eine Frucht, rund, rot oder grün: Das ist ein ___.', options: [ Apfel, Fisch, Ei, Käse ], answer: Apfel, explanation: 'Eine runde Frucht, rot oder grün: ein Apfel.' }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Das Huhn legt ein ___., options: [ Ei, Apfel, Brot, Fisch ], answer: Ei, explanation: Ein Huhn legt ein Ei. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Zum Geburtstag gibt es süßen ___., options: [ Kuchen, Fisch, Fleisch, Käse ], answer: Kuchen, explanation: Zum Geburtstag gibt es süßen Kuchen. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Am Morgen trinkt er heißen ___., options: [ Kaffee, Saft, Käse, Kuchen ], answer: Kaffee, explanation: Am Morgen trinkt man heißen Kaffee. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Wir kochen eine ___ mit Kartoffeln., options: [ Suppe, Banane, Milch, Kuchen ], answer: Suppe, explanation: Man kocht eine Suppe. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: 'Wie schmeckt das Essen? – Es ist sehr ___!', options: [ lecker, Käse, kochen, trinken ], answer: lecker, explanation: '„lecker“ sagt, wie das Essen schmeckt.' }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: Kinder ___ gern Milch., options: [ trinken, essen, lecker, Brötchen ], answer: trinken, explanation: Milch trinkt man. }
      - { type: pick, instruction: 'Welches Wort passt in den Satz?', sentence: 'Ich ___ jeden Tag Obst: Äpfel und Bananen.', options: [ esse, trinke, schlafe, laufe ], answer: esse, explanation: 'Obst isst man: ich esse.' }
  - id: odd
    title: Was passt nicht?
    shuffle: true
    concepts:
      - vocab.food
    items:
      - { type: pick, instruction: 'Welches Wort ist kein Getränk?', prompt: '', options: [ das Wasser, die Milch, das Brot, der Saft ], answer: das Brot, explanation: Brot ist Essen. }
      - { type: pick, instruction: 'Welches Wort ist keine Frucht?', prompt: '', options: [ der Apfel, die Banane, die Orange, der Fisch ], answer: der Fisch, explanation: Fisch ist keine Frucht. }
      - { type: pick, instruction: 'Welches Wort ist ein Verb?', prompt: '', options: [ das Brot, essen, die Suppe, der Käse ], answer: essen, explanation: „essen“ ist ein Verb. }
      - { type: pick, instruction: 'Welches Wort ist kein Essen?', prompt: '', options: [ der Kuchen, das Brötchen, das Wasser, der Käse ], answer: das Wasser, explanation: Wasser ist ein Getränk. }
