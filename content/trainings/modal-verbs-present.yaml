# Training: modal verbs in the present tense (A1): können, müssen, wollen, möchten, dürfen, sollen.
# Original content, written in German.
kind: lesson
id: modal-verbs-present
title: "Modalverben"
level: A1
skill: grammar
minutes: 20
status: draft
description: "„können“, „müssen“, „wollen“, „möchten“, „dürfen“, „sollen“: die Formen, die Bedeutung und die Klammer: Modalverb auf Position 2, Infinitiv am Ende."
canDo:
  - "Ich kann die Präsensformen von „können“, „müssen“, „wollen“, „möchten“, „dürfen“ und „sollen“ benutzen."
  - "Ich kann sagen, was ich kann, muss, will, darf und soll."
  - "Ich kann einen Satz mit Modalverb bauen: Der Infinitiv steht am Ende."

verbs:
  - { inf: können, forms: [ kann, kannst, kann, können, könnt, können ] }
  - { inf: müssen, forms: [ muss, musst, muss, müssen, müsst, müssen ] }
  - { inf: wollen, forms: [ will, willst, will, wollen, wollt, wollen ] }
  - { inf: möchten, forms: [ möchte, möchtest, möchte, möchten, möchtet, möchten ] }
  - { inf: dürfen, forms: [ darf, darfst, darf, dürfen, dürft, dürfen ] }
  - { inf: sollen, forms: [ soll, sollst, soll, sollen, sollt, sollen ] }

understand:
  - type: dialogue
    title: "Achte auf die zwei Verben"
    lines:
      - { who: Mia, say: "<v>Kannst</v> du Gitarre <s>spielen</s>?" }
      - { who: Ben, say: "Ja, ich <v>kann</v> ein bisschen <s>spielen</s>. Ich <v>möchte</v> in einer Band <s>spielen</s>." }
      - { who: Mia, say: "Toll! Heute <v>muss</v> ich leider <s>arbeiten</s>. Aber morgen <v>kann</v> ich <s>kommen</s>." }

  - type: text
    title: "Modalverben helfen einem anderen Verb"
    body:
      - "Das Modalverb ändert sich und steht auf Position 2. Das andere Verb bleibt im Infinitiv. Es steht am Satzende."
      - "<p>Ich</p> <v>kann</v> heute Fußball <s>spielen</s>."
      - "Die zwei Verbteile bilden eine Klammer. Dazwischen steht das Mittelfeld."

  - type: conjugation
    title: "Die Formen"
    verbs: [ können, müssen, wollen, möchten, dürfen, sollen ]
    irregularNote: "Schau auf ich und er/sie/es: Sie haben dieselbe Form (ich kann, er kann). Kein -t: <x>er kannt</x>."

  - type: bracket-lab
    title: "Das Klammer-Labor"
    intro: "Baue einen Satz. Das Modalverb steht auf Position 2. Der Infinitiv steht am Ende."
    boxLabels:
      - "Position 1"
      - "Verb"
      - "Mittelfeld"
      - "Ende"
    partLabels: [ "Modalverb", "Infinitiv" ]
    leadLabel: "Modalverb"
    actionLabel: "Verb"
    leads: [ können, müssen, wollen, möchten, dürfen, sollen ]
    actions:
      - { inf: spielen, comp: Fußball }
      - { inf: kochen, comp: Suppe }
      - { inf: lernen, comp: Deutsch }
      - { inf: kaufen, comp: Brot }
      - { inf: hören, comp: Musik }
    starts: [ heute, morgen, jetzt ]
    modes:
      - id: statement
        label: "Aussagesatz"
        boxes: [ [ S ], [ V ], [ O ], [ Z ] ]
        end: "."
        rule: "Das <v>Modalverb</v> steht auf Position 2. Der <s>Infinitiv</s> steht am Ende. Dazwischen steht das Mittelfeld."
      - id: time-first
        label: "Zeitwort zuerst"
        boxes: [ [ T ], [ V ], [ S, O ], [ Z ] ]
        end: "."
        rule: "Das <v>Modalverb</v> bleibt auf Position 2. Das Subjekt steht jetzt im Mittelfeld. Der <s>Infinitiv</s> bleibt am Ende."
      - id: yes-no
        label: "Ja/Nein-Frage"
        boxes: [ [], [ V ], [ S, O ], [ Z ] ]
        end: "?"
        rule: "In der Ja/Nein-Frage steht das <v>Modalverb</v> vorne. Der <s>Infinitiv</s> bleibt am Ende."

  - type: rule
    title: "Was die Modalverben bedeuten"
    body:
      - "können – Fähigkeit oder Möglichkeit: Ich <v>kann</v> <s>schwimmen</s>."
      - "müssen – Pflicht: Ich <v>muss</v> heute <s>arbeiten</s>."
      - "wollen – starker Wunsch oder Plan: Ich <v>will</v> Deutsch <s>lernen</s>."
      - "möchten – höflicher Wunsch: Ich <v>möchte</v> einen Tee <s>trinken</s>."
      - "dürfen – Erlaubnis: Hier <v>darf</v> man nicht <s>parken</s>."
      - "sollen – eine andere Person will es, oder ein Rat: Du <v>sollst</v> mehr Wasser <s>trinken</s>."

  - type: rule
    title: "Achtung!"
    body:
      - "Kein „zu“ nach dem Modalverb: <x>Ich kann zu schwimmen.</x> ✗ Ich <v>kann</v> <s>schwimmen</s>. ✓"
      - "Der Infinitiv steht am Ende, nicht hinter dem Modalverb: <x>Ich kann spielen Fußball.</x> ✗ Ich <v>kann</v> Fußball <s>spielen</s>. ✓"

practice:
  - id: forms
    title: "Formen"
    count: 10
    concepts: [ modal.forms ]
    instruction: "Welche Form ist richtig? Tippe sie an."
    items:
      - type: forms-pick
        verbs: [ können, müssen, wollen, möchten, dürfen, sollen ]
        explanation: "Modalverben sind unregelmäßig: ich und er/sie/es haben dieselbe Form, ohne -t."

  - id: match
    title: "Paare"
    shuffle: false
    concepts: [ modal.forms ]
    instruction: "Tippe ein Pronomen an, dann die passende Form."
    items:
      - { type: pairs, pairs: [ [ ich, kann ], [ du, kannst ], [ wir, können ], [ ihr, könnt ] ] }
      - { type: pairs, pairs: [ [ ich, muss ], [ du, musst ], [ wir, müssen ], [ ihr, müsst ] ] }
      - { type: pairs, pairs: [ [ ich, will ], [ du, willst ], [ wir, wollen ], [ ihr, wollt ] ] }
      - { type: pairs, pairs: [ [ ich, darf ], [ du, darfst ], [ wir, dürfen ], [ ihr, dürft ] ] }
      - { type: pairs, pairs: [ [ ich, soll ], [ du, sollst ], [ wir, sollen ], [ ihr, sollt ] ] }
      - type: pairs
        instruction: "Die Modalverben sind gemischt. Tippe ein Pronomen an, dann die Form."
        pairs: [ [ ich, kann ], [ du, musst ], [ wir, wollen ], [ ihr, dürft ], [ er/sie/es, möchte ] ]

  - id: sentences
    title: "Im Satz"
    count: 10
    concepts: [ modal.forms, modal.bracket ]
    instruction: "Wähle die richtige Form vom Modalverb."
    explanation: "Schau auf das Subjekt. Der Infinitiv am Ende bleibt gleich."
    items:
      - { type: pick-form, verb: können, person: 0, sentence: "Ich ___ gut schwimmen." }
      - { type: pick-form, verb: dürfen, person: 1, sentence: "Du ___ heute lange schlafen." }
      - { type: pick-form, verb: müssen, person: 3, sentence: "Wir ___ jetzt nach Hause gehen." }
      - { type: pick-form, verb: dürfen, person: 4, sentence: "Ihr ___ hier nicht rauchen." }
      - { type: pick-form, verb: wollen, person: 2, sentence: "Mein Bruder ___ Gitarre lernen." }
      - { type: pick-form, verb: möchten, person: 0, sentence: "Ich ___ bitte einen Kaffee trinken." }
      - { type: pick-form, verb: wollen, person: 1, sentence: "Was ___ du heute machen?" }
      - { type: pick-form, verb: können, person: 2, sentence: "Anna ___ sehr gut Klavier spielen." }
      - { type: pick-form, verb: müssen, person: 5, sentence: "Die Kinder ___ um acht ins Bett gehen." }
      - { type: pick-form, verb: wollen, person: 3, sentence: "Wir ___ morgen ins Kino gehen." }
      - { type: pick-form, verb: müssen, person: 1, sentence: "Du ___ heute nicht arbeiten." }
      - { type: pick-form, verb: sollen, person: 1, sentence: "Du ___ mehr Wasser trinken." }
      - { type: pick-form, verb: sollen, person: 0, sentence: "Ich ___ um acht Uhr nach Hause kommen." }

  - id: meaning
    title: "Bedeutung"
    shuffle: false
    concepts: [ modal.meaning ]
    items:
      - type: pairs
        instruction: "Tippe ein Modalverb an, dann die Bedeutung."
        pairs:
          - [ können, "Fähigkeit, Möglichkeit" ]
          - [ müssen, "Pflicht" ]
          - [ wollen, "starker Wunsch, Plan" ]
          - [ möchten, "höflicher Wunsch" ]
          - [ dürfen, "Erlaubnis" ]
          - [ sollen, "Rat, Auftrag von jemand anderem" ]
      - type: pairs
        instruction: "Tippe einen Satz an, dann die Bedeutung."
        pairs:
          - [ "Ich kann Gitarre spielen.", "Fähigkeit" ]
          - [ "Ich muss heute arbeiten.", "Pflicht" ]
          - [ "Ich will nach Berlin fahren.", "Plan" ]
          - [ "Ich möchte einen Tee.", "höflicher Wunsch" ]
          - [ "Hier darf man nicht parken.", "keine Erlaubnis" ]
          - [ "Du sollst mehr schlafen.", "Rat" ]

  - id: correct
    title: "Was ist richtig?"
    count: 8
    concepts: [ modal.bracket ]
    instruction: "Tippe den richtigen Satz an."
    items:
      - type: pick
        options: [ "Ich kann Fußball spielen.", "Ich kann spielen Fußball.", "Ich spielen kann Fußball." ]
        answer: "Ich kann Fußball spielen."
        explanation: "Das Modalverb steht auf Position 2, der Infinitiv am Ende."
      - type: pick
        options: [ "Kannst du schwimmen?", "Kannst schwimmen du?", "Du schwimmen kannst?" ]
        answer: "Kannst du schwimmen?"
        explanation: "In der Ja/Nein-Frage steht das Modalverb vorne und der Infinitiv hinten."
      - type: pick
        options: [ "Heute muss ich arbeiten.", "Heute ich muss arbeiten.", "Heute muss arbeiten ich." ]
        answer: "Heute muss ich arbeiten."
        explanation: "Das Modalverb bleibt nach dem Zeitwort auf Position 2."
      - type: pick
        options: [ "Ich will Deutsch lernen.", "Ich will zu lernen Deutsch.", "Ich will Deutsch zu lernen." ]
        answer: "Ich will Deutsch lernen."
        explanation: "Nach dem Modalverb steht kein „zu“."
      - type: pick
        options: [ "Er kann gut kochen.", "Er kannt gut kochen.", "Er können gut kochen." ]
        answer: "Er kann gut kochen."
        explanation: "er → kann (ohne -t)."
      - type: pick
        options: [ "Wir möchten morgen ins Kino gehen.", "Wir möchten morgen gehen ins Kino.", "Wir gehen möchten morgen ins Kino." ]
        answer: "Wir möchten morgen ins Kino gehen."
        explanation: "Der Infinitiv steht ganz am Ende."
      - type: pick
        options: [ "Ihr dürft hier nicht parken.", "Ihr dürfen hier nicht parken.", "Ihr dürft hier nicht zu parken." ]
        answer: "Ihr dürft hier nicht parken."
        explanation: "ihr → dürft, und kein „zu“."
      - type: pick
        options: [ "Du sollst mehr Wasser trinken.", "Du sollst mehr Wasser zu trinken.", "Du sollst trinken mehr Wasser." ]
        answer: "Du sollst mehr Wasser trinken."
        explanation: "„sollen“ ist auch ein Modalverb: du → sollst, der Infinitiv steht am Ende."

  - id: boxes
    title: "Felder"
    count: 8
    concepts: [ modal.bracket ]
    markLast: true
    boxes:
      - "Position 1"
      - "Verb"
      - "Mittelfeld"
      - "Ende"
    instruction: "Lege die Wörter in die Felder. Das Modalverb kommt in das Verb-Feld, der Infinitiv in das letzte Feld."
    explanation: "Das Modalverb steht auf Position 2 (in der Ja/Nein-Frage vorne). Der Infinitiv steht am Ende."
    items:
      - type: boxes
        chunks: [ ich, kann, gut, schwimmen ]
        solutions:
          - [ [ ich ], [ kann ], [ gut ], [ schwimmen ] ]
      - type: boxes
        chunks: [ ich, muss, heute, arbeiten ]
        solutions:
          - [ [ ich ], [ muss ], [ heute ], [ arbeiten ] ]
          - [ [ heute ], [ muss ], [ ich ], [ arbeiten ] ]
      - type: boxes
        chunks: [ wir, wollen, Pizza, essen ]
        solutions:
          - [ [ wir ], [ wollen ], [ Pizza ], [ essen ] ]
          - [ [ Pizza ], [ wollen ], [ wir ], [ essen ] ]
      - type: boxes
        end: "?"
        instruction: "Lege die Wörter in die Felder. Es ist eine Ja/Nein-Frage."
        chunks: [ kannst, du, Gitarre, spielen ]
        solutions:
          - [ [], [ kannst ], [ du, Gitarre ], [ spielen ] ]
      - type: boxes
        end: "?"
        instruction: "Lege die Wörter in die Felder. Es ist eine Ja/Nein-Frage."
        chunks: [ darf, ich, hier, parken ]
        solutions:
          - [ [], [ darf ], [ ich, hier ], [ parken ] ]
      - type: boxes
        instruction: "Lege die Wörter in die Felder. Beginne mit „morgen“."
        chunks: [ morgen, möchte, ich, Brot, kaufen ]
        solutions:
          - [ [ morgen ], [ möchte ], [ ich, Brot ], [ kaufen ] ]
      - type: boxes
        end: "?"
        instruction: "Lege die Wörter in die Felder. Es ist eine W-Frage."
        chunks: [ was, willst, du, trinken ]
        solutions:
          - [ [ was ], [ willst ], [ du ], [ trinken ] ]
      - type: boxes
        chunks: [ Anna, kann, sehr gut, singen ]
        solutions:
          - [ [ Anna ], [ kann ], [ sehr gut ], [ singen ] ]
      - type: boxes
        chunks: [ du, sollst, mehr, schlafen ]
        solutions:
          - [ [ du ], [ sollst ], [ mehr ], [ schlafen ] ]
          - [ [ mehr ], [ sollst ], [ du ], [ schlafen ] ]
      - type: boxes
        chunks: [ du, musst, jetzt, lernen ]
        solutions:
          - [ [ du ], [ musst ], [ jetzt ], [ lernen ] ]
          - [ [ jetzt ], [ musst ], [ du ], [ lernen ] ]

  - id: puzzle
    title: "Satzpuzzle"
    count: 6
    concepts: [ modal.bracket ]
    instruction: "Bringe die Wörter in die richtige Reihenfolge. Beginne mit dem Subjekt."
    explanation: "Zuerst das Subjekt, das Modalverb auf Position 2, der Infinitiv am Ende."
    items:
      - { type: sentence-order, words: "ich kann gut kochen", accept: [ "ich kann gut kochen" ] }
      - { type: sentence-order, words: "wir müssen jetzt gehen", accept: [ "wir müssen jetzt gehen" ] }
      - { type: sentence-order, words: "du darfst hier parken", accept: [ "du darfst hier parken" ] }
      - { type: sentence-order, words: "Anna will Deutsch lernen", accept: [ "Anna will Deutsch lernen" ] }
      - { type: sentence-order, words: "mein Vater kann Gitarre spielen", accept: [ "mein Vater kann Gitarre spielen" ] }
      - { type: sentence-order, words: "ihr möchtet einen Kaffee trinken", accept: [ "ihr möchtet einen Kaffee trinken" ] }
      - { type: sentence-order, words: "du sollst mehr Wasser trinken", accept: [ "du sollst mehr Wasser trinken" ] }

  - id: write
    title: "Schreiben"
    concepts: [ writing.simple-sentences, modal.bracket ]
    instruction: "Schreibe 4 Sätze oder mehr. Benutze die Wörter."
    items:
      - type: free-writing
        task: "Schreibe: Was kannst du? Was musst du? Was möchtest du?"
        words: [ ich kann, ich muss, ich will, ich möchte, hier darf man, ich soll ]
        minSentences: 4
        checklist:
          - "Das Modalverb steht auf Position 2 und der Infinitiv steht am Ende."
          - "Ich habe nach dem Modalverb kein „zu“ benutzt."
          - "Jeder Satz beginnt mit einem großen Buchstaben und endet mit einem Punkt."
        model: "Ich kann gut kochen und ich kann ein bisschen Gitarre spielen. Heute muss ich arbeiten. Morgen möchte ich ins Kino gehen. Ich will besser Deutsch sprechen."
