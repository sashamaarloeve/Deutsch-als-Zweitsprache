# Training: sentence structure for A1 – the verb in position 2, W-questions, yes/no questions.
# Original content, written in German.
kind: lesson
id: sentence-structure-a1
title: "Satzbau"
level: A1
skill: grammar
minutes: 20
status: draft
description: "Wohin kommt das Verb? Lerne Position 2 im Aussagesatz und wie du W-Fragen und Ja/Nein-Fragen baust."
canDo:
  - "Ich kann einen Aussagesatz mit dem Verb auf Position 2 bauen."
  - "Ich kann einen Satz mit einem Zeitwort beginnen. Das Verb bleibt auf Position 2."
  - "Ich kann W-Fragen und Ja/Nein-Fragen stellen."

verbs:
  - { inf: spielen, stem: spiel, endings: [ e, st, t, en, t, en ] }
  - { inf: lernen, stem: lern, endings: [ e, st, t, en, t, en ] }
  - { inf: kochen, stem: koch, endings: [ e, st, t, en, t, en ] }
  - { inf: machen, stem: mach, endings: [ e, st, t, en, t, en ] }
  - { inf: hören, stem: hör, endings: [ e, st, t, en, t, en ] }
  - { inf: kaufen, stem: kauf, endings: [ e, st, t, en, t, en ] }
  - { inf: wohnen, stem: wohn, endings: [ e, st, t, en, t, en ] }

understand:
  - type: text
    title: "Die wichtigste Regel"
    body:
      - "Im deutschen Aussagesatz steht das Verb immer auf <v>Position 2</v>."
      - "<p>Ich</p> <v>wohne</v> in Berlin."
      - "<p>Anna</p> <v>lernt</v> Deutsch."
      - "<p>Meine Schwester</p> <v>kocht</v> Suppe."
      - "Auf Position 1 steht ein Wort oder eine Wortgruppe („meine Schwester“, „mein Bruder und ich“). Das Verb ist trotzdem auf Position 2."

  - type: sentence-lab
    title: "Das Satz-Labor"
    intro: "Baue einen Satz und schau auf die Felder. Das Verb bleibt immer in seinem Feld. Das Feld hinter dem Verb heißt Mittelfeld. Dort steht das Subjekt, wenn auf Position 1 etwas anderes steht."
    boxLabels:
      - "Position 1"
      - "Verb"
      - "Mittelfeld"
      - "Rest"
    verbs:
      - { inf: spielen, comp: Fußball, wq: Was }
      - { inf: lernen, comp: Deutsch, wq: Was }
      - { inf: kochen, comp: Suppe, wq: Was }
      - { inf: machen, comp: Hausaufgaben, wq: Was }
      - { inf: hören, comp: Musik, wq: Was }
      - { inf: wohnen, comp: in Berlin, wq: Wo }
    starts: [ heute, morgen, jetzt ]
    modes:
      - id: statement
        label: "Aussagesatz"
        boxes: [ [ S ], [ V ], [], [ O ] ]
        end: "."
        rule: "Auf Position 1 steht das Subjekt. Das <v>Verb</v> steht auf Position 2."
      - id: time-first
        label: "Zeitwort zuerst"
        boxes: [ [ T ], [ V ], [ S ], [ O ] ]
        end: "."
        rule: "Auf Position 1 kann auch ein anderes Wort stehen. Das <v>Verb</v> bleibt auf Position 2. Das Subjekt steht jetzt nach dem Verb, im Mittelfeld."
      - id: w-question
        label: "W-Frage"
        boxes: [ [ Q ], [ V ], [ S ], [] ]
        end: "?"
        rule: "In der W-Frage steht das Fragewort auf Position 1. Das <v>Verb</v> steht auf Position 2. Das Subjekt steht im Mittelfeld."
      - id: yes-no
        label: "Ja/Nein-Frage"
        boxes: [ [], [ V ], [ S ], [ O ] ]
        end: "?"
        rule: "In der Ja/Nein-Frage ist Position 1 leer. Das <v>Verb</v> steht ganz vorne. Das Subjekt steht im Mittelfeld."

  - type: rule
    title: "Was steht auf Position 1?"
    body:
      - "das Subjekt: <p>Ich</p> <v>spiele</v> Fußball."
      - "ein Zeitwort: <p>Heute</p> <v>spiele</v> ich Fußball."
      - "ein Ort: <p>In Berlin</p> <v>wohne</v> ich."
      - "Das Verb bleibt auf Position 2. Das Subjekt steht hinter dem Verb, im Mittelfeld. <x>Heute ich spiele Fußball.</x> ✗  <p>Heute</p> <v>spiele</v> ich Fußball. ✓"

  - type: rule
    title: "Fragen"
    body:
      - "W-Fragen beginnen mit einem Fragewort. Das <v>Verb</v> steht auf Position 2:"
      - "<p>Wo</p> <v>wohnst</v> du?"
      - "<p>Was</p> <v>machst</v> du?"
      - "<p>Wie</p> <v>heißt</v> du?"
      - "<p>Woher</p> <v>kommst</v> du?"
      - "Ja/Nein-Fragen beginnen mit dem <v>Verb</v>:"
      - "<v>Wohnst</v> du in Berlin?"
      - "– Ja, ich wohne in Berlin"
      - "– Nein, ich wohne in Köln"

practice:
  - id: boxes
    title: "Felder"
    count: 8
    boxes:
      - "Position 1"
      - "Verb"
      - "Mittelfeld"
      - "Rest"
    concepts: [ syntax.verb-position-2 ]
    instruction: "Lege die Wörter in die Felder. Das Verb kommt in das Verb-Feld."
    explanation: "Im Aussagesatz und in der W-Frage steht das Verb auf Position 2. In der Ja/Nein-Frage steht es auf Position 1."
    items:
      - type: boxes
        chunks: [ ich, wohne, in Berlin ]
        solutions:
          - [ [ ich ], [ wohne ], [], [ in Berlin ] ]
          - [ [ in Berlin ], [ wohne ], [ ich ], [] ]
      - type: boxes
        chunks: [ Anna, lernt, Deutsch ]
        solutions:
          - [ [ Anna ], [ lernt ], [], [ Deutsch ] ]
          - [ [ Deutsch ], [ lernt ], [ Anna ], [] ]
      - type: boxes
        instruction: "Lege die Wörter in die Felder. Beginne mit „heute“."
        chunks: [ heute, spiele, ich, Fußball ]
        solutions:
          - [ [ heute ], [ spiele ], [ ich ], [ Fußball ] ]
      - type: boxes
        chunks: [ wir, kochen, Suppe ]
        solutions:
          - [ [ wir ], [ kochen ], [], [ Suppe ] ]
          - [ [ Suppe ], [ kochen ], [ wir ], [] ]
      - type: boxes
        instruction: "Lege die Wörter in die Felder. Beginne mit „morgen“."
        chunks: [ morgen, kaufe, ich, Brot ]
        solutions:
          - [ [ morgen ], [ kaufe ], [ ich ], [ Brot ] ]
      - type: boxes
        end: "?"
        instruction: "Lege die Wörter in die Felder. Es ist eine Ja/Nein-Frage."
        chunks: [ spielst, du, Fußball ]
        solutions:
          - [ [], [ spielst ], [ du ], [ Fußball ] ]
      - type: boxes
        end: "?"
        instruction: "Lege die Wörter in die Felder. Es ist eine W-Frage."
        chunks: [ wo, wohnst, du ]
        solutions:
          - [ [ wo ], [ wohnst ], [ du ], [] ]
      - type: boxes
        end: "?"
        instruction: "Lege die Wörter in die Felder. Es ist eine W-Frage."
        chunks: [ was, machst, du, heute ]
        solutions:
          - [ [ was ], [ machst ], [ du ], [ heute ] ]
      - type: boxes
        chunks: [ Mia, trinkt, Tee ]
        solutions:
          - [ [ Mia ], [ trinkt ], [], [ Tee ] ]
          - [ [ Tee ], [ trinkt ], [ Mia ], [] ]
      - type: boxes
        instruction: "Lege die Wörter in die Felder. Beginne mit „am Wochenende“."
        chunks: [ am Wochenende, besuche, ich, meine Oma ]
        solutions:
          - [ [ am Wochenende ], [ besuche ], [ ich ], [ meine Oma ] ]

  - id: puzzle
    title: "Satzpuzzle"
    count: 8
    concepts: [ syntax.verb-position-2 ]
    explanation: "Im Aussagesatz und in der W-Frage steht das Verb auf Position 2. In der Ja/Nein-Frage steht es ganz vorne."
    items:
      - { type: sentence-order, instruction: "Bringe die Wörter in die richtige Reihenfolge. Beginne mit dem Subjekt.", words: "ich wohne in Köln", accept: [ "ich wohne in Köln" ], concepts: [ syntax.verb-position-2 ] }
      - { type: sentence-order, instruction: "Bringe die Wörter in die richtige Reihenfolge. Beginne mit dem Subjekt.", words: "meine Schwester kocht Suppe", accept: [ "meine Schwester kocht Suppe" ], concepts: [ syntax.verb-position-2 ] }
      - { type: sentence-order, instruction: "Bringe die Wörter in die richtige Reihenfolge. Beginne mit dem Subjekt.", words: "mein Bruder spielt Gitarre", accept: [ "mein Bruder spielt Gitarre" ], concepts: [ syntax.verb-position-2 ] }
      - { type: sentence-order, instruction: "Bringe die Wörter in die richtige Reihenfolge. Beginne mit „heute“.", words: "heute kaufe ich Brot", accept: [ "heute kaufe ich Brot" ], concepts: [ syntax.inversion ] }
      - { type: sentence-order, instruction: "Bringe die Wörter in die richtige Reihenfolge. Beginne mit „jetzt“.", words: "jetzt lerne ich Deutsch", accept: [ "jetzt lerne ich Deutsch" ], concepts: [ syntax.inversion ] }
      - { type: sentence-order, instruction: "Bringe die Wörter in die richtige Reihenfolge. Es ist eine W-Frage.", words: "wie heißt du", accept: [ "wie heißt du" ], end: "?", concepts: [ syntax.w-question ] }
      - { type: sentence-order, instruction: "Bringe die Wörter in die richtige Reihenfolge. Es ist eine W-Frage.", words: "was machst du heute", accept: [ "was machst du heute" ], end: "?", concepts: [ syntax.w-question ] }
      - { type: sentence-order, instruction: "Bringe die Wörter in die richtige Reihenfolge. Es ist eine Ja/Nein-Frage.", words: "kochst du gern", accept: [ "kochst du gern" ], end: "?", concepts: [ syntax.yes-no-question ] }
      - { type: sentence-order, instruction: "Bringe die Wörter in die richtige Reihenfolge. Es ist eine Ja/Nein-Frage.", words: "hörst du Musik", accept: [ "hörst du Musik" ], end: "?", concepts: [ syntax.yes-no-question ] }

  - id: which
    title: "Was ist richtig?"
    count: 8
    concepts: [ syntax.verb-position-2 ]
    instruction: "Tippe den richtigen Satz an."
    items:
      - type: pick
        options: [ "Heute spiele ich Fußball.", "Heute ich spiele Fußball.", "Ich heute spiele Fußball." ]
        answer: "Heute spiele ich Fußball."
        explanation: "Das Verb steht auf Position 2, auch wenn ein Zeitwort vorne steht."
      - type: pick
        options: [ "Wo wohnst du?", "Wo du wohnst?", "Wohnst wo du?" ]
        answer: "Wo wohnst du?"
        explanation: "Zuerst das Fragewort, dann das Verb."
      - type: pick
        options: [ "Spielst du Fußball?", "Du Fußball spielst?", "Fußball du spielst?" ]
        answer: "Spielst du Fußball?"
        explanation: "Eine Ja/Nein-Frage beginnt mit dem Verb."
      - type: pick
        options: [ "Ich wohne in Berlin.", "Ich in Berlin wohne.", "In Berlin ich wohne." ]
        answer: "Ich wohne in Berlin."
        explanation: "Zuerst das Subjekt, das Verb auf Position 2."
      - type: pick
        options: [ "Was machst du am Wochenende?", "Was du machst am Wochenende?", "Machst was du am Wochenende?" ]
        answer: "Was machst du am Wochenende?"
        explanation: "W-Frage: Fragewort, dann das Verb."
      - type: pick
        options: [ "Morgen kaufe ich Brot.", "Morgen ich kaufe Brot.", "Ich morgen kaufe Brot." ]
        answer: "Morgen kaufe ich Brot."
        explanation: "Das Verb steht auf Position 2. Das Subjekt kommt danach."
      - type: pick
        options: [ "Anna lernt jeden Tag Deutsch.", "Anna jeden Tag lernt Deutsch.", "Jeden Tag Anna lernt Deutsch." ]
        answer: "Anna lernt jeden Tag Deutsch."
        explanation: "Zuerst das Subjekt, direkt danach das Verb."
      - type: pick
        options: [ "Wie heißt du?", "Wie du heißt?", "Heißt wie du?" ]
        answer: "Wie heißt du?"
        explanation: "Zuerst das Fragewort, dann das Verb."

  - id: questions
    title: "Fragen"
    shuffle: false
    items:
      - type: pairs
        concepts: [ syntax.w-question ]
        instruction: "Tippe den Anfang einer Frage an, dann das Ende."
        pairs: [ [ Wo, wohnst du? ], [ Was, machst du? ], [ Wie, heißt du? ], [ Woher, kommst du? ] ]
      - type: pairs
        concepts: [ syntax.w-question, syntax.yes-no-question ]
        instruction: "Tippe eine Frage an, dann die Antwort."
        pairs:
          - [ Wie heißt du?, Ich heiße Ana. ]
          - [ Wo wohnst du?, Ich wohne in Wien. ]
          - [ Was kochst du?, Ich koche Suppe. ]
          - [ Spielst du Fußball?, "Ja, ich spiele gern Fußball." ]
          - [ Wo arbeitest du?, Ich arbeite in einer Bank. ]

  - id: write
    title: "Schreiben"
    concepts: [ writing.simple-sentences, syntax.verb-position-2 ]
    instruction: "Schreibe 5 Sätze oder mehr. Benutze die Wörter."
    items:
      - type: free-writing
        task: "Schreibe über einen normalen Tag. Beginne einige Sätze mit einem Zeitwort."
        words: [ heute, jetzt, dann, am Abend ]
        minSentences: 5
        checklist:
          - "In jedem Aussagesatz steht das Verb auf Position 2."
          - "Wenn ein Satz mit einem Zeitwort beginnt, steht das Subjekt nach dem Verb."
          - "Jeder Satz beginnt mit einem großen Buchstaben und endet mit einem Punkt."
        model: "Heute lerne ich Deutsch. Dann koche ich Suppe. Am Abend spielt mein Bruder Gitarre. Wir hören Musik und wir sind müde. Morgen arbeite ich in Wien."
