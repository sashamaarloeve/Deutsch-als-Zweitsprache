# Training: haben and sein in the present tense (A1).
# Original content, written in German.
kind: lesson
id: haben-sein-present
title: "haben und sein"
level: A1
skill: grammar
minutes: 15
status: draft
description: "Die zwei wichtigsten Verben im Deutschen. Lerne die Formen im Präsens und wann du „sein“ oder „haben“ brauchst."
canDo:
  - "Ich kann mit „sein“ sagen, wer ich bin, woher ich komme und wie es mir geht."
  - "Ich kann mit „haben“ sagen, was ich habe."
  - "Ich kann „sein“ und „haben“ richtig wählen."

verbs:
  - { inf: sein, forms: [ bin, bist, ist, sind, seid, sind ] }
  - { inf: haben, forms: [ habe, hast, hat, haben, habt, haben ] }

understand:
  - type: dialogue
    title: "Zwei Verben für jeden Tag"
    lines:
      - { who: Mia, say: "Hallo! Ich <v>bin</v> Mia. Und du? Wer <v>bist</v> du?" }
      - { who: Ben, say: "Hallo, Mia. Ich <v>bin</v> Ben. Ich <v>habe</v> Hunger. <v>Hast</v> du auch Hunger?" }
      - { who: Mia, say: "Nein, ich <v>bin</v> nur müde. Aber ich <v>habe</v> Zeit. Wir <v>haben</v> Zeit!" }

  - type: text
    title: "„sein“ und „haben“ sind unregelmäßig"
    body:
      - "Diese zwei Verben sind sehr wichtig. Sie sind unregelmäßig. Du musst die Formen lernen."
      - "Tippe unten ein Verb an und lies alle sechs Formen laut."

  - type: conjugation
    title: "Die Formen"
    verbs: [ sein, haben ]
    irregularNote: "Achtung bei „sie“: sie ist = eine Frau. sie sind = mehrere Personen. Sie sind = die höfliche Form."

  - type: rule
    title: "Wir brauchen „sein“ für …"
    body:
      - "Name: Ich <v>bin</v> Ana."
      - "Land: Ich <v>bin</v> aus Brasilien."
      - "Beruf: Ich <v>bin</v> Lehrerin."
      - "Alter: Ich <v>bin</v> 25 Jahre alt."
      - "Gefühle: Ich <v>bin</v> müde. Wir <v>sind</v> glücklich."

  - type: rule
    title: "Wir brauchen „haben“ für …"
    body:
      - "Dinge: Ich <v>habe</v> einen Hund. Wir <v>haben</v> ein Auto."
      - "Familie: Ich <v>habe</v> eine Schwester."
      - "Hunger und Durst: Ich <v>habe</v> Hunger. Er <v>hat</v> Durst."
      - "Zeit: <v>Habt</v> ihr Zeit?"

  - type: rule
    title: "Achtung!"
    body:
      - "Alter: „sein“, nicht „haben“. <x>Ich habe 25 Jahre.</x> ✗ Ich <v>bin</v> 25 Jahre alt. ✓"
      - "Hunger: „haben“, nicht „sein“. <x>Ich bin Hunger.</x> ✗ Ich <v>habe</v> Hunger. ✓"

practice:
  - id: forms
    title: "Formen"
    count: 10
    instruction: "Welche Form ist richtig? Tippe sie an."
    items:
      - type: forms-pick
        verbs: [ sein ]
        concepts: [ present.sein-forms ]
        explanation: "„sein“ ist unregelmäßig. Lerne die Formen."
      - type: forms-pick
        verbs: [ haben ]
        concepts: [ present.haben-forms ]
        explanation: "„haben“ ist bei du und er/sie/es besonders: hast, hat."

  - id: match
    title: "Paare"
    shuffle: false
    instruction: "Tippe ein Pronomen an, dann die passende Form."
    items:
      - type: pairs
        concepts: [ present.sein-forms ]
        pairs: [ [ ich, bin ], [ du, bist ], [ er/sie/es, ist ], [ wir, sind ], [ ihr, seid ] ]
      - type: pairs
        concepts: [ present.haben-forms ]
        pairs: [ [ ich, habe ], [ du, hast ], [ er/sie/es, hat ], [ wir, haben ], [ ihr, habt ] ]
      - type: pairs
        concepts: [ present.sein-forms, present.haben-forms ]
        instruction: "„sein“ und „haben“ sind gemischt. Tippe ein Pronomen an, dann die Form."
        pairs: [ [ ich, bin ], [ du, hast ], [ er/sie/es, ist ], [ wir, haben ], [ ihr, seid ] ]

  - id: sentences
    title: "Im Satz"
    count: 10
    instruction: "Wähle die richtige Form für den Satz."
    explanation: "Schau auf das Subjekt. Es zeigt die richtige Form."
    items:
      - { type: pick-form, verb: sein, person: 0, sentence: "Ich ___ müde.", concepts: [ present.sein-forms ] }
      - { type: pick-form, verb: sein, person: 1, sentence: "Du ___ sehr nett.", concepts: [ present.sein-forms ] }
      - { type: pick-form, verb: sein, person: 2, sentence: "Lara ___ aus Italien.", concepts: [ present.sein-forms ] }
      - { type: pick-form, verb: sein, person: 3, sentence: "Wir ___ in der Schule.", concepts: [ present.sein-forms ] }
      - { type: pick-form, verb: sein, person: 4, sentence: "Ihr ___ heute spät.", concepts: [ present.sein-forms ] }
      - { type: pick-form, verb: sein, person: 5, sentence: "Mia und Tom ___ Freunde.", concepts: [ present.sein-forms ] }
      - { type: pick-form, verb: haben, person: 0, sentence: "Ich ___ einen Bruder.", concepts: [ present.haben-forms ] }
      - { type: pick-form, verb: haben, person: 1, sentence: "Du ___ ein neues Handy.", concepts: [ present.haben-forms ] }
      - { type: pick-form, verb: haben, person: 2, sentence: "Mein Vater ___ ein Auto.", concepts: [ present.haben-forms ] }
      - { type: pick-form, verb: haben, person: 3, sentence: "Wir ___ heute Zeit.", concepts: [ present.haben-forms ] }
      - { type: pick-form, verb: haben, person: 4, sentence: "Ihr ___ Durst, oder?", concepts: [ present.haben-forms ] }
      - { type: pick-form, verb: haben, person: 5, sentence: "Anna und Max ___ einen Hund.", concepts: [ present.haben-forms ] }

  - id: which
    title: "sein oder haben?"
    count: 8
    concepts: [ present.sein-vs-haben ]
    instruction: "Welches Verb passt? Tippe die richtige Form an."
    items:
      - type: pick
        sentence: "Ich ___ Hunger."
        options: [ habe, bin ]
        answer: habe
        explanation: "Wir sagen „Hunger haben“."
      - type: pick
        sentence: "Ich ___ 20 Jahre alt."
        options: [ bin, habe ]
        answer: bin
        explanation: "Alter: Wir brauchen „sein“."
      - type: pick
        sentence: "Wir ___ müde."
        options: [ sind, haben ]
        answer: sind
        explanation: "Gefühle wie „müde“: Wir brauchen „sein“."
      - type: pick
        sentence: "Er ___ einen Hund."
        options: [ hat, ist ]
        answer: hat
        explanation: "Dinge und Tiere, die man hat: Wir brauchen „haben“."
      - type: pick
        sentence: "Ana ___ Ärztin."
        options: [ ist, hat ]
        answer: ist
        explanation: "Berufe: Wir brauchen „sein“."
      - type: pick
        sentence: "Ihr ___ Durst."
        options: [ habt, seid ]
        answer: habt
        explanation: "Wir sagen „Durst haben“."
      - type: pick
        sentence: "Frau Bauer ___ aus Wien."
        options: [ ist, hat ]
        answer: ist
        explanation: "Woher man kommt: Wir brauchen „sein“."
      - type: pick
        sentence: "Meine Eltern ___ zwei Kinder."
        options: [ haben, sind ]
        answer: haben
        explanation: "Familie: Wir brauchen „haben“."

  - id: correct
    title: "Welcher Satz ist richtig?"
    count: 7
    concepts: [ present.sein-vs-haben ]
    instruction: "Tippe den richtigen Satz an."
    items:
      - type: pick
        options: [ "Ich bin 25 Jahre alt.", "Ich habe 25 Jahre alt.", "Ich habe 25 Jahre." ]
        answer: "Ich bin 25 Jahre alt."
        explanation: "Alter: Wir sagen „Ich bin … Jahre alt“."
      - type: pick
        options: [ "Ich habe Hunger.", "Ich bin Hunger.", "Ich habe hungrig." ]
        answer: "Ich habe Hunger."
        explanation: "Wir sagen „Hunger haben“."
      - type: pick
        options: [ "Wir sind müde.", "Wir haben müde.", "Wir sein müde." ]
        answer: "Wir sind müde."
        explanation: "wir → sind. Gefühle brauchen „sein“."
      - type: pick
        options: [ "Du bist nett.", "Du hast nett.", "Du bin nett." ]
        answer: "Du bist nett."
        explanation: "du → bist."
      - type: pick
        options: [ "Meine Eltern haben ein Haus.", "Meine Eltern sind ein Haus.", "Meine Eltern hat ein Haus." ]
        answer: "Meine Eltern haben ein Haus."
        explanation: "„Meine Eltern“ = sie: haben. Ein Haus hat man: „haben“."
      - type: pick
        options: [ "Er ist Lehrer.", "Er hat Lehrer.", "Er bist Lehrer." ]
        answer: "Er ist Lehrer."
        explanation: "Berufe brauchen „sein“. er → ist."
      - type: pick
        options: [ "Habt ihr einen Hund?", "Seid ihr einen Hund?", "Habe ihr einen Hund?" ]
        answer: "Habt ihr einen Hund?"
        explanation: "ihr → habt. In der Frage steht das Verb vorne."

  - id: puzzle
    title: "Satzpuzzle"
    count: 8
    concepts: [ syntax.verb-position-2 ]
    instruction: "Bringe die Wörter in die richtige Reihenfolge."
    explanation: "Im Aussagesatz steht das Verb auf Position 2. In der Ja/Nein-Frage steht es vorne."
    items:
      - { type: sentence-order, words: "ich bin müde", accept: [ "ich bin müde" ] }
      - { type: sentence-order, words: "wir haben heute Zeit", accept: [ "wir haben heute Zeit", "heute haben wir Zeit" ] }
      - { type: sentence-order, words: "mein Bruder ist 20 Jahre alt", accept: [ "mein Bruder ist 20 Jahre alt" ] }
      - { type: sentence-order, words: "Anna hat einen Hund", accept: [ "Anna hat einen Hund", "einen Hund hat Anna" ] }
      - { type: sentence-order, words: "bist du müde", accept: [ "bist du müde" ], end: "?" }
      - { type: sentence-order, words: "hast du Hunger", accept: [ "hast du Hunger" ], end: "?" }
      - { type: sentence-order, words: "wo bist du", accept: [ "wo bist du" ], end: "?" }
      - { type: sentence-order, words: "wir sind in Berlin", accept: [ "wir sind in Berlin", "in Berlin sind wir" ] }
      - { type: sentence-order, words: "ihr habt einen Hund", accept: [ "ihr habt einen Hund", "einen Hund habt ihr" ] }

  - id: write
    title: "Schreiben"
    concepts: [ writing.simple-sentences, present.sein-vs-haben ]
    instruction: "Schreibe 3 Sätze oder mehr. Benutze die Wörter."
    items:
      - type: free-writing
        task: "Schreibe über dich: Wer bist du? Woher kommst du? Was hast du?"
        words: [ ich bin, ich habe, aus, Jahre alt, müde, Hunger, Bruder, Schwester ]
        minSentences: 3
        checklist:
          - "Jeder Satz beginnt mit einem großen Buchstaben und endet mit einem Punkt."
          - "Ich habe „bin“ und „habe“ richtig benutzt."
          - "Für mein Alter habe ich „Ich bin … Jahre alt“ geschrieben."
        model: "Hallo! Ich bin Sara. Ich bin 24 Jahre alt und ich bin aus Spanien. Ich habe einen Bruder und eine Schwester. Heute bin ich müde, und ich habe Hunger."
