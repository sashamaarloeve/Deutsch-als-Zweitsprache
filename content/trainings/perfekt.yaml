conv:
  - present: Ich spiele Fußball.
    right: Ich habe Fußball gespielt.
    wrong:
      - Ich bin Fußball gespielt.
      - Ich habe Fußball gespielen.
    explanation: "spielen ist regelmäßig: ge + spiel + t, mit haben."
  - present: Er geht nach Hause.
    right: Er ist nach Hause gegangen.
    wrong:
      - Er hat nach Hause gegangen.
      - Er ist nach Hause gegeht.
    explanation: "gehen ist ein Ortswechsel (sein) und unregelmäßig: gegangen."
  - present: Wir essen Pizza.
    right: Wir haben Pizza gegessen.
    wrong:
      - Wir haben Pizza geessen.
      - Wir sind Pizza gegessen.
    explanation: essen → gegessen (unregelmäßig), mit haben.
  - present: Sie steht um sechs Uhr auf.
    right: Sie ist um sechs Uhr aufgestanden.
    wrong:
      - Sie hat um sechs Uhr aufgestanden.
      - Sie ist um sechs Uhr gestanden auf.
    explanation: "aufstehen: Zustandswechsel → sein. Trennbar: auf·ge·standen."
  - present: Du besuchst deine Oma.
    right: Du hast deine Oma besucht.
    wrong:
      - Du hast deine Oma gebesucht.
      - Du bist deine Oma besucht.
    explanation: "Verben mit be- bekommen kein ge-: besucht."
  - present: Ich telefoniere mit Anna.
    right: Ich habe mit Anna telefoniert.
    wrong:
      - Ich habe mit Anna getelefoniert.
      - Ich habe mit Anna telefonieren.
    explanation: Verben auf -ieren bekommen kein ge-.
  - present: Sie fahren nach Berlin.
    right: Sie sind nach Berlin gefahren.
    wrong:
      - Sie haben nach Berlin gefahren.
      - Sie sind nach Berlin gefahrt.
    explanation: "fahren = Ortswechsel → sein. Partizip: gefahren (-en)."
  - present: Ich lese ein Buch.
    right: Ich habe ein Buch gelesen.
    wrong:
      - Ich habe ein Buch gelest.
      - Ich bin ein Buch gelesen.
    explanation: lesen → gelesen (unregelmäßig, -en), mit haben.
  - present: Wir bleiben zu Hause.
    right: Wir sind zu Hause geblieben.
    wrong:
      - Wir haben zu Hause geblieben.
      - Wir sind zu Hause gebleibt.
    explanation: "bleiben ist eine Ausnahme: immer sein. Partizip: geblieben."
  - present: Er ruft mich an.
    right: Er hat mich angerufen.
    wrong:
      - Er hat mich gerufen an.
      - Er hat mich angeruft.
    explanation: "anrufen ist trennbar: an·ge·ruf·en (unregelmäßig)."
  - present: Sie kauft im Supermarkt ein.
    right: Sie hat im Supermarkt eingekauft.
    wrong:
      - Sie hat im Supermarkt geeinkauft.
      - Sie ist im Supermarkt eingekauft.
    explanation: "einkaufen ist trennbar: ein·ge·kauf·t. Kein Ortswechsel → haben."
  - present: Ihr schreibt einen Test.
    right: Ihr habt einen Test geschrieben.
    wrong:
      - Ihr habt einen Test geschreibt.
      - Ihr seid einen Test geschrieben.
    explanation: schreiben → geschrieben (unregelmäßig), mit haben.
  - present: Ich vergesse mein Heft.
    right: Ich habe mein Heft vergessen.
    wrong:
      - Ich habe mein Heft gevergessen.
      - Ich bin mein Heft vergessen.
    explanation: "Verben mit ver- bekommen kein ge-: vergessen."
  - present: Wir kommen um acht Uhr an.
    right: Wir sind um acht Uhr angekommen.
    wrong:
      - Wir haben um acht Uhr angekommen.
      - Wir sind um acht Uhr geankommen.
    explanation: "ankommen: Ortswechsel → sein. Trennbar: an·ge·kommen."
