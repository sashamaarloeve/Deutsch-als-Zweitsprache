conv:
  - {present: "Ich spiele Fußball.", right: "Ich habe Fußball gespielt.", wrong: ["Ich bin Fußball gespielt.", "Ich habe Fußball gespielen."], explanation: "spielen is regular: ge + spiel + t, with haben."}
  - {present: "Er geht nach Hause.", right: "Er ist nach Hause gegangen.", wrong: ["Er hat nach Hause gegangen.", "Er ist nach Hause gegeht."], explanation: "gehen is a change of place (sein) and irregular: gegangen."}
  - {present: "Wir essen Pizza.", right: "Wir haben Pizza gegessen.", wrong: ["Wir haben Pizza geessen.", "Wir sind Pizza gegessen."], explanation: "essen → gegessen (irregular), with haben."}
  - {present: "Sie steht um sechs Uhr auf.", right: "Sie ist um sechs Uhr aufgestanden.", wrong: ["Sie hat um sechs Uhr aufgestanden.", "Sie ist um sechs Uhr gestanden auf."], explanation: "aufstehen: change of state → sein. Separable: auf·ge·stand·en."}
  - {present: "Du besuchst deine Oma.", right: "Du hast deine Oma besucht.", wrong: ["Du hast deine Oma gebesucht.", "Du bist deine Oma besucht."], explanation: "Verbs with be- get no ge-: besucht."}
  - {present: "Ich telefoniere mit Anna.", right: "Ich habe mit Anna telefoniert.", wrong: ["Ich habe mit Anna getelefoniert.", "Ich habe mit Anna telefonieren."], explanation: "Verbs ending in -ieren get no ge-."}
  - {present: "Sie fahren nach Berlin.", right: "Sie sind nach Berlin gefahren.", wrong: ["Sie haben nach Berlin gefahren.", "Sie sind nach Berlin gefahrt."], explanation: "fahren = change of place → sein. Participle: gefahren (-en)."}
  - {present: "Ich lese ein Buch.", right: "Ich habe ein Buch gelesen.", wrong: ["Ich habe ein Buch gelest.", "Ich bin ein Buch gelesen."], explanation: "lesen → gelesen (irregular, -en), with haben."}
  - {present: "Wir bleiben zu Hause.", right: "Wir sind zu Hause geblieben.", wrong: ["Wir haben zu Hause geblieben.", "Wir sind zu Hause gebleibt."], explanation: "bleiben is an exception: always sein. Participle: geblieben."}
  - {present: "Er ruft mich an.", right: "Er hat mich angerufen.", wrong: ["Er hat mich gerufen an.", "Er hat mich angeruft."], explanation: "anrufen is separable: an·ge·ruf·en (irregular)."}
  - {present: "Sie kauft im Supermarkt ein.", right: "Sie hat im Supermarkt eingekauft.", wrong: ["Sie hat im Supermarkt geeinkauft.", "Sie ist im Supermarkt eingekauft."], explanation: "einkaufen is separable: ein·ge·kauf·t. No change of place → haben."}
  - {present: "Ihr schreibt einen Test.", right: "Ihr habt einen Test geschrieben.", wrong: ["Ihr habt einen Test geschreibt.", "Ihr seid einen Test geschrieben."], explanation: "schreiben → geschrieben (irregular), with haben."}
  - {present: "Ich vergesse mein Heft.", right: "Ich habe mein Heft vergessen.", wrong: ["Ich habe mein Heft gevergessen.", "Ich bin mein Heft vergessen."], explanation: "Verbs with ver- get no ge-: vergessen."}
  - {present: "Wir kommen um acht Uhr an.", right: "Wir sind um acht Uhr angekommen.", wrong: ["Wir haben um acht Uhr angekommen.", "Wir sind um acht Uhr geankommen."], explanation: "ankommen: change of place → sein. Separable: an·ge·kommen."}

