id: perfekt
title: Das Perfekt
level: A2
skill: grammar
minutes: 20
status: draft
description: Über die Vergangenheit sprechen. Verstehe das Perfekt, bilde das Partizip II, wähle haben oder sein und trainiere mit sieben Übungen.
canDo:
  - Ich kann sagen, was ich gestern oder am Wochenende gemacht habe.
  - Ich kann das Partizip II von häufigen Verben bilden.
  - Ich kann haben oder sein richtig wählen.
  - Ich kann einen Satz im Perfekt in die richtige Reihenfolge bringen.
intro:
  title: Wann sagen wir das Perfekt?
  lead: Mit dem Perfekt sprechen wir über die Vergangenheit – im Gespräch, in Chats und in Nachrichten.
  dialogue:
    - who: Mia
      text: Was hast du am Wochenende gemacht?
    - who: Ben
      text: Ich [habe] Fußball [gespielt] und ich [bin] ins Kino [gegangen].
  formulaText: "Das Perfekt hat immer zwei Teile:"
  formula:
    - haben / sein
    - … (Satzteile)
    - Partizip II
klammer:
  title: Das Klammer-Labor – Hauptsätze
  text: "Baue einen Satz. Achte auf die Klammer: Das Hilfsverb und das Partizip II stehen weit auseinander."
  scope: "Diese Regeln gelten für Hauptsätze. In Nebensätzen ist die Wortstellung anders: Probiere das nächste Labor!"
  persons:
    - ich
    - du
    - er
    - sie
    - wir
    - ihr
    - sie (Pl.)
  personWords:
    - ich
    - du
    - er
    - sie
    - wir
    - ihr
    - sie
  verbs:
    - - spielen
      - Fußball
    - - kaufen
      - ein Eis
    - - lesen
      - ein Buch
    - - trinken
      - Tee
    - - lernen
      - Deutsch
    - - schlafen
      - lange
    - - gehen
      - ins Kino
    - - fahren
      - nach Hamburg
  modes:
    - Aussage
    - mit „gestern“ in der Mitte
    - „gestern“ am Anfang
    - Ja/Nein-Frage
  rulePos2: Im Hauptsatz steht das Hilfsverb auf Position 2. Das Partizip II steht am Ende.
  rulePos1: In der Ja/Nein-Frage steht das Hilfsverb auf Position 1. Das Partizip II steht am Ende.
  ruleStart: „Gestern“ ist Position 1.
subKlammer:
  title: Das Klammer-Labor – Nebensätze (weil, dass)
  text: "Im Nebensatz steht das Verb am Ende. Im Perfekt steht das Hilfsverb ganz hinten, nach dem Partizip II. Baue einen Satz und achte auf die Klammer: Sie geht jetzt von weil oder dass bis zum Hilfsverb."
  conjunctions:
    - weil
    - dass
  openers:
    weil: Ich bin heute zufrieden
    dass: Ich weiß
  modes:
    - Einfach
    - mit „gestern“
  rule: Im Nebensatz (nach weil, dass …) steht das Hilfsverb ganz am Ende, nach dem Partizip II. Vor weil und dass steht ein Komma.
  compareLabel: "Zum Vergleich – Hauptsatz:"
partTypes:
  title: Das Partizip II – die Werkstatt
  text: Das Partizip II gibt es in vier Typen. Tippe einen Typ an, dann ein Verb.
  reg:
    name: regelmäßig
    formula:
      - - ge
        - ge
      - - Stamm
        - stem
      - - -t
        - end
    text: "Der Stamm bleibt gleich. Endet der Stamm auf -t oder -d, schreiben wir -et: arbeiten → gearbeitet."
    hint: "Regelmäßig: ge + Stamm + -t"
  irr:
    name: unregelmäßig
    formula:
      - - ge
        - ge
      - - Stamm*
        - stem
      - - -en
        - end
    text: "Der Stamm ändert sich oft (trinken → getrunken). Diese Formen musst du lernen. Endung: fast immer -en."
    hint: "Unregelmäßig: ge + veränderter Stamm + -en"
  trenn:
    name: trennbar
    formula:
      - - Vorsilbe
        - pre
      - - ge
        - ge
      - - Stamm
        - stem
      - - -t / -en
        - end
    text: "Bei trennbaren Verben steht ge in der Mitte: auf·ge·stand·en."
    hint: "Trennbar: Vorsilbe + ge + Stamm + -t/-en"
  ohne:
    name: ohne ge-
    formula:
      - - be- ver- er- ent-
        - pre
      - - Stamm
        - stem
      - - -t / -en
        - end
    text: Verben mit be-, ver-, er-, ent- und alle Verben auf -ieren bekommen kein ge-.
    hint: "Kein ge-: Verben mit be-, ver-, er-, ent- und -ieren"
auxCards:
  title: haben oder sein?
  haben:
    title: haben – bei den meisten Verben
    points:
      - "fast alle Verben: gespielt, gegessen, gelesen, gemacht"
      - "Verben mit Akkusativ: Ich habe einen Apfel gegessen."
  sein:
    title: sein – in drei Fällen
    points:
      - "Ortswechsel (A → B): gegangen, gefahren, geflogen"
      - "Zustandswechsel: aufgestanden"
      - "Ausnahmen: geblieben, gewesen, passiert"
why:
  move: "Ortswechsel: Du gehst oder fährst von A nach B."
  change: "Zustandswechsel: Du wechselst von „liegen/sitzen“ zu „stehen“."
  exc: "Ausnahme: bleiben und sein nehmen immer sein."
  event: "Ereignis: Etwas passiert – dieses Verb nimmt sein."
  haben: Kein Ortswechsel, kein Zustandswechsel – also haben.
orderRules:
  main: Das Hilfsverb steht auf Position 2 (oder auf Position 1 in der Ja/Nein-Frage). Das Partizip II steht am Ende.
  question: In der Ja/Nein-Frage steht das Hilfsverb auf Position 1. Das Partizip II steht am Ende.
exceptions:
  sein: Er ist krank gewesen.
  bleiben: Er ist zu Hause geblieben.
  passieren: Was ist passiert?
writing:
  prompt: Schreibe über dein letztes Wochenende. Schreibe mindestens 5 Sätze im Perfekt.
  placeholder: Am Samstag habe ich …
  minSentences: 5
  note: "Automatischer Check: Er erkennt typische Formen, aber nicht jeden Satz. Deine Lehrerin / dein Lehrer prüft genau."
