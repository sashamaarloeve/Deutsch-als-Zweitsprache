# Training: Das Perfekt. Ported from the owner's prototype (Perfekt_Einfuehrung_und_Training.html).
# German examples and sentences are the owner's; instructions and explanations are in English.
id: perfekt
title: Das Perfekt
level: A2
skill: grammar
minutes: 20
status: draft
description: Talk about the past in everyday German. Understand the Perfekt, build the Partizip II, choose haben or sein, then train with seven exercises.
canDo:
  - I can say what I did yesterday or last weekend.
  - I can build the Partizip II of common verbs.
  - I can choose between haben and sein.
  - I can put a Perfekt sentence in the right order.

intro:
  title: When do we use the Perfekt?
  lead: "We use the Perfekt to talk about the past, mostly when speaking, chatting and writing messages."
  dialogue:
    - {who: Mia, text: "Was hast du am Wochenende gemacht?"}
    - {who: Ben, text: "Ich [habe] Fußball [gespielt] und ich [bin] ins Kino [gegangen]."}
  formulaText: "The Perfekt always has two parts:"
  formula: [haben / sein, "… (rest of the sentence)", Partizip II]

klammer:
  title: The bracket lab – main clauses
  text: "Build a sentence. Watch the bracket: the helper verb and the Partizip II stand far apart."
  scope: "These rules are for main clauses (Hauptsätze). In subordinate clauses (Nebensätze) the word order is different: try the next lab!"
  persons: [ich, du, er, sie, wir, ihr, sie (pl.)]
  personWords: [ich, du, er, sie, wir, ihr, sie]
  verbs:
    - [spielen, Fußball]
    - [kaufen, ein Eis]
    - [lesen, ein Buch]
    - [trinken, Tee]
    - [lernen, Deutsch]
    - [schlafen, lange]
    - [gehen, ins Kino]
    - [fahren, nach Hamburg]
  modes: [Statement, "with “gestern” in the middle", "“gestern” at the start", Yes/no question]
  rulePos2: "In a main clause the helper verb is in position 2. The Partizip II is at the end."
  rulePos1: "In a yes/no question the helper verb is in position 1. The Partizip II is at the end."
  ruleStart: "“Gestern” is position 1."

subKlammer:
  title: The bracket lab – subordinate clauses (weil, dass)
  text: "In subordinate clauses the verb moves to the end of the clause. In the Perfekt the helper verb comes last, after the Partizip II. Build a sentence and watch the bracket: it now stretches from weil or dass to the helper verb."
  conjunctions: [weil, dass]
  openers:
    weil: Ich bin heute zufrieden
    dass: Ich weiß
  modes: [Simple, "with “gestern”"]
  rule: "In a subordinate clause (after weil, dass …) the helper verb is at the very end, after the Partizip II. There is a comma before weil and dass."
  compareLabel: "Compare – main clause:"

partTypes:
  title: The Partizip II workshop
  text: "The Partizip II comes in four types. Tap a type, then a verb."
  reg:
    name: regular
    formula: [[ge, ge], [stem, stem], [-t, end]]
    text: "The stem stays the same. If the stem ends in -t or -d, we write -et: arbeiten → gearbeitet."
    hint: "Regular: ge + stem + -t"
  irr:
    name: irregular
    formula: [[ge, ge], [stem*, stem], [-en, end]]
    text: "The stem often changes (trinken → getrunken). You have to learn these forms. Ending: almost always -en."
    hint: "Irregular: ge + changed stem + -en"
  trenn:
    name: separable
    formula: [[prefix, pre], [ge, ge], [stem, stem], [-t / -en, end]]
    text: "With separable verbs, ge goes in the middle: auf·ge·stand·en."
    hint: "Separable: prefix + ge + stem + -t/-en"
  ohne:
    name: without ge-
    formula: [[be- ver- er- ent-, pre], [stem, stem], [-t / -en, end]]
    text: "Verbs with be-, ver-, er-, ent- and all verbs ending in -ieren get no ge-."
    hint: "No ge-: verbs with be-, ver-, er-, ent- and -ieren"

auxCards:
  title: haben or sein?
  haben:
    title: haben – with most verbs
    points:
      - "almost all verbs: gespielt, gegessen, gelesen, gemacht"
      - "verbs with an accusative object: Ich habe einen Apfel gegessen."
  sein:
    title: sein – in three cases
    points:
      - "change of place (A → B): gegangen, gefahren, geflogen"
      - "change of state: aufgestanden"
      - "exceptions: geblieben, gewesen, passiert"

why:
  move: "Change of place: you go or travel from A to B."
  change: "Change of state: you go from lying or sitting to standing."
  exc: "Exception: bleiben and sein always take sein."
  event: "Something happens: this verb takes sein."
  haben: "No change of place, no change of state, so haben."

orderRules:
  main: "The helper verb is in position 2 (or 1 in a yes/no question). The Partizip II is at the end."
  question: "In a yes/no question the helper verb is in position 1. The Partizip II is at the end."

exceptions:
  sein: "Er ist krank gewesen."
  bleiben: "Er ist zu Hause geblieben."
  passieren: "Was ist passiert?"

writing:
  prompt: "Write about your last weekend. Write at least 5 sentences in the Perfekt."
  placeholder: "Am Samstag habe ich …"
  minSentences: 5
  note: "Automatic check: it recognises typical forms, but not every sentence. A teacher or a friend can check exactly."

