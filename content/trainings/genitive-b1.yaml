# Training: the Genitiv (B1). Belonging, articles, noun endings, names, wegen/während/trotz.
# Typical level: the Genitiv is taught around B1 (spoken German often uses von + Dativ instead).
# Original content, written in German.
kind: lesson
id: genitive-b1
title: "Genitiv"
level: B1
skill: grammar
minutes: 30
status: draft
description: "Der Genitiv zeigt Zugehörigkeit: das Auto des Mannes. Mit Artikeln, Nomen-Endungen (-s, -es), Namen (Annas Buch) und den Präpositionen wegen, während, trotz."
canDo:
  - "Ich kann mit dem Genitiv sagen, wem etwas gehört."
  - "Ich kann „des“, „der“, „eines“, „einer“, „meines“, „meiner“ und die Endungen -s und -es benutzen."
  - "Ich kann „wegen“, „während“ und „trotz“ mit Genitiv verstehen."

articles:
  definite:
    label: "der, die, das"
    nom: [ der, die, das, die ]
    akk: [ den, die, das, die ]
    dat: [ dem, der, dem, den ]
    gen: [ des, der, des, der ]
  indefinite:
    label: "ein, eine"
    nom: [ ein, eine, ein, "" ]
    akk: [ einen, eine, ein, "" ]
    dat: [ einem, einer, einem, "" ]
    gen: [ eines, einer, eines, "" ]
  possessive:
    label: "mein, meine"
    nom: [ mein, meine, mein, meine ]
    akk: [ meinen, meine, mein, meine ]
    dat: [ meinem, meiner, meinem, meinen ]
    gen: [ meines, meiner, meines, meiner ]
  negative:
    label: "kein, keine"
    nom: [ kein, keine, kein, keine ]
    akk: [ keinen, keine, kein, keine ]
    dat: [ keinem, keiner, keinem, keinen ]
    gen: [ keines, keiner, keines, keiner ]

understand:
  - type: dialogue
    title: "Hör zu: Wem gehört das?"
    lines:
      - { who: Mia, say: "Ist das das Handy <die>deiner</die> Schwester?" }
      - { who: Ben, say: "Nein, das ist das Handy <der>meines</der> Bruders." }
      - { who: Mia, say: "Und die Tasche? Das ist die Tasche <der>des</der> Lehrers, oder?" }
      - { who: Ben, say: "Nein, das ist Annas Tasche." }

  - type: text
    title: "Der Genitiv: Zugehörigkeit"
    body:
      - "Objekte können im Akkusativ, im Dativ oder im Genitiv stehen. Der Genitiv steht nicht nach einem Verb. Er gehört zu einem Nomen und zeigt, wem etwas gehört oder wovon etwas ein Teil ist."
      - "Das ist das Auto <c>des Mannes</c>."
      - "„des Mannes“ ist der Genitiv. Er gehört zu „das Auto“ und sagt, wessen Auto es ist. Er steht immer nach dem Nomen, zu dem er gehört."
      - "Tipp: Die Frage „Wessen?“ kann helfen. Wessen Auto ist das? – das Auto des Mannes."

  - type: article-table
    title: "Die Artikel: der, die, das"
    intro: "Schau auf die Tabellen. Die Farbe zeigt das Genus vom Nomen. Markierte Formen sind anders als im Nominativ."
    kinds: [ definite ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: gen, label: Genitiv }
    note: |-
      Maskulin und Neutrum: <der>des</der> / <das>des</das> + Nomen mit -s oder -es
      Feminin und Plural: <die>der</die>, das Nomen ändert sich nicht

  - type: article-table
    title: "ein, eine"
    kinds: [ indefinite ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: gen, label: Genitiv }
    note: "ein → <der>eines</der>, eine → <die>einer</die>, ein → <das>eines</das>."

  - type: article-table
    title: "mein, meine"
    kinds: [ possessive ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: gen, label: Genitiv }
    note: "mein → <der>meines</der>, meine → <die>meiner</die>, mein → <das>meines</das>, meine (Plural) → <pl>meiner</pl>. „dein“, „sein“, „ihr“ … funktionieren genauso."

  - type: article-table
    title: "kein, keine"
    kinds: [ negative ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: gen, label: Genitiv }
    note: "kein → <der>keines</der>, keine → <die>keiner</die>, kein → <das>keines</das>, keine (Plural) → <pl>keiner</pl>."

  - type: case-lab
    title: "Das Fall-Labor"
    intro: "Wähle einen Artikel, einen Fall und ein Nomen. Der Artikel, der sich ändert, ist markiert. Im Genitiv ändern sich auch maskuline und neutrale Nomen."
    kinds: [ definite, indefinite, possessive, negative ]
    cases:
      - id: nom
        label: Nominativ
        frame: [ "___ ist hier.", "___ sind hier." ]
        rule: "Nominativ: das Subjekt."
      - id: gen
        label: Genitiv
        frame: "Das ist das Auto ___."
        rule: "Genitiv: Zugehörigkeit. Maskuline und neutrale Nomen bekommen -s oder -es."
    nouns:
      - { g: m, noun: Mann, gen: Mannes }
      - { g: m, noun: Lehrer, gen: Lehrers }
      - { g: f, noun: Frau }
      - { g: f, noun: Lehrerin }
      - { g: n, noun: Kind, gen: Kindes }
      - { g: n, noun: Baby, gen: Babys }
      - { g: pl, noun: Kinder }
      - { g: pl, noun: Freunde }

  - type: rule
    title: "Die Endungen am Nomen"
    body:
      - "Maskuline und neutrale Nomen bekommen im Genitiv -s oder -es."
      - "-s: das Auto des Lehrers, das Auto des Vaters, das Dach des Autos"
      - "-es: oft bei einsilbigen Nomen und nach -s, -ß, -x, -z, -sch: das Dach des Hauses, das Auto des Mannes, das Ende des Tisches"
      - "Feminine Nomen und Plural-Nomen ändern sich nicht: das Auto <die>der</die> Frau, die Spielsachen <pl>der</pl> Kinder."
      - "Einige maskuline Nomen bekommen -n oder -en: der Junge → des Jungen, der Student → des Studenten."

  - type: rule
    title: "Namen"
    body:
      - "Bei Namen kommt ein -s dazu, und der Name steht vorn. Es gibt keinen Artikel: Annas Buch, Bens Handy."
      - "Wenn der Name auf -s, -ß, -x oder -z endet, schreibst du nur ein Apostroph: Lukas’ Buch."
      - "Kein Apostroph vor dem -s bei anderen Namen: <x>Anna’s Buch</x> ✗ Annas Buch ✓"

  - type: rule
    title: "Schreiben und Sprechen"
    body:
      - "In geschriebenen Texten ist der Genitiv häufig: das Auto des Mannes."
      - "Beim Sprechen benutzt man oft „von“ + Dativ: das Auto von dem Mann, das Auto vom Mann."
      - "Man versteht beides. Lerne, den Genitiv zu verstehen und im Schreiben zu benutzen."

  - type: rule
    title: "Präpositionen mit Genitiv"
    body:
      - "Nach einigen Präpositionen steht der Genitiv, zum Beispiel: wegen, während, trotz"
      - "Wegen <c>des Regens</c> bleibe ich zu Hause."
      - "Während <c>des Unterrichts</c> sprechen wir Deutsch."
      - "Trotz <c>der Kälte</c> gehen wir spazieren."
      - "Beim Sprechen hörst du auch den Dativ: wegen dem Regen. Beim Schreiben benutze den Genitiv."

  - type: rule
    title: "Achtung!"
    body:
      - "<x>Das ist das Auto der Mann.</x> ✗ Das ist das Auto <der>des</der> Mannes. ✓"
      - "<x>Das ist das Auto des Frau.</x> ✗ Das ist das Auto <die>der</die> Frau. ✓"
      - "<x>Das ist das Auto des Mann.</x> ✗ Denk an die Endung: des Mannes. ✓"

practice:
  - id: definite
    title: "des, der"
    count: 8
    concepts: [ case.gen-articles ]
    instruction: "Welche Form ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Genitiv: der → des (+ -s/-es), die → der, das → des (+ -s/-es), Plural → der."
    items:
      - type: article-pick
        kind: definite
        case: gen
        items:
          - { g: m, noun: Mann, frame: "Das ist das Auto ___ Mannes." }
          - { g: m, noun: Lehrer, frame: "Das ist der Stift ___ Lehrers." }
          - { g: f, noun: Frau, frame: "Das ist das Auto ___ Frau." }
          - { g: f, noun: Lehrerin, frame: "Das ist die Tasche ___ Lehrerin." }
          - { g: n, noun: Kind, frame: "Das ist das Fahrrad ___ Kindes." }
          - { g: n, noun: Baby, frame: "Das ist das Bett ___ Babys." }
          - { g: pl, noun: Kinder, frame: "Das sind die Spielsachen ___ Kinder." }
          - { g: m, noun: Hund, frame: "Das ist das Futter ___ Hundes." }

  - id: indefinite
    title: "eines, einer"
    count: 6
    concepts: [ case.gen-articles ]
    instruction: "Welche Form von „ein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Genitiv: ein (m) → eines, eine (f) → einer, ein (n) → eines."
    items:
      - type: article-pick
        kind: indefinite
        case: gen
        items:
          - { g: m, noun: Freund, frame: "Das ist das Handy ___ Freundes." }
          - { g: f, noun: Freundin, frame: "Das ist das Handy ___ Freundin." }
          - { g: n, noun: Kind, frame: "Das ist das Spielzeug ___ Kindes." }
          - { g: m, noun: Arzt, frame: "Das ist die Tasche ___ Arztes." }
          - { g: f, noun: Lehrerin, frame: "Das ist das Buch ___ Lehrerin." }
          - { g: n, noun: Baby, frame: "Das ist die Flasche ___ Babys." }

  - id: possessive
    title: "meines, meiner"
    count: 8
    concepts: [ case.gen-articles ]
    instruction: "Welche Form von „mein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Genitiv: meines (m, n), meiner (f und Plural)."
    items:
      - type: article-pick
        kind: possessive
        case: gen
        items:
          - { g: m, noun: Bruder, frame: "Das ist das Zimmer ___ Bruders." }
          - { g: f, noun: Schwester, frame: "Das ist das Zimmer ___ Schwester." }
          - { g: n, noun: Kind, frame: "Das ist der Name ___ Kindes." }
          - { g: pl, noun: Eltern, frame: "Das ist das Haus ___ Eltern." }
          - { g: m, noun: Vater, frame: "Das ist das Auto ___ Vaters." }
          - { g: f, noun: Mutter, frame: "Das ist die Tasche ___ Mutter." }
          - { g: pl, noun: Freunde, frame: "Das sind die Namen ___ Freunde." }
          - { g: n, noun: Baby, frame: "Das ist das Bett ___ Babys." }

  - id: negative
    title: "keines, keiner"
    count: 4
    concepts: [ case.gen-articles ]
    instruction: "Welche Form von „kein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "„kein“ funktioniert wie „mein“: keines (m, n), keiner (f und Plural)."
    items:
      - type: article-pick
        kind: negative
        case: gen
        items:
          - { g: m, noun: Mann, frame: "Das ist das Auto ___ Mannes." }
          - { g: f, noun: Frau, frame: "Das ist die Tasche ___ Frau." }
          - { g: n, noun: Kind, frame: "Das ist das Spielzeug ___ Kindes." }
          - { g: pl, noun: Kinder, frame: "Das ist das Zimmer ___ Kinder." }

  - id: endings
    title: "Endungen"
    count: 8
    shuffle: true
    concepts: [ case.gen-nouns ]
    instruction: "Welche Form vom Nomen ist richtig?"
    explanation: "Maskuline und neutrale Nomen bekommen im Genitiv -s oder -es."
    items:
      - { type: pick, sentence: "Das ist das Auto des ___.", options: [ Mannes, Mann, Männer ], answer: Mannes, explanation: "der Mann → des Mannes (-es)." }
      - { type: pick, sentence: "Das ist die Tasche des ___.", options: [ Lehrers, Lehrer, Lehrern ], answer: Lehrers, explanation: "der Lehrer → des Lehrers (-s)." }
      - { type: pick, sentence: "Das ist das Dach des ___.", options: [ Hauses, Haus, Häuser ], answer: Hauses, explanation: "das Haus → des Hauses (-es nach -s)." }
      - { type: pick, sentence: "Das ist das Futter des ___.", options: [ Hundes, Hund, Hunde ], answer: Hundes, explanation: "der Hund → des Hundes (-es)." }
      - { type: pick, sentence: "Das ist das Zimmer meines ___.", options: [ Vaters, Vater, Väter ], answer: Vaters, explanation: "der Vater → des Vaters (-s)." }
      - { type: pick, sentence: "Das ist das Ende des ___.", options: [ Tisches, Tisch, Tische ], answer: Tisches, explanation: "der Tisch → des Tisches (-es nach -sch)." }
      - { type: pick, sentence: "Das ist die Tür der ___.", options: [ Schule, Schules, Schulen ], answer: Schule, explanation: "Feminine Nomen ändern sich nicht: die Schule → der Schule." }
      - { type: pick, sentence: "Das ist das Fahrrad des ___.", options: [ Jungen, Junge, Jungens ], answer: Jungen, explanation: "der Junge → des Jungen (einige maskuline Nomen bekommen -n oder -en)." }
      - { type: pick, sentence: "Das ist der Name des ___.", options: [ Autos, Auto, Autoes ], answer: Autos, explanation: "das Auto → des Autos (-s)." }

  - id: names
    title: "Namen"
    count: 5
    shuffle: true
    concepts: [ case.gen-names ]
    instruction: "Welche Form ist richtig?"
    explanation: "Namen bekommen -s und stehen vorn, ohne Artikel."
    items:
      - { type: pick, sentence: "Das ist ___ Handy. (Anna)", options: [ Annas, Anna’s, Annes ], answer: Annas, explanation: "Anna + s = Annas. Kein Apostroph." }
      - { type: pick, sentence: "Das ist ___ Fahrrad. (Ben)", options: [ Bens, Ben’s, Benes ], answer: Bens, explanation: "Ben + s = Bens." }
      - { type: pick, sentence: "Das ist ___ Buch. (Lukas)", options: [ Lukas’, Lukass, Lukases ], answer: Lukas’, explanation: "Namen mit -s am Ende bekommen nur einen Apostroph." }
      - { type: pick, sentence: "Das ist ___ Tasche. (Mia)", options: [ Mias, Mia’s, Mien ], answer: Mias, explanation: "Mia + s = Mias." }
      - { type: pick, sentence: "Das ist ___ Zimmer. (Max)", options: [ Max’, Maxs, Maxes ], answer: Max’, explanation: "Namen mit -x am Ende bekommen nur einen Apostroph." }

  - id: which
    title: "Welcher Fall?"
    count: 6
    shuffle: true
    concepts: [ case.gen-articles, case.overview ]
    items:
      - { type: pick, instruction: "Welcher Fall ist „des Mannes“?", prompt: "Das ist das Auto des Mannes.", options: [ Nominativ, Akkusativ, Dativ, Genitiv ], answer: Genitiv, explanation: "„des Mannes“ zeigt Zugehörigkeit: Genitiv." }
      - { type: pick, instruction: "Welcher Fall ist „dem Mann“?", prompt: "Ich helfe dem Mann.", options: [ Nominativ, Akkusativ, Dativ, Genitiv ], answer: Dativ, explanation: "„helfen“ braucht den Dativ." }
      - { type: pick, instruction: "Welcher Fall ist „den Mann“?", prompt: "Ich sehe den Mann.", options: [ Nominativ, Akkusativ, Dativ, Genitiv ], answer: Akkusativ, explanation: "„sehen“ braucht den Akkusativ." }
      - { type: pick, instruction: "Welcher Fall ist „der Frau“?", prompt: "Das ist die Tasche der Frau.", options: [ Nominativ, Akkusativ, Dativ, Genitiv ], answer: Genitiv, explanation: "Die Tasche gehört der Frau: Genitiv. („der Frau“ kann auch Dativ sein, hier gehört es aber zu „die Tasche“.)" }
      - { type: pick, instruction: "Welcher Fall ist „der Mann“?", prompt: "Der Mann schläft.", options: [ Nominativ, Akkusativ, Dativ, Genitiv ], answer: Nominativ, explanation: "Das Subjekt steht im Nominativ." }
      - { type: pick, instruction: "Welcher Fall ist „meines Bruders“?", prompt: "Das ist das Handy meines Bruders.", options: [ Nominativ, Akkusativ, Dativ, Genitiv ], answer: Genitiv, explanation: "„meines Bruders“: Genitiv (Zugehörigkeit)." }

  - id: match
    title: "Paare"
    shuffle: false
    items:
      - type: pairs
        concepts: [ case.gen-vs-von ]
        instruction: "Tippe die geschriebene Form an, dann die gesprochene Form."
        pairs: [ [ das Auto des Mannes, das Auto vom Mann ], [ das Zimmer meiner Schwester, das Zimmer von meiner Schwester ], [ das Handy des Lehrers, das Handy vom Lehrer ], [ die Tasche der Frau, die Tasche von der Frau ] ]

  - id: prepositions
    title: "wegen, während, trotz"
    count: 6
    shuffle: true
    concepts: [ case.gen-prepositions ]
    instruction: "Nach diesen Präpositionen steht der Genitiv. Welche Form ist richtig?"
    explanation: "wegen, während, trotz + Genitiv."
    items:
      - { type: pick, sentence: "Wegen ___ Regens bleibe ich zu Hause.", options: [ des, dem, den, der ], answer: des }
      - { type: pick, sentence: "Während ___ Unterrichts sprechen wir Deutsch.", options: [ des, dem, den, der ], answer: des }
      - { type: pick, sentence: "Trotz ___ Kälte gehen wir spazieren.", options: [ der, des, dem, den ], answer: der }
      - { type: pick, sentence: "Wegen ___ Krankheit kommt sie nicht.", options: [ der, des, dem, den ], answer: der }
      - { type: pick, sentence: "Während ___ Pause trinken wir Kaffee.", options: [ der, des, dem, den ], answer: der }
      - { type: pick, sentence: "Trotz ___ Lärms schläft das Baby.", options: [ des, dem, den, der ], answer: des }

  - id: correct
    title: "Was ist richtig?"
    count: 6
    concepts: [ case.gen-articles, case.gen-nouns ]
    instruction: "Tippe den richtigen Satz an."
    items:
      - type: pick
        options: [ "Das ist das Auto des Mannes.", "Das ist das Auto des Mann.", "Das ist das Auto der Mannes." ]
        answer: "Das ist das Auto des Mannes."
        explanation: "Maskulin: des + Nomen mit -es."
      - type: pick
        options: [ "Das ist die Tasche der Lehrerin.", "Das ist die Tasche des Lehrerin.", "Das ist die Tasche der Lehrerins." ]
        answer: "Das ist die Tasche der Lehrerin."
        explanation: "Feminin: der, und das Nomen ändert sich nicht."
      - type: pick
        options: [ "Das ist das Handy meines Bruders.", "Das ist das Handy meinem Bruder.", "Das ist das Handy mein Bruders." ]
        answer: "Das ist das Handy meines Bruders."
        explanation: "Maskulin im Genitiv: meines + Nomen mit -s."
      - type: pick
        options: [ "Das ist Annas Buch.", "Das ist Anna’s Buch.", "Das ist das Buch Annas’." ]
        answer: "Das ist Annas Buch."
        explanation: "Namen: -s dazu, kein Apostroph."
      - type: pick
        options: [ "Wegen des Regens bleiben wir hier.", "Wegen der Regen bleiben wir hier.", "Wegen dem Regens bleiben wir hier." ]
        answer: "Wegen des Regens bleiben wir hier."
        explanation: "„wegen“ + Genitiv: des Regens."
      - type: pick
        options: [ "Das ist das Zimmer der Kinder.", "Das ist das Zimmer des Kinder.", "Das ist das Zimmer den Kindern." ]
        answer: "Das ist das Zimmer der Kinder."
        explanation: "Plural im Genitiv: der, das Nomen ändert sich nicht."

  - id: puzzle
    title: "Satzpuzzle"
    count: 5
    concepts: [ case.gen-articles, syntax.verb-position-2 ]
    instruction: "Bringe die Wörter in die richtige Reihenfolge."
    explanation: "Der Genitiv steht direkt nach dem Nomen, zu dem er gehört."
    items:
      - { type: sentence-order, words: "das ist das Auto des Mannes", accept: [ "das ist das Auto des Mannes" ] }
      - { type: sentence-order, words: "ich suche das Handy meiner Schwester", accept: [ "ich suche das Handy meiner Schwester" ] }
      - { type: sentence-order, words: "wir besuchen die Eltern meines Freundes", accept: [ "wir besuchen die Eltern meines Freundes" ] }
      - { type: sentence-order, words: "wegen des Regens bleiben wir zu_Hause", accept: [ "wegen des Regens bleiben wir zu_Hause" ] }
      - { type: sentence-order, words: "Anna liest Bens Buch", accept: [ "Anna liest Bens Buch" ] }

  - id: write
    title: "Schreiben"
    concepts: [ writing.simple-sentences, case.gen-articles ]
    instruction: "Schreibe 4 Sätze oder mehr. Benutze die Wörter."
    items:
      - type: free-writing
        task: "Schreibe über Menschen und Dinge um dich herum: Wessen Sachen siehst du? Wessen Familie kennst du?"
        words: [ das Auto, das Zimmer, des, der, meines, meiner, wegen ]
        minSentences: 4
        checklist:
          - "Ich habe den Genitiv nach einem Nomen benutzt (das Auto des Mannes)."
          - "Maskuline und neutrale Nomen haben -s oder -es."
          - "Ich habe Namen mit -s ohne Apostroph geschrieben (Annas Buch)."
        model: "Das ist das Zimmer meiner Schwester. Ich suche das Handy meines Bruders. Annas Katze schläft im Garten. Wegen des Regens bleiben wir zu Hause."
