# Training: the Genitiv (B1). Belonging, articles, noun endings, names, wegen/während/trotz.
# Typical level: the Genitiv is taught around B1 (spoken German often uses von + Dativ instead).
# Original content. English and German texts are written side by side: { en: "...", de: "..." }.
kind: lesson
id: genitive-b1
title: { en: "Genitiv", de: "Genitiv" }
level: B1
skill: grammar
minutes: 30
status: draft
description:
  en: "The Genitiv shows belonging: das Auto des Mannes. Articles, noun endings (-s, -es), names (Annas Buch) and the prepositions wegen, während, trotz."
  de: "Der Genitiv zeigt Zugehörigkeit: das Auto des Mannes. Mit Artikeln, Nomen-Endungen (-s, -es), Namen (Annas Buch) und den Präpositionen wegen, während, trotz."
canDo:
  - { en: "I can say who something belongs to with the Genitiv.", de: "Ich kann mit dem Genitiv sagen, wem etwas gehört." }
  - { en: "I can use des, der, eines, einer, meines, meiner and the noun endings -s and -es.", de: "Ich kann „des“, „der“, „eines“, „einer“, „meines“, „meiner“ und die Endungen -s und -es benutzen." }
  - { en: "I can understand wegen, während and trotz with the Genitiv.", de: "Ich kann „wegen“, „während“ und „trotz“ mit Genitiv verstehen." }

articles:
  definite:
    label: { en: "the", de: "der, die, das" }
    nom: [der, die, das, die]
    akk: [den, die, das, die]
    dat: [dem, der, dem, den]
    gen: [des, der, des, der]
  indefinite:
    label: { en: "a", de: "ein, eine" }
    nom: [ein, eine, ein, ""]
    akk: [einen, eine, ein, ""]
    dat: [einem, einer, einem, ""]
    gen: [eines, einer, eines, ""]
  possessive:
    label: { en: "my", de: "mein, meine" }
    nom: [mein, meine, mein, meine]
    akk: [meinen, meine, mein, meine]
    dat: [meinem, meiner, meinem, meinen]
    gen: [meines, meiner, meines, meiner]
  negative:
    label: { en: "no", de: "kein, keine" }
    nom: [kein, keine, kein, keine]
    akk: [keinen, keine, kein, keine]
    dat: [keinem, keiner, keinem, keinen]
    gen: [keines, keiner, keines, keiner]

understand:
  - type: dialogue
    title: { en: "Listen: whose is it?", de: "Hör zu: Wem gehört das?" }
    lines:
      - { who: Mia, say: "Ist das das Handy <die>deiner</die> Schwester?" }
      - { who: Ben, say: "Nein, das ist das Handy <der>meines</der> Bruders." }
      - { who: Mia, say: "Und die Tasche? Das ist die Tasche <der>des</der> Lehrers, oder?" }
      - { who: Ben, say: "Nein, das ist Annas Tasche." }

  - type: text
    title: { en: "The Genitiv: belonging", de: "Der Genitiv: Zugehörigkeit" }
    body:
      - en: "Objects can be in the Akkusativ, the Dativ or the Genitiv. The Genitiv does not follow a verb. It belongs to a noun and shows that something belongs to somebody or is a part of something."
        de: "Objekte können im Akkusativ, im Dativ oder im Genitiv stehen. Der Genitiv steht nicht nach einem Verb. Er gehört zu einem Nomen und zeigt, wem etwas gehört oder wovon etwas ein Teil ist."
      - { en: "Das ist das Auto <c>des Mannes</c>.", de: "Das ist das Auto <c>des Mannes</c>." }
      - { en: "“des Mannes” is the Genitiv. It belongs to “das Auto” and tells us whose car it is. It always comes after the noun it belongs to.", de: "„des Mannes“ ist der Genitiv. Er gehört zu „das Auto“ und sagt, wessen Auto es ist. Er steht immer nach dem Nomen, zu dem er gehört." }
      - { en: "Tip: the question wessen? (whose?) can help. Wessen Auto ist das? – das Auto des Mannes.", de: "Tipp: Die Frage „Wessen?“ kann helfen. Wessen Auto ist das? – das Auto des Mannes." }

  - type: article-table
    title: { en: "The articles: der, die, das", de: "Die Artikel: der, die, das" }
    intro:
      en: "Look at the tables. The colour shows the gender of the noun. Highlighted forms are different from the Nominativ."
      de: "Schau auf die Tabellen. Die Farbe zeigt das Genus vom Nomen. Markierte Formen sind anders als im Nominativ."
    kinds: [definite]
    cases:
      - { id: nom, label: { en: Nominativ, de: Nominativ } }
      - { id: gen, label: { en: Genitiv, de: Genitiv } }
    note:
      en: |-
        masculine and neuter: <der>des</der> / <das>des</das> + noun with -s or -es
        feminine and plural: <die>der</die>, the noun does not change
      de: |-
        Maskulin und Neutrum: <der>des</der> / <das>des</das> + Nomen mit -s oder -es
        Feminin und Plural: <die>der</die>, das Nomen ändert sich nicht

  - type: article-table
    title: { en: "ein, eine", de: "ein, eine" }
    kinds: [indefinite]
    cases:
      - { id: nom, label: { en: Nominativ, de: Nominativ } }
      - { id: gen, label: { en: Genitiv, de: Genitiv } }
    note:
      en: "ein → <der>eines</der>, eine → <die>einer</die>, ein → <das>eines</das>."
      de: "ein → <der>eines</der>, eine → <die>einer</die>, ein → <das>eines</das>."

  - type: article-table
    title: { en: "mein, meine", de: "mein, meine" }
    kinds: [possessive]
    cases:
      - { id: nom, label: { en: Nominativ, de: Nominativ } }
      - { id: gen, label: { en: Genitiv, de: Genitiv } }
    note:
      en: "mein → <der>meines</der>, meine → <die>meiner</die>, mein → <das>meines</das>, meine (plural) → <pl>meiner</pl>. dein, sein, ihr … work in the same way."
      de: "mein → <der>meines</der>, meine → <die>meiner</die>, mein → <das>meines</das>, meine (Plural) → <pl>meiner</pl>. „dein“, „sein“, „ihr“ … funktionieren genauso."

  - type: article-table
    title: { en: "kein, keine", de: "kein, keine" }
    kinds: [negative]
    cases:
      - { id: nom, label: { en: Nominativ, de: Nominativ } }
      - { id: gen, label: { en: Genitiv, de: Genitiv } }
    note:
      en: "kein → <der>keines</der>, keine → <die>keiner</die>, kein → <das>keines</das>, keine (plural) → <pl>keiner</pl>."
      de: "kein → <der>keines</der>, keine → <die>keiner</die>, kein → <das>keines</das>, keine (Plural) → <pl>keiner</pl>."

  - type: case-lab
    title: { en: "The case lab", de: "Das Fall-Labor" }
    intro:
      en: "Choose an article, a case and a noun. The article that changes is highlighted. In the Genitiv, masculine and neuter nouns change too."
      de: "Wähle einen Artikel, einen Fall und ein Nomen. Der Artikel, der sich ändert, ist markiert. Im Genitiv ändern sich auch maskuline und neutrale Nomen."
    kinds: [definite, indefinite, possessive, negative]
    cases:
      - id: nom
        label: { en: Nominativ, de: Nominativ }
        frame: ["___ ist hier.", "___ sind hier."]
        rule: { en: "Nominativ: the subject.", de: "Nominativ: das Subjekt." }
      - id: gen
        label: { en: Genitiv, de: Genitiv }
        frame: "Das ist das Auto ___."
        rule: { en: "Genitiv: belonging. Masculine and neuter nouns get -s or -es.", de: "Genitiv: Zugehörigkeit. Maskuline und neutrale Nomen bekommen -s oder -es." }
    nouns:
      - { g: m, noun: Mann, gen: Mannes }
      - { g: m, noun: Lehrer, gen: Lehrers }
      - { g: f, noun: Frau }
      - { g: f, noun: Lehrerin }
      - { g: n, noun: Kind, gen: Kindes }
      - { g: n, noun: Baby, gen: Babys }
      - { g: pl, noun: Kinder }
      - { g: pl, noun: Freunde }

  - type: rule
    title: { en: "The noun endings", de: "Die Endungen am Nomen" }
    body:
      - { en: "Masculine and neuter nouns get -s or -es in the Genitiv.", de: "Maskuline und neutrale Nomen bekommen im Genitiv -s oder -es." }
      - { en: "-s: das Auto des Lehrers, das Auto des Vaters, das Dach des Autos", de: "-s: das Auto des Lehrers, das Auto des Vaters, das Dach des Autos" }
      - { en: "-es: often after one-syllable nouns and after -s, -ß, -x, -z, -sch: das Dach des Hauses, das Auto des Mannes, das Ende des Tisches", de: "-es: oft bei einsilbigen Nomen und nach -s, -ß, -x, -z, -sch: das Dach des Hauses, das Auto des Mannes, das Ende des Tisches" }
      - { en: "Feminine nouns and plural nouns do not change: das Auto <die>der</die> Frau, die Spielsachen <pl>der</pl> Kinder.", de: "Feminine Nomen und Plural-Nomen ändern sich nicht: das Auto <die>der</die> Frau, die Spielsachen <pl>der</pl> Kinder." }
      - { en: "A few masculine nouns get -n or -en: der Junge → des Jungen, der Student → des Studenten.", de: "Einige maskuline Nomen bekommen -n oder -en: der Junge → des Jungen, der Student → des Studenten." }

  - type: rule
    title: { en: "Names", de: "Namen" }
    body:
      - { en: "With names, add -s and put the name in front. There is no article: Annas Buch, Bens Handy.", de: "Bei Namen kommt ein -s dazu, und der Name steht vorn. Es gibt keinen Artikel: Annas Buch, Bens Handy." }
      - { en: "If the name ends in -s, -ß, -x or -z, write only an apostrophe: Lukas’ Buch.", de: "Wenn der Name auf -s, -ß, -x oder -z endet, schreibst du nur ein Apostroph: Lukas’ Buch." }
      - { en: "No apostrophe with -s after other names: <x>Anna’s Buch</x> ✗ Annas Buch ✓", de: "Kein Apostroph vor dem -s bei anderen Namen: <x>Anna’s Buch</x> ✗ Annas Buch ✓" }

  - type: rule
    title: { en: "Writing and speaking", de: "Schreiben und Sprechen" }
    body:
      - { en: "In writing, the Genitiv is common: das Auto des Mannes.", de: "In geschriebenen Texten ist der Genitiv häufig: das Auto des Mannes." }
      - { en: "In speaking, people often use von + Dativ: das Auto von dem Mann, das Auto vom Mann.", de: "Beim Sprechen benutzt man oft „von“ + Dativ: das Auto von dem Mann, das Auto vom Mann." }
      - { en: "Both are understood. Learn to understand the Genitiv and to use it in writing.", de: "Man versteht beides. Lerne, den Genitiv zu verstehen und im Schreiben zu benutzen." }

  - type: rule
    title: { en: "Prepositions with the Genitiv", de: "Präpositionen mit Genitiv" }
    body:
      - { en: "Some prepositions are followed by the Genitiv, for example: wegen, während, trotz", de: "Nach einigen Präpositionen steht der Genitiv, zum Beispiel: wegen, während, trotz" }
      - { en: "Wegen <c>des Regens</c> bleibe ich zu Hause.", de: "Wegen <c>des Regens</c> bleibe ich zu Hause." }
      - { en: "Während <c>des Unterrichts</c> sprechen wir Deutsch.", de: "Während <c>des Unterrichts</c> sprechen wir Deutsch." }
      - { en: "Trotz <c>der Kälte</c> gehen wir spazieren.", de: "Trotz <c>der Kälte</c> gehen wir spazieren." }
      - { en: "In speaking you will also hear the Dativ: wegen dem Regen. In writing, use the Genitiv.", de: "Beim Sprechen hörst du auch den Dativ: wegen dem Regen. Beim Schreiben benutze den Genitiv." }

  - type: rule
    title: { en: "Watch out!", de: "Achtung!" }
    body:
      - { en: "<x>Das ist das Auto der Mann.</x> ✗ Das ist das Auto <der>des</der> Mannes. ✓", de: "<x>Das ist das Auto der Mann.</x> ✗ Das ist das Auto <der>des</der> Mannes. ✓" }
      - { en: "<x>Das ist das Auto des Frau.</x> ✗ Das ist das Auto <die>der</die> Frau. ✓", de: "<x>Das ist das Auto des Frau.</x> ✗ Das ist das Auto <die>der</die> Frau. ✓" }
      - { en: "<x>Das ist das Auto des Mann.</x> ✗ Remember the ending: des Mannes. ✓", de: "<x>Das ist das Auto des Mann.</x> ✗ Denk an die Endung: des Mannes. ✓" }

practice:
  - id: definite
    title: { en: "des, der", de: "des, der" }
    count: 8
    concepts: [case.gen-articles]
    instruction: { en: "Which form is right? The article of the noun is shown in its colour.", de: "Welche Form ist richtig? Der Artikel vom Nomen steht in seiner Farbe." }
    explanation: { en: "Genitiv: der → des (+ -s/-es), die → der, das → des (+ -s/-es), plural → der.", de: "Genitiv: der → des (+ -s/-es), die → der, das → des (+ -s/-es), Plural → der." }
    items:
      - type: article-pick
        kind: definite
        case: gen
        items:
          - { g: m, noun: Mann, frame: "Das ist das Auto ___ Mannes." }
          - { g: m, noun: Lehrer, frame: "Das ist der Stift ___ Lehrers." }
          - { g: f, noun: Frau, frame: "Das ist das Auto ___ Frau." }
          - { g: f, noun: Lehrerin, frame: "Das ist die Tasche ___ Lehrerin." }
          - { g: n, noun: Kind, frame: "Das ist das Fahrrad ___ Kindes." }
          - { g: n, noun: Baby, frame: "Das ist das Bett ___ Babys." }
          - { g: pl, noun: Kinder, frame: "Das sind die Spielsachen ___ Kinder." }
          - { g: m, noun: Hund, frame: "Das ist das Futter ___ Hundes." }

  - id: indefinite
    title: { en: "eines, einer", de: "eines, einer" }
    count: 6
    concepts: [case.gen-articles]
    instruction: { en: "Which form of “ein” is right? The article of the noun is shown in its colour.", de: "Welche Form von „ein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe." }
    explanation: { en: "Genitiv: ein (m) → eines, eine (f) → einer, ein (n) → eines.", de: "Genitiv: ein (m) → eines, eine (f) → einer, ein (n) → eines." }
    items:
      - type: article-pick
        kind: indefinite
        case: gen
        items:
          - { g: m, noun: Freund, frame: "Das ist das Handy ___ Freundes." }
          - { g: f, noun: Freundin, frame: "Das ist das Handy ___ Freundin." }
          - { g: n, noun: Kind, frame: "Das ist das Spielzeug ___ Kindes." }
          - { g: m, noun: Arzt, frame: "Das ist die Tasche ___ Arztes." }
          - { g: f, noun: Lehrerin, frame: "Das ist das Buch ___ Lehrerin." }
          - { g: n, noun: Baby, frame: "Das ist die Flasche ___ Babys." }

  - id: possessive
    title: { en: "meines, meiner", de: "meines, meiner" }
    count: 8
    concepts: [case.gen-articles]
    instruction: { en: "Which form of “mein” is right? The article of the noun is shown in its colour.", de: "Welche Form von „mein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe." }
    explanation: { en: "Genitiv: meines (m, n), meiner (f and plural).", de: "Genitiv: meines (m, n), meiner (f und Plural)." }
    items:
      - type: article-pick
        kind: possessive
        case: gen
        items:
          - { g: m, noun: Bruder, frame: "Das ist das Zimmer ___ Bruders." }
          - { g: f, noun: Schwester, frame: "Das ist das Zimmer ___ Schwester." }
          - { g: n, noun: Kind, frame: "Das ist der Name ___ Kindes." }
          - { g: pl, noun: Eltern, frame: "Das ist das Haus ___ Eltern." }
          - { g: m, noun: Vater, frame: "Das ist das Auto ___ Vaters." }
          - { g: f, noun: Mutter, frame: "Das ist die Tasche ___ Mutter." }
          - { g: pl, noun: Freunde, frame: "Das sind die Namen ___ Freunde." }
          - { g: n, noun: Baby, frame: "Das ist das Bett ___ Babys." }

  - id: negative
    title: { en: "keines, keiner", de: "keines, keiner" }
    count: 4
    concepts: [case.gen-articles]
    instruction: { en: "Which form of “kein” is right? The article of the noun is shown in its colour.", de: "Welche Form von „kein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe." }
    explanation: { en: "kein works like mein: keines (m, n), keiner (f and plural).", de: "„kein“ funktioniert wie „mein“: keines (m, n), keiner (f und Plural)." }
    items:
      - type: article-pick
        kind: negative
        case: gen
        items:
          - { g: m, noun: Mann, frame: "Das ist das Auto ___ Mannes." }
          - { g: f, noun: Frau, frame: "Das ist die Tasche ___ Frau." }
          - { g: n, noun: Kind, frame: "Das ist das Spielzeug ___ Kindes." }
          - { g: pl, noun: Kinder, frame: "Das ist das Zimmer ___ Kinder." }

  - id: endings
    title: { en: "Noun endings", de: "Endungen" }
    count: 8
    shuffle: true
    concepts: [case.gen-nouns]
    instruction: { en: "Which noun form is right?", de: "Welche Form vom Nomen ist richtig?" }
    explanation: { en: "Masculine and neuter nouns get -s or -es in the Genitiv.", de: "Maskuline und neutrale Nomen bekommen im Genitiv -s oder -es." }
    items:
      - { type: pick, sentence: "Das ist das Auto des ___.", options: [Mannes, Mann, Männer], answer: Mannes, explanation: { en: "der Mann → des Mannes (-es).", de: "der Mann → des Mannes (-es)." } }
      - { type: pick, sentence: "Das ist die Tasche des ___.", options: [Lehrers, Lehrer, Lehrern], answer: Lehrers, explanation: { en: "der Lehrer → des Lehrers (-s).", de: "der Lehrer → des Lehrers (-s)." } }
      - { type: pick, sentence: "Das ist das Dach des ___.", options: [Hauses, Haus, Häuser], answer: Hauses, explanation: { en: "das Haus → des Hauses (-es after -s).", de: "das Haus → des Hauses (-es nach -s)." } }
      - { type: pick, sentence: "Das ist das Futter des ___.", options: [Hundes, Hund, Hunde], answer: Hundes, explanation: { en: "der Hund → des Hundes (-es).", de: "der Hund → des Hundes (-es)." } }
      - { type: pick, sentence: "Das ist das Zimmer meines ___.", options: [Vaters, Vater, Väter], answer: Vaters, explanation: { en: "der Vater → des Vaters (-s).", de: "der Vater → des Vaters (-s)." } }
      - { type: pick, sentence: "Das ist das Ende des ___.", options: [Tisches, Tisch, Tische], answer: Tisches, explanation: { en: "der Tisch → des Tisches (-es after -sch).", de: "der Tisch → des Tisches (-es nach -sch)." } }
      - { type: pick, sentence: "Das ist die Tür der ___.", options: [Schule, Schules, Schulen], answer: Schule, explanation: { en: "Feminine nouns do not change: die Schule → der Schule.", de: "Feminine Nomen ändern sich nicht: die Schule → der Schule." } }
      - { type: pick, sentence: "Das ist das Fahrrad des ___.", options: [Jungen, Junge, Jungens], answer: Jungen, explanation: { en: "der Junge → des Jungen (a few masculine nouns get -n or -en).", de: "der Junge → des Jungen (einige maskuline Nomen bekommen -n oder -en)." } }
      - { type: pick, sentence: "Das ist der Name des ___.", options: [Autos, Auto, Autoes], answer: Autos, explanation: { en: "das Auto → des Autos (-s).", de: "das Auto → des Autos (-s)." } }

  - id: names
    title: { en: "Names", de: "Namen" }
    count: 5
    shuffle: true
    concepts: [case.gen-names]
    instruction: { en: "Which form is right?", de: "Welche Form ist richtig?" }
    explanation: { en: "Names get -s and stand in front, without an article.", de: "Namen bekommen -s und stehen vorn, ohne Artikel." }
    items:
      - { type: pick, sentence: "Das ist ___ Handy. (Anna)", options: [Annas, Anna’s, Annes], answer: Annas, explanation: { en: "Anna + s = Annas. No apostrophe.", de: "Anna + s = Annas. Kein Apostroph." } }
      - { type: pick, sentence: "Das ist ___ Fahrrad. (Ben)", options: [Bens, Ben’s, Benes], answer: Bens, explanation: { en: "Ben + s = Bens.", de: "Ben + s = Bens." } }
      - { type: pick, sentence: "Das ist ___ Buch. (Lukas)", options: [Lukas’, Lukass, Lukases], answer: Lukas’, explanation: { en: "Names with -s at the end only get an apostrophe.", de: "Namen mit -s am Ende bekommen nur einen Apostroph." } }
      - { type: pick, sentence: "Das ist ___ Tasche. (Mia)", options: [Mias, Mia’s, Mien], answer: Mias, explanation: { en: "Mia + s = Mias.", de: "Mia + s = Mias." } }
      - { type: pick, sentence: "Das ist ___ Zimmer. (Max)", options: [Max’, Maxs, Maxes], answer: Max’, explanation: { en: "Names with -x at the end only get an apostrophe.", de: "Namen mit -x am Ende bekommen nur einen Apostroph." } }

  - id: which
    title: { en: "Which case?", de: "Welcher Fall?" }
    count: 6
    shuffle: true
    concepts: [case.gen-articles, case.overview]
    items:
      - { type: pick, instruction: { en: "Which case is “des Mannes”?", de: "Welcher Fall ist „des Mannes“?" }, prompt: "Das ist das Auto des Mannes.", options: [Nominativ, Akkusativ, Dativ, Genitiv], answer: Genitiv, explanation: { en: "des Mannes shows belonging: Genitiv.", de: "„des Mannes“ zeigt Zugehörigkeit: Genitiv." } }
      - { type: pick, instruction: { en: "Which case is “dem Mann”?", de: "Welcher Fall ist „dem Mann“?" }, prompt: "Ich helfe dem Mann.", options: [Nominativ, Akkusativ, Dativ, Genitiv], answer: Dativ, explanation: { en: "helfen needs the Dativ.", de: "„helfen“ braucht den Dativ." } }
      - { type: pick, instruction: { en: "Which case is “den Mann”?", de: "Welcher Fall ist „den Mann“?" }, prompt: "Ich sehe den Mann.", options: [Nominativ, Akkusativ, Dativ, Genitiv], answer: Akkusativ, explanation: { en: "sehen needs the Akkusativ.", de: "„sehen“ braucht den Akkusativ." } }
      - { type: pick, instruction: { en: "Which case is “der Frau”?", de: "Welcher Fall ist „der Frau“?" }, prompt: "Das ist die Tasche der Frau.", options: [Nominativ, Akkusativ, Dativ, Genitiv], answer: Genitiv, explanation: { en: "The bag belongs to the woman: Genitiv. (der Frau can also be Dativ, but here it belongs to “die Tasche”.)", de: "Die Tasche gehört der Frau: Genitiv. („der Frau“ kann auch Dativ sein, hier gehört es aber zu „die Tasche“.)" } }
      - { type: pick, instruction: { en: "Which case is “der Mann”?", de: "Welcher Fall ist „der Mann“?" }, prompt: "Der Mann schläft.", options: [Nominativ, Akkusativ, Dativ, Genitiv], answer: Nominativ, explanation: { en: "The subject is in the Nominativ.", de: "Das Subjekt steht im Nominativ." } }
      - { type: pick, instruction: { en: "Which case is “meines Bruders”?", de: "Welcher Fall ist „meines Bruders“?" }, prompt: "Das ist das Handy meines Bruders.", options: [Nominativ, Akkusativ, Dativ, Genitiv], answer: Genitiv, explanation: { en: "meines Bruders: Genitiv (belonging).", de: "„meines Bruders“: Genitiv (Zugehörigkeit)." } }

  - id: match
    title: { en: "Match", de: "Paare" }
    shuffle: false
    items:
      - type: pairs
        concepts: [case.gen-vs-von]
        instruction: { en: "Tap the written form, then the spoken form.", de: "Tippe die geschriebene Form an, dann die gesprochene Form." }
        pairs: [[das Auto des Mannes, das Auto vom Mann], [das Zimmer meiner Schwester, das Zimmer von meiner Schwester], [das Handy des Lehrers, das Handy vom Lehrer], [die Tasche der Frau, die Tasche von der Frau]]

  - id: prepositions
    title: { en: "wegen, während, trotz", de: "wegen, während, trotz" }
    count: 6
    shuffle: true
    concepts: [case.gen-prepositions]
    instruction: { en: "These prepositions take the Genitiv. Which form is right?", de: "Nach diesen Präpositionen steht der Genitiv. Welche Form ist richtig?" }
    explanation: { en: "wegen, während, trotz + Genitiv.", de: "wegen, während, trotz + Genitiv." }
    items:
