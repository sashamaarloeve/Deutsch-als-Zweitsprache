# Training: main clauses with short sentences (A1), at most 5 sentence parts (Satzteile).
# Original content, written in German.
kind: lesson
id: main-clauses-a1
title: "Hauptsätze: kurze Sätze"
level: A1
skill: grammar
minutes: 25
status: draft
description: "Kurze Aussagesätze mit bis zu 5 Satzteilen: Subjekt, Verb, Zeit, Ort und Objekt. Du lernst, was wohin gehört und was auf Position 1 stehen kann."
canDo:
  - "Ich kann die Teile eines kurzen Satzes finden: wer, was, wann, wo."
  - "Ich kann das Verb auf Position 2 setzen und die anderen Teile gut ordnen."
  - "Ich kann kurze Sätze mit bis zu 5 Teilen schreiben."

understand:
  - type: dialogue
    title: "Hör zu: kurze Sätze"
    lines:
      - { who: Mia, say: "Ich <v>lerne</v> heute Deutsch. Und du?" }
      - { who: Ben, say: "Ich <v>spiele</v> heute Fußball. Dann <v>koche</v> ich Suppe." }
      - { who: Mia, say: "Wir <v>wohnen</v> in Köln. Wo <v>wohnst</v> du?" }
      - { who: Ben, say: "Ich <v>wohne</v> in Wien." }

  - type: text
    title: "Satzteile"
    body:
      - "Ein Satz besteht aus Teilen. Ein Teil kann ein Wort sein (heute) oder mehrere Wörter, die zusammengehören (in der Schule). In diesem Training hat ein Satz 3 bis 5 Teile."
      - "<p>Ich</p> <v>lerne</v> heute in der Schule Deutsch."
      - "Wer lernt? – ich (Subjekt)"
      - "Wann? – heute (Zeit)"
      - "Wo? – in der Schule (Ort)"
      - "Was? – Deutsch (Objekt)"

  - type: parts-lab
    title: "Das Satzteile-Labor"
    intro: "Wähle einen Satz und einen Teil für Position 1. Das <v>Verb</v> bleibt immer auf Position 2. Die anderen Teile stehen im Mittelfeld."
    roles:
      S: "wer (Subjekt)"
      V: "Verb"
      T: "wann (Zeit)"
      L: "wo (Ort)"
      A: "was (Objekt)"
    sentences:
      - { parts: [ { t: ich, r: S }, { t: spiele, r: V }, { t: heute, r: T }, { t: Fußball, r: A } ], starts: [ S, T, A ] }
      - { parts: [ { t: Mia, r: S }, { t: trinkt, r: V }, { t: morgens, r: T }, { t: Kaffee, r: A } ], starts: [ S, T, A ] }
      - { parts: [ { t: wir, r: S }, { t: wohnen, r: V }, { t: in Berlin, r: L } ], starts: [ S, L ] }
      - { parts: [ { t: Ben, r: S }, { t: kauft, r: V }, { t: heute, r: T }, { t: im Supermarkt, r: L }, { t: Brot, r: A } ], starts: [ S, T, L, A ] }

  - type: detective
    title: "Satz-Detektiv"
    intro: "Tippe einen Teil an. Du siehst die Frage, die ihn findet, und seine Rolle."
    roles:
      S: "wer (Subjekt)"
      V: "Verb (Position 2)"
      T: "wann (Zeit)"
      L: "wo (Ort)"
      A: "was (Objekt)"
    sentences:
      - parts: [ { t: Ich, r: S, q: "Wer lernt?" }, { t: lerne, r: V, q: "Was mache ich?" }, { t: heute, r: T, q: "Wann lerne ich?" }, { t: in der Schule, r: L, q: "Wo lerne ich?" }, { t: Deutsch, r: A, q: "Was lerne ich?" } ]

  - type: rule
    title: "Drei Regeln"
    body:
      - "1. Das <v>Verb</v> steht auf Position 2."
      - "2. Auf Position 1 kann das Subjekt, eine Zeit, ein Ort oder ein Objekt stehen. Wenn es nicht das Subjekt ist, steht das Subjekt nach dem Verb."
      - "3. Die normale Reihenfolge im Mittelfeld: Subjekt – Zeit – Objekt – Ort. Beispiel: Ich lerne <en>heute</en> <st>Deutsch</st> in der Schule."

  - type: rule
    title: "Fragen"
    body:
      - "W-Fragen beginnen mit einem Fragewort. Das <v>Verb</v> steht auf Position 2:"
      - "<p>Wann</p> <v>lernst</v> du Deutsch?"
      - "<p>Wo</p> <v>wohnt</v> Ben?"
      - "<p>Wer</p> <v>kocht</v> heute?"
      - "Das Fragewort steht auf Position 1 und das <v>Verb</v> auf Position 2."

  - type: rule
    title: "Achtung!"
    body:
      - "<x>Heute ich spiele Fußball.</x> ✗ <p>Heute</p> <v>spiele</v> ich Fußball. ✓"
      - "<x>Ich spiele Fußball heute.</x> ist nicht die normale Reihenfolge. Besser: Ich spiele <en>heute</en> Fußball."

practice:
  - id: which
    title: "Welcher Teil?"
    count: 8
    shuffle: true
    concepts: [ syntax.parts ]
    items:
      - { type: pick, instruction: "Welcher Teil antwortet auf: Wer?", prompt: "Mia lernt heute Deutsch.", options: [ "Mia", "lernt", "heute", "Deutsch" ], answer: "Mia", explanation: "Wer lernt? – Mia." }
      - { type: pick, instruction: "Welcher Teil antwortet auf: Wann?", prompt: "Mia lernt heute Deutsch.", options: [ "Mia", "lernt", "heute", "Deutsch" ], answer: "heute", explanation: "Wann lernt Mia? – heute." }
      - { type: pick, instruction: "Welcher Teil antwortet auf: Was?", prompt: "Mia lernt heute Deutsch.", options: [ "Mia", "lernt", "heute", "Deutsch" ], answer: "Deutsch", explanation: "Was lernt Mia? – Deutsch." }
      - { type: pick, instruction: "Welcher Teil antwortet auf: Wo?", prompt: "Wir wohnen in Berlin.", options: [ "Wir", "wohnen", "in Berlin" ], answer: "in Berlin", explanation: "Wo wohnen wir? – in Berlin." }
      - { type: pick, instruction: "Welcher Teil antwortet auf: Wo?", prompt: "Ben kauft heute im Supermarkt Brot.", options: [ "Ben", "kauft", "heute", "im Supermarkt", "Brot" ], answer: "im Supermarkt", explanation: "Wo kauft Ben Brot? – im Supermarkt." }
      - { type: pick, instruction: "Welcher Teil ist das Verb?", prompt: "Anna trinkt morgens Tee.", options: [ "Anna", "trinkt", "morgens", "Tee" ], answer: "trinkt", explanation: "Das Verb sagt, was passiert: trinkt." }
      - { type: pick, instruction: "Welcher Teil steht auf Position 1?", prompt: "Heute spiele ich Fußball.", options: [ "Heute", "spiele", "ich", "Fußball" ], answer: "Heute", explanation: "Der erste Teil ist „Heute“. Das Verb steht auf Position 2." }
      - { type: pick, instruction: "Welcher Teil ist das Subjekt? Frage: Wer?", prompt: "Morgen kocht Ben Suppe.", options: [ "Morgen", "kocht", "Ben", "Suppe" ], answer: "Ben", explanation: "Wer kocht? – Ben. Das Subjekt steht nach dem Verb." }

  - id: boxes
    title: "Felder"
    count: 8
    boxes:
      - "Position 1"
      - "Verb"
      - "Mittelfeld"
    roleLabels:
      S: "wer"
      V: "Verb"
      T: "wann"
      L: "wo"
      A: "was"
    concepts: [ syntax.parts, syntax.verb-position-2, syntax.inversion ]
    instruction: "Lege die Teile in die Felder. Es gibt mehrere Lösungen: Jeder Teil kann zuerst stehen."
    explanation: "Das Verb steht auf Position 2. Die anderen Teile stehen im Mittelfeld in der normalen Reihenfolge: Subjekt, Zeit, Objekt, Ort."
    items:
      - { type: parts-boxes, parts: "ich/S lerne/V heute/T Deutsch/A" }
      - { type: parts-boxes, parts: "Mia/S trinkt/V morgens/T Kaffee/A" }
      - { type: parts-boxes, parts: "wir/S wohnen/V in_Berlin/L" }
      - { type: parts-boxes, parts: "Ben/S spielt/V heute/T Fußball/A" }
      - { type: parts-boxes, parts: "ich/S arbeite/V heute/T im_Büro/L" }
      - { type: parts-boxes, parts: "Anna/S kauft/V heute/T im_Supermarkt/L Brot/A" }
      - { type: parts-boxes, parts: "wir/S essen/V abends/T zu_Hause/L Suppe/A" }
      - { type: parts-boxes, parts: "du/S lernst/V jeden_Tag/T Wörter/A" }

  - id: questions
    title: "Fragen"
    count: 4
    boxes:
      - "Position 1"
      - "Verb"
      - "Mittelfeld"
    roleLabels:
      Q: "Fragewort"
      V: "Verb"
      S: "wer"
      A: "was"
      L: "wo"
    concepts: [ syntax.w-question ]
    instruction: "Bilde eine Frage. Das Fragewort steht zuerst."
    explanation: "Fragewort auf Position 1, Verb auf Position 2, Subjekt im Mittelfeld."
    items:
      - { type: boxes, chunks: [ wo, wohnst, du ], roles: [ Q, V, S ], end: "?", solutions: [ [ [ wo ], [ wohnst ], [ du ] ] ] }
      - { type: boxes, chunks: [ was, lernt, Mia ], roles: [ Q, V, S ], end: "?", solutions: [ [ [ was ], [ lernt ], [ Mia ] ] ] }
      - { type: boxes, chunks: [ wann, spielt, Ben, Fußball ], roles: [ Q, V, S, A ], end: "?", solutions: [ [ [ wann ], [ spielt ], [ Ben, Fußball ] ] ] }
      - { type: boxes, chunks: [ wo, kauft, Anna, Brot ], roles: [ Q, V, S, A ], end: "?", solutions: [ [ [ wo ], [ kauft ], [ Anna, Brot ] ] ] }

  - id: puzzle
    title: "Satzpuzzle"
    count: 6
    concepts: [ syntax.mittelfeld-order, syntax.verb-position-2 ]
    instruction: "Bringe die Teile in die normale Reihenfolge. Beginne mit dem Subjekt."
    explanation: "Subjekt, Verb, Zeit, Objekt, Ort."
    items:
      - { type: parts-order, parts: "ich/S lerne/V heute/T Deutsch/A" }
      - { type: parts-order, parts: "Ben/S kauft/V heute/T Brot/A im_Supermarkt/L" }
      - { type: parts-order, parts: "wir/S spielen/V morgen/T Fußball/A" }
      - { type: parts-order, parts: "Mia/S arbeitet/V heute/T zu_Hause/L" }
      - { type: parts-order, parts: "sie/S trinken/V abends/T Tee/A" }
      - { type: parts-order, parts: "Anna/S liest/V heute/T Zeitung/A im_Park/L" }
      - { type: parts-order, parts: "Mia/S trinkt/V heute/T Kaffee/A" }
      - { type: parts-order, parts: "heute/T spielt/V Ben/S Fußball/A", start: T, instruction: "Bringe die Teile in die richtige Reihenfolge. Beginne mit „heute“." }

  - id: correct
    title: "Was ist richtig?"
    count: 6
    concepts: [ syntax.verb-position-2, syntax.inversion ]
    instruction: "Tippe den richtigen Satz an."
    items:
      - type: pick
        options: [ "Heute spiele ich Fußball.", "Heute ich spiele Fußball.", "Heute spielen Fußball ich." ]
        answer: "Heute spiele ich Fußball."
        explanation: "Das Verb bleibt auf Position 2. Das Subjekt steht nach dem Verb."
      - type: pick
        options: [ "Ich lerne heute Deutsch.", "Ich heute lerne Deutsch.", "Ich Deutsch lerne heute." ]
        answer: "Ich lerne heute Deutsch."
        explanation: "Subjekt, Verb auf Position 2, Zeit, Objekt."
      - type: pick
        options: [ "Wo wohnst du?", "Wo du wohnst?", "Wo wohnen sie du?" ]
        answer: "Wo wohnst du?"
        explanation: "Fragewort, Verb, Subjekt."
      - type: pick
        options: [ "In Berlin wohne ich.", "In Berlin ich wohne.", "In Berlin wohnt ich." ]
        answer: "In Berlin wohne ich."
        explanation: "Ein Ort auf Position 1: Verb auf Position 2, dann das Subjekt."
      - type: pick
        options: [ "Ben kauft heute Brot im Supermarkt.", "Ben kauft Brot heute im Supermarkt.", "Ben heute kauft Brot im Supermarkt." ]
        answer: "Ben kauft heute Brot im Supermarkt."
        explanation: "Normale Reihenfolge: Zeit, Objekt, Ort."
      - type: pick
        options: [ "Morgen kocht Mia Suppe.", "Morgen Mia kocht Suppe.", "Mia morgen kocht Suppe." ]
        answer: "Morgen kocht Mia Suppe."
        explanation: "„Morgen“ steht auf Position 1, deshalb kommt jetzt das Verb."

  - id: write
    title: "Schreiben"
    concepts: [ writing.simple-sentences, syntax.parts ]
    instruction: "Schreibe 4 kurze Sätze oder mehr. Benutze die Wörter."
    items:
      - type: free-writing
        task: "Schreibe über deinen Tag: Was machst du? Wann? Wo?"
        words: [ heute, morgens, abends, in, zu Hause ]
        minSentences: 4
        checklist:
          - "Das Verb steht auf Position 2."
          - "Ich habe eine Zeit (zum Beispiel „heute“) und einen Ort (zum Beispiel „in Berlin“) benutzt."
          - "Jeder Satz hat höchstens 5 Teile."
        model: "Ich stehe morgens um sieben Uhr auf. Ich trinke Kaffee. Abends koche ich Suppe. Heute lerne ich Deutsch."
