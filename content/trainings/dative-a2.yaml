# Training: the Dativ (A2). Articles, wem?, pronouns, verbs and prepositions with Dativ, Dativ before Akkusativ.
# Articles are shown in their gender colour: der blue, die red, das green, plural orange.
# Original content, written in German.
kind: lesson
id: dative-a2
title: "Dativ"
level: A2
skill: grammar
minutes: 30
status: draft
description: "Manche Verben brauchen ein Dativobjekt: Ich helfe dem Mann. Mit Artikeln, Pronomen (mir, dir, ihm …), Verben und Präpositionen mit Dativ und Dativ vor Akkusativ: Ich gebe dem Kind einen Apfel."
canDo:
  - "Ich kann ein Dativobjekt und die Verben dazu erkennen."
  - "Ich kann „dem“, „der“, „den“, „einem“, „einer“, „meinem“, „meiner“ benutzen."
  - "Ich kann die Pronomen „mir“, „dir“, „ihm“, „ihr“, „uns“, „euch“, „ihnen“ benutzen."
  - "Ich kann häufige Verben und Präpositionen mit Dativ benutzen."

articles:
  definite:
    label: "der, die, das"
    nom: [ der, die, das, die ]
    akk: [ den, die, das, die ]
    dat: [ dem, der, dem, den ]
  indefinite:
    label: "ein, eine"
    nom: [ ein, eine, ein, "" ]
    akk: [ einen, eine, ein, "" ]
    dat: [ einem, einer, einem, "" ]
  possessive:
    label: "mein, meine"
    nom: [ mein, meine, mein, meine ]
    akk: [ meinen, meine, mein, meine ]
    dat: [ meinem, meiner, meinem, meinen ]
  negative:
    label: "kein, keine"
    nom: [ kein, keine, kein, keine ]
    akk: [ keinen, keine, kein, keine ]
    dat: [ keinem, keiner, keinem, keinen ]

understand:
  - type: dialogue
    title: "Hör zu: Wer bekommt was?"
    lines:
      - { who: Mia, say: "Ich <v>schenke</v> <das>dem</das> Kind <das>ein</das> Buch. <v>Hilfst</v> du mir?" }
      - { who: Ben, say: "Ja, gern. <v>Gefällt</v> das Buch <das>dem</das> Kind?" }
      - { who: Mia, say: "Ich glaube, es <v>gefällt</v> <das>ihm</das>. Ich <v>danke</v> dir!" }
      - { who: Ben, say: "Kein Problem. Ich <v>gebe</v> <die>der</die> Frau an der Kasse das Geld." }

  - type: text
    title: "Objekte und Fälle"
    body:
      - "Objekte im Satz können im Akkusativ, im Dativ oder (selten) im Genitiv stehen. Das Verb bestimmt, welchen Fall es braucht. Dann sieht der Artikel anders aus."
      - "<p>Ich</p> <v>helfe</v> <das>dem</das> Mann."
      - "Hier braucht das Verb „helfen“ ein Dativobjekt: Aus „der Mann“ wird „dem Mann“. Tipp: Ein Dativobjekt ist oft eine Person, und du findest es mit der Frage „Wem?“ (Wem helfe ich? – dem Mann). Wichtiger ist aber: Lerne das Verb zusammen mit seinem Fall."

  - type: parts-lab
    title: "Dieselben Rollen, andere Reihenfolge"
    intro: "Wähle einen Satz und einen Teil für Position 1. Die Reihenfolge ändert sich, die Rollen bleiben gleich. Der Artikel zeigt die Rolle."
    roles:
      S: "wer macht es (Subjekt, Nominativ)"
      V: "Verb"
      T: "Zeit"
      D: "Dativobjekt"
      A: "Akkusativobjekt"
    sentences:
      - { parts: [ { t: der Lehrer, r: S }, { t: hilft, r: V }, { t: dem Schüler, r: D } ], starts: [ S, D ] }
      - { parts: [ { t: ich, r: S }, { t: schenke, r: V }, { t: meiner Freundin, r: D }, { t: einen Pulli, r: A } ], starts: [ S, D, A ] }

  - type: detective
    title: "Satz-Detektiv"
    intro: "Tippe einen Teil an. Du siehst die Frage, die ihn findet, und seine Rolle."
    roles:
      S: "Subjekt (Nominativ)"
      V: "Verb (Position 2)"
      T: "Zeit"
      D: "Dativobjekt"
      A: "Akkusativobjekt"
    sentences:
      - parts: [ { t: Heute, r: T, q: "Wann schenkt Ben seiner Oma eine Blume?" }, { t: schenkt, r: V, q: "Was macht Ben?" }, { t: Ben, r: S, q: "Wer schenkt?" }, { t: seiner Oma, r: D, q: "Wem schenkt Ben eine Blume?" }, { t: eine Blume, r: A, q: "Was schenkt Ben seiner Oma?" } ]

  - type: article-table
    title: "Die Artikel: der, die, das"
    intro: "Schau auf die Tabelle. Die Farbe zeigt das Genus vom Nomen. Im Dativ bekommt jedes Genus eine neue Form."
    kinds: [ definite ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: dat, label: Dativ }
    note: "der → <der>dem</der>, die → <die>der</die>, das → <das>dem</das>, die (Plural) → <pl>den</pl> + Nomen mit -n."

  - type: article-table
    title: "ein, eine"
    kinds: [ indefinite ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: dat, label: Dativ }
    note: "ein → <der>einem</der>, eine → <die>einer</die>, ein → <das>einem</das>. „ein“ hat keinen Plural."

  - type: article-table
    title: "mein, meine"
    kinds: [ possessive ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: dat, label: Dativ }
    note: "mein → <der>meinem</der>, meine → <die>meiner</die>, mein → <das>meinem</das>, meine (Plural) → <pl>meinen</pl>. „dein“, „sein“, „ihr“ … funktionieren genauso."

  - type: article-table
    title: "kein, keine"
    kinds: [ negative ]
    cases:
      - { id: nom, label: Nominativ }
      - { id: dat, label: Dativ }
    note: "kein → <der>keinem</der>, keine → <die>keiner</die>, kein → <das>keinem</das>, keine (Plural) → <pl>keinen</pl>."

  - type: case-lab
    title: "Das Fall-Labor"
    intro: "Wähle einen Artikel, einen Fall und ein Nomen. Der Artikel, der sich ändert, ist markiert."
    kinds: [ definite, indefinite, possessive, negative ]
    cases:
      - id: nom
        label: Nominativ
        frame: [ "___ ist hier.", "___ sind hier." ]
        rule: "Nominativ: Wer? oder Was? – das Subjekt."
      - id: dat
        label: Dativ
        frame: "Ich helfe ___."
        rule: "Dativ: Jedes Genus bekommt eine neue Form. Plural-Nomen bekommen -n."
    nouns:
      - { g: m, noun: Mann }
      - { g: m, noun: Freund }
      - { g: f, noun: Frau }
      - { g: f, noun: Lehrerin }
      - { g: n, noun: Kind }
      - { g: n, noun: Baby }
      - { g: pl, noun: Kinder, dat: Kindern }
      - { g: pl, noun: Freunde, dat: Freunden }

  - type: rule
    title: "Plural-Nomen im Dativ"
    body:
      - "Im Dativ Plural bekommt das Nomen -n: <pl>die Kinder</pl> → Ich helfe <pl>den</pl> Kinder<en>n</en>."
      - "Kein zusätzliches -n, wenn der Plural schon auf -n oder -s endet: mit <pl>den</pl> Frauen, mit <pl>den</pl> Autos."

  - type: rule
    title: "Pronomen im Dativ"
    body:
      - "ich → mir · du → dir · er → ihm · sie → ihr · es → ihm · wir → uns · ihr → euch · sie → ihnen · Sie → Ihnen"
      - "Ich helfe <das>dem</das> Mann. → Ich helfe <der>ihm</der>."
      - "Ich helfe <die>der</die> Frau. → Ich helfe <die>ihr</die>."
      - "Der Film gefällt <v>mir</v>. Das Buch gehört <v>dir</v>."

  - type: rule
    title: "Verben nur mit Dativobjekt"
    body:
      - "helfen: Ich <v>helfe</v> <das>dem</das> Kind."
      - "danken, antworten, gratulieren: Wir <v>danken</v> <die>der</die> Lehrerin."
      - "gefallen, schmecken, gehören: Das Essen <v>schmeckt</v> <der>dem</der> Gast."
      - "Diese Verben lernst du am besten zusammen mit dem Dativ."

  - type: rule
    title: "Verben mit Dativ und Akkusativ"
    body:
      - "geben, schenken, zeigen, schicken, bringen, erklären"
      - "<p>Ich</p> <v>schenke</v> <die>der</die> Oma <die>eine</die> Blume."
      - "Meistens steht die Person (Dativ) vor der Sache (Akkusativ)."

  - type: rule
    title: "Präpositionen mit Dativ"
    body:
      - "Nach „mit“, „bei“, „nach“, „von“, „zu“, „aus“, „seit“ steht immer der Dativ."
      - "Ich fahre <v>mit</v> <das>dem</das> Bus. Sie wohnt <v>bei</v> <die>der</die> Oma."
      - "zu + dem = zum, zu + der = zur: Ich gehe zum Arzt. Ich gehe zur Schule."
      - "bei + dem = beim, von + dem = vom: Ich bin beim Arzt. Das Buch ist vom Lehrer."

  - type: rule
    title: "Achtung!"
    body:
      - "<x>Ich helfe den Mann.</x> ✗ Ich helfe <das>dem</das> Mann. ✓"
      - "Ich gebe einen Apfel dem Kind ist nicht falsch, aber normal ist: Ich gebe <das>dem</das> Kind <der>einen</der> Apfel."
      - "<x>Ich fahre mit den Bus.</x> ✗ Ich fahre mit <das>dem</das> Bus. ✓"

practice:
  - id: definite
    title: "dem, der, den"
    count: 8
    concepts: [ case.dat-articles, case.question-wem ]
    instruction: "Welche Form ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Dativ: der → dem, die → der, das → dem, Plural → den."
    items:
      - type: article-pick
        kind: definite
        case: dat
        items:
          - { g: m, noun: Mann, frame: "Ich helfe ___ Mann." }
          - { g: f, noun: Frau, frame: "Wir helfen ___ Frau." }
          - { g: n, noun: Kind, frame: "Sie hilft ___ Kind." }
          - { g: m, noun: Lehrer, frame: "Wir danken ___ Lehrer." }
          - { g: f, noun: Lehrerin, frame: "Er antwortet ___ Lehrerin." }
          - { g: n, noun: Baby, frame: "Ich zeige ___ Baby das Foto." }
          - { g: m, noun: Gast, frame: "Das Essen schmeckt ___ Gast." }
          - { g: f, noun: Oma, frame: "Das Haus gehört ___ Oma." }

  - id: indefinite
    title: "einem, einer"
    count: 8
    concepts: [ case.dat-articles ]
    instruction: "Welche Form von „ein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "Dativ: ein (m) → einem, eine (f) → einer, ein (n) → einem."
    items:
      - type: article-pick
        kind: indefinite
        case: dat
        items:
          - { g: m, noun: Freund, frame: "Ich schreibe ___ Freund." }
          - { g: f, noun: Freundin, frame: "Ich schreibe ___ Freundin." }
          - { g: n, noun: Kind, frame: "Wir schenken ___ Kind ein Buch." }
          - { g: m, noun: Mann, frame: "Sie hilft ___ Mann." }
          - { g: f, noun: Frau, frame: "Er gibt ___ Frau die Tasche." }
          - { g: n, noun: Baby, frame: "Sie singt ___ Baby ein Lied." }
          - { g: m, noun: Arzt, frame: "Ich erkläre ___ Arzt das Problem." }
          - { g: f, noun: Kollegin, frame: "Ich schicke ___ Kollegin eine E-Mail." }

  - id: possessive
    title: "meinem, meiner, meinen"
    count: 8
    concepts: [ case.dat-articles ]
    instruction: "Welche Form von „mein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "„mein“ funktioniert wie „ein“: meinem (m, n), meiner (f), meinen (Plural)."
    items:
      - type: article-pick
        kind: possessive
        case: dat
        items:
          - { g: m, noun: Bruder, frame: "Ich helfe ___ Bruder." }
          - { g: f, noun: Schwester, frame: "Ich helfe ___ Schwester." }
          - { g: n, noun: Kind, frame: "Ich lese ___ Kind ein Buch vor." }
          - { g: pl, noun: Eltern, frame: "Ich danke ___ Eltern." }
          - { g: m, noun: Vater, frame: "Das Auto gehört ___ Vater." }
          - { g: f, noun: Mutter, frame: "Ich gratuliere ___ Mutter." }
          - { g: pl, noun: Freunde, frame: "Ich zeige ___ Freunden die Stadt." }
          - { g: n, noun: Baby, frame: "Ich gebe ___ Baby die Flasche." }

  - id: negative
    title: "keinem, keiner, keinen"
    count: 6
    concepts: [ case.dat-articles ]
    instruction: "Welche Form von „kein“ ist richtig? Der Artikel vom Nomen steht in seiner Farbe."
    explanation: "„kein“ funktioniert wie „mein“: keinem (m, n), keiner (f), keinen (Plural)."
    items:
      - type: article-pick
        kind: negative
        case: dat
        items:
          - { g: m, noun: Mann, frame: "Ich antworte ___ Mann." }
          - { g: f, noun: Frau, frame: "Er hilft ___ Frau." }
          - { g: n, noun: Kind, frame: "Sie gibt ___ Kind ein Eis." }
          - { g: pl, noun: Leute, frame: "Ich vertraue ___ Leuten." }
          - { g: m, noun: Freund, frame: "Sie schreibt ___ Freund." }
          - { g: f, noun: Lehrerin, frame: "Er dankt ___ Lehrerin nicht." }

  - id: whom
    title: "Das Objekt finden"
    count: 8
    shuffle: true
    concepts: [ case.question-wem ]
    items:
      - { type: pick, instruction: "Welcher Teil ist das Dativobjekt?", prompt: "Ich helfe dem Mann.", options: [ "Ich", "helfe", "dem Mann" ], answer: "dem Mann", explanation: "Wem helfe ich? – dem Mann." }
      - { type: pick, instruction: "Welcher Teil ist das Dativobjekt?", prompt: "Wir danken der Lehrerin.", options: [ "Wir", "danken", "der Lehrerin" ], answer: "der Lehrerin", explanation: "Wem danken wir? – der Lehrerin." }
      - { type: pick, instruction: "Welcher Teil ist das Dativobjekt?", prompt: "Das Buch gehört meiner Schwester.", options: [ "Das Buch", "gehört", "meiner Schwester" ], answer: "meiner Schwester", explanation: "Wem gehört das Buch? – meiner Schwester." }
      - { type: pick, instruction: "Welcher Teil ist das Dativobjekt?", prompt: "Ich gebe dem Kind einen Apfel.", options: [ "dem Kind", "einen Apfel" ], answer: "dem Kind", explanation: "Wem gebe ich einen Apfel? – dem Kind. „einen Apfel“ ist das Akkusativobjekt." }
      - { type: pick, instruction: "Welcher Teil ist das Akkusativobjekt?", prompt: "Sie schenkt der Oma eine Blume.", options: [ "der Oma", "eine Blume" ], answer: "eine Blume", explanation: "Was schenkt sie? – eine Blume." }
      - { type: pick, instruction: "Welcher Teil ist das Dativobjekt?", prompt: "Der Film gefällt den Kindern.", options: [ "Der Film", "gefällt", "den Kindern" ], answer: "den Kindern", explanation: "Wem gefällt der Film? – den Kindern." }
      - { type: pick, instruction: "Welcher Teil ist das Dativobjekt?", prompt: "Wir zeigen dem Gast die Stadt.", options: [ "dem Gast", "die Stadt" ], answer: "dem Gast", explanation: "Wem zeigen wir die Stadt? – dem Gast." }
      - { type: pick, instruction: "Welcher Teil ist das Dativobjekt?", prompt: "Ben schickt seiner Freundin ein Foto.", options: [ "seiner Freundin", "ein Foto" ], answer: "seiner Freundin", explanation: "Wem schickt Ben ein Foto? – seiner Freundin." }

  - id: subject
    title: "Wer macht was?"
    count: 5
    shuffle: true
    concepts: [ case.dat-articles, syntax.inversion ]
    instruction: "Das Dativobjekt steht vorn. Welcher Teil ist das Subjekt?"
    items:
      - { type: pick, prompt: "Dem Kind hilft der Lehrer.", options: [ "der Lehrer", "dem Kind" ], answer: "der Lehrer", explanation: "„dem Kind“ ist das Dativobjekt. Der Lehrer hilft." }
      - { type: pick, prompt: "Der Frau gehört das Auto.", options: [ "das Auto", "der Frau" ], answer: "das Auto", explanation: "„der Frau“ ist das Dativobjekt. Das Auto gehört ihr." }
      - { type: pick, prompt: "Meinem Bruder schenkt Mia ein Buch.", options: [ "Mia", "meinem Bruder" ], answer: "Mia", explanation: "„meinem Bruder“ ist das Dativobjekt. Mia schenkt." }
      - { type: pick, prompt: "Den Kindern gefällt der Film.", options: [ "der Film", "den Kindern" ], answer: "der Film", explanation: "„den Kindern“ (Dativ Plural + n). Der Film ist das Subjekt." }
      - { type: pick, prompt: "Der Lehrerin dankt der Schüler.", options: [ "der Schüler", "der Lehrerin" ], answer: "der Schüler", explanation: "„der Lehrerin“ ist Dativ. „der Schüler“ (maskulin) kann nur das Subjekt sein." }

  - id: both
    title: "Beide Objekte"
    count: 6
    shuffle: true
    concepts: [ case.dat-before-akk, case.dat-articles ]
    instruction: "Wähle für beide Lücken die richtige Form. Tippe dann auf „Prüfen“."
    items:
      - { type: gaps, sentence: "Ich schenke {0} Mutter {1} Blume.", gaps: [ { options: [ meine, meiner, meinen ], answer: meiner }, { options: [ ein, eine, einen ], answer: eine } ], explanation: "Dativ feminin: meiner Mutter. Akkusativ feminin bleibt: eine Blume." }
      - { type: gaps, sentence: "Der Lehrer gibt {0} Schüler {1} Heft.", gaps: [ { options: [ dem, den, der ], answer: dem }, { options: [ das, dem, die ], answer: das } ], explanation: "Dativ maskulin: dem Schüler. Akkusativ Neutrum bleibt: das Heft." }
      - { type: gaps, sentence: "Wir zeigen {0} Freund {1} Stadt.", gaps: [ { options: [ unserem, unseren, unser ], answer: unserem }, { options: [ die, der, das ], answer: die } ], explanation: "Dativ maskulin: unserem Freund. Akkusativ feminin: die Stadt." }
      - { type: gaps, sentence: "Die Mutter kauft {0} Kind {1} Rucksack.", gaps: [ { options: [ dem, das, der ], answer: dem }, { options: [ ein, einen, einem ], answer: einen } ], explanation: "Dativ Neutrum: dem Kind. Akkusativ maskulin: einen Rucksack." }
      - { type: gaps, sentence: "Ich schicke {0} Oma {1} Brief.", gaps: [ { options: [ meine, meiner, meinen ], answer: meiner }, { options: [ ein, einen, einem ], answer: einen } ], explanation: "Dativ feminin: meiner Oma. Akkusativ maskulin: einen Brief." }
      - { type: gaps, sentence: "Er erklärt {0} Kindern {1} Regel.", gaps: [ { options: [ die, den, der ], answer: den }, { options: [ die, der, den ], answer: die } ], explanation: "Dativ Plural: den Kindern. Akkusativ feminin: die Regel." }

  - id: pronouns
    title: "Pronomen"
    count: 8
    concepts: [ case.dat-pronouns ]
    instruction: "Welches Pronomen ersetzt das Nomen?"
    explanation: "der → ihm, die → ihr, das → ihm, Plural → ihnen."
    items:
      - { type: pick, sentence: "Ich helfe dem Mann. Ich helfe ___.", options: [ ihm, ihn, ihr, ihnen ], answer: ihm }
      - { type: pick, sentence: "Ich helfe der Frau. Ich helfe ___.", options: [ ihr, ihm, sie, ihnen ], answer: ihr }
      - { type: pick, sentence: "Wir danken dem Kind. Wir danken ___.", options: [ ihm, es, ihr, ihnen ], answer: ihm }
      - { type: pick, sentence: "Ich antworte den Kindern. Ich antworte ___.", options: [ ihnen, ihm, sie, ihr ], answer: ihnen }
      - { type: pick, sentence: "Das ist dein Buch. Es gehört ___.", options: [ dir, dich, du, euch ], answer: dir }
      - { type: pick, sentence: "Du hilfst mir. Ich helfe ___ auch.", options: [ dir, dich, du, ihm ], answer: dir }
      - { type: pick, sentence: "Der Film gefällt ___ (ich).", options: [ mir, mich, ich, dir ], answer: mir }
      - { type: pick, sentence: "Maria kommt morgen. Ich gebe ___ das Buch.", options: [ ihr, sie, ihm, ihnen ], answer: ihr }
      - { type: pick, sentence: "Wir gratulieren euch. Wir gratulieren ___.", options: [ euch, ihr, dir, uns ], answer: euch }

  - id: verbs
    title: "Verben"
    shuffle: false
    items:
      - type: pairs
        concepts: [ case.dat-verbs ]
        instruction: "Tippe ein Verb an, dann den Satz mit Dativobjekt."
        pairs: [ [ helfen, Ich helfe dem Mann. ], [ danken, Wir danken der Lehrerin. ], [ gefallen, Der Film gefällt mir. ], [ gehören, Das Auto gehört meinem Vater. ], [ schmecken, Die Suppe schmeckt dem Kind. ] ]
      - type: pairs
        concepts: [ case.dat-pronouns ]
        instruction: "Tippe ein Pronomen an, dann die Dativ-Form."
        pairs: [ [ ich, mir ], [ du, dir ], [ er, ihm ], [ sie (singular), ihr ], [ wir, uns ], [ ihr, euch ] ]
      - type: pairs
        concepts: [ case.dat-articles ]
        instruction: "Tippe ein Wort an, dann die Dativ-Form."
        pairs: [ [ der Mann, dem Mann ], [ die Frau, der Frau ], [ das Kind, dem Kind ], [ ein Freund, einem Freund ], [ meine Schwester, meiner Schwester ] ]

  - id: prepositions
    title: "Präpositionen"
    count: 8
    concepts: [ case.dat-prepositions ]
    instruction: "Nach diesen Präpositionen steht immer der Dativ. Welche Form ist richtig?"
    explanation: "mit, bei, nach, von, zu, aus, seit + Dativ."
    items:
      - type: article-pick
        kind: definite
        case: dat
        items:
          - { g: m, noun: Bus, frame: "Ich fahre mit ___ Bus." }
          - { g: f, noun: Freundin, frame: "Ich gehe mit ___ Freundin einkaufen." }
          - { g: n, noun: Kind, frame: "Sie spielt mit ___ Kind." }
          - { g: f, noun: Oma, frame: "Er wohnt bei ___ Oma." }
          - { g: m, noun: Lehrer, frame: "Das ist ein Brief von ___ Lehrer." }
          - { g: f, noun: Küche, frame: "Der Kaffee kommt aus ___ Küche." }
          - { g: n, noun: Haus, frame: "Er kommt aus ___ Haus." }
          - { g: pl, noun: Freunde, frame: "Wir spielen mit ___ Freunden." }
      - type: article-pick
        kind: possessive
        case: dat
        items:
          - { g: m, noun: Bruder, frame: "Ich wohne bei ___ Bruder." }
          - { g: f, noun: Schwester, frame: "Ich fahre mit ___ Schwester." }

  - id: contractions
    title: "zum, zur, beim, vom"
    shuffle: true
    concepts: [ case.dat-prepositions ]
    items:
      - { type: pick, sentence: "Ich gehe ___ Arzt.", options: [ zum, zur, beim, vom ], answer: zum, explanation: "zu + dem Arzt = zum Arzt („Arzt“ ist maskulin)." }
      - { type: pick, sentence: "Ich gehe ___ Schule.", options: [ zur, zum, beim, vom ], answer: zur, explanation: "zu + der Schule = zur Schule (feminin)." }
      - { type: pick, sentence: "Ich bin ___ Arzt.", options: [ beim, zum, zur, vom ], answer: beim, explanation: "bei + dem Arzt = beim Arzt." }
      - { type: pick, sentence: "Das Geschenk ist ___ Lehrer.", options: [ vom, zum, beim, zur ], answer: vom, explanation: "von + dem Lehrer = vom Lehrer." }
      - { type: pick, sentence: "Wir gehen ___ Bahnhof.", options: [ zum, zur, beim, vom ], answer: zum, explanation: "zu + dem Bahnhof = zum Bahnhof." }
      - { type: pick, sentence: "Sie geht ___ Bäckerei.", options: [ zur, zum, beim, vom ], answer: zur, explanation: "zu + der Bäckerei = zur Bäckerei." }

  - id: correct
    title: "Was ist richtig?"
    count: 8
    concepts: [ case.dat-articles, case.dat-verbs, case.dat-before-akk ]
    instruction: "Tippe den richtigen Satz an."
    items:
      - type: pick
        options: [ "Ich helfe dem Mann.", "Ich helfe den Mann.", "Ich helfe der Mann." ]
        answer: "Ich helfe dem Mann."
        explanation: "„helfen“ steht mit Dativ: der Mann → dem Mann."
      - type: pick
